// ──────────────────────────────────────────────────────────
// Payslips management — Owner-only writes, HR read-only.
// Split into two compute engines:
//   • new_joined  → salary × (P.DAYS + L.DAYS) ÷ days_in_month, plus
//                    bonus + credit − dues − advance.
//   • esi_pf      → Basic/HRA/DA pro-ration with EPF 12% (cap ₹15k),
//                    ESI 0.75% (cap ₹21k gross), matches the Silks
//                    ESI/PF template the Owner supplied.
// Both engines grant a 4-day paid-leave bank; unused leaves add to
// salary via L.DAYS. Attendance for the selected month auto-seeds
// P.DAYS and L.DAYS; HR can still override per row.
// ──────────────────────────────────────────────────────────
const firstOfMonth = (d) => fmtDateISO(new Date(d.getFullYear(), d.getMonth(), 1));

const rupees = (n) => {
  if (n == null) return '—';
  return '₹' + Number(n).toLocaleString('en-IN');
};

const daysInMonthIso = (iso) => {
  if (!iso) return 30;
  const d = new Date(iso + (iso.length === 10 ? 'T00:00:00' : ''));
  return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
};
const num = (v) => {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
};
const round = (n) => Math.round(num(n));

// Paid-leave bank: 4 days/month. Unused days are paid on top of salary.
const PAID_LEAVE_BANK = 4;
const derivedLdays = (leavesTaken) => Math.max(0, PAID_LEAVE_BANK - num(leavesTaken));

// Compute { amount, net } for a new-joined payslip.
const computeNewJoined = ({ salary, days, p_days, l_days, bonus, dues, credit, advance }) => {
  const total = num(p_days) + num(l_days);
  const amount = days > 0 ? round(num(salary) * total / num(days)) : 0;
  const net = amount + num(bonus) + num(credit) - num(dues) - num(advance);
  return { amount, net };
};

// Compute the full ESI/PF breakdown matching the Silks Excel.
const computeEsiPf = ({ salary, hra, wa, da, days, p_days, l_days, bonus, incentive, diff_pct, advance }) => {
  const s = num(salary), h = num(hra), w = num(wa), dd = num(da);
  const d = num(days),   p = num(p_days), l = num(l_days);
  const n_basics = Math.max(0, s - h - w - dd);
  const p_basics = d > 0 ? round(n_basics * p / d) : 0;
  const p_da     = d > 0 ? round(dd       * p / d) : 0;
  const p_hra    = d > 0 ? round(h        * p / d) : 0;
  const ld_s     = d > 0 ? round(s        * l / d) : 0;
  const wages    = p_basics + p_da;
  const total    = wages + p_hra + ld_s + w;
  const epf_wages = Math.min(15000, wages);
  const esi_wages = total <= 21000 ? total : 0;
  const epf_12    = round(epf_wages * 0.12);
  const esi_075   = round(esi_wages * 0.0075);
  const diff      = round(wages * num(diff_pct) / 100);
  const esi_epf   = epf_12 + esi_075 + diff;
  const net_wages = total + num(bonus) + num(incentive) - esi_epf - num(advance);
  return {
    n_basics, p_basics, p_da, p_hra, ld_s, wa_paid: w,
    wages, total, epf_wages, esi_wages,
    epf_12, esi_075, diff, esi_epf, net_wages,
  };
};

// Count attendance rows into P.DAYS + L.DAYS for the selected month.
// late still counts toward P.DAYS; on_leave eats into the 4-day bank.
const attendanceToPayDays = (rows) => {
  const c = { present: 0, late: 0, on_leave: 0, absent: 0 };
  (rows || []).forEach(r => { c[r.status] = (c[r.status] || 0) + 1; });
  return {
    p_days: c.present + c.late,
    l_days: derivedLdays(c.on_leave),
    late_days: c.late,
    leaves_taken: c.on_leave,
    absent_days: c.absent,
  };
};

const PayslipsPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);

  const [month, setMonth] = useState(() => firstOfMonth(new Date()));
  const [search, setSearch] = useState('');
  const [sectionFilter, setSectionFilter] = useState('all');
  const [typeFilter, setTypeFilter] = useState('all'); // 'all' | 'esi_pf' | 'new_joined'

  const [rows, setRows] = useState([]);
  const [attendance, setAttendance] = useState({}); // employee_id -> { p_days, l_days, ... }
  const [da, setDa] = useState(7313);
  const [loading, setLoading] = useState(true);

  const { rows: employees } = useEmployees();

  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [bulkBusy, setBulkBusy] = useState(false);
  const [printing, setPrinting] = useState(false);
  const [exporting, setExporting] = useState(false);

  const empById = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.id] = e; });
    return m;
  }, [employees]);
  // Everyone except Owner gets a payslip (HR, Manager, Supervisor, Staff).
  const eligibleList = useMemo(() =>
    employees.filter(e => e.user_type !== 'owner' && e.is_active)
      .sort((a, b) => a.name.localeCompare(b.name))
  , [employees]);

  const daysInMonth = useMemo(() => daysInMonthIso(month), [month]);
  const monthEnd = useMemo(() => {
    const d = new Date(month + 'T00:00:00');
    return fmtDateISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  }, [month]);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [payRes, attRes, daRes] = await Promise.all([
      window.sb.from('payslips').select('*').eq('month', month).order('employee_id'),
      window.sb.from('attendance')
        .select('employee_id, status, date')
        .gte('date', month).lte('date', monthEnd),
      window.sb.from('app_settings').select('value').eq('key', 'payroll.da').maybeSingle(),
    ]);
    setRows(payRes.data || []);
    // Bucket attendance by employee, turn into { p_days, l_days, late_days, leaves_taken }.
    const byEmp = {};
    (attRes.data || []).forEach(r => {
      (byEmp[r.employee_id] = byEmp[r.employee_id] || []).push(r);
    });
    const stats = {};
    Object.keys(byEmp).forEach(id => { stats[id] = attendanceToPayDays(byEmp[id]); });
    setAttendance(stats);
    if (daRes.data?.value?.amount != null) setDa(Number(daRes.data.value.amount) || 7313);
    setLoading(false);
  }, [month, monthEnd]);

  useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel(`dash-payslips-${month}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'payslips', filter: `month=eq.${month}` },
        () => fetchAll())
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'attendance' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, month]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return rows.filter(r => {
      const emp = empById[r.employee_id];
      if (sectionFilter !== 'all' && emp?.section_id !== sectionFilter) return false;
      if (typeFilter !== 'all') {
        const rowType = r.salary_type || emp?.salary_type || 'new_joined';
        if (rowType !== typeFilter) return false;
      }
      if (q) {
        const name = (emp?.name || '').toLowerCase();
        if (!name.includes(q) && !r.employee_id.toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }, [rows, empById, sectionFilter, typeFilter, search]);

  const totals = useMemo(() => {
    const gross = filtered.reduce((s, r) => s + (r.gross || 0), 0);
    const net   = filtered.reduce((s, r) => s + (r.net   || 0), 0);
    const ded   = filtered.reduce((s, r) => s + (r.deductions || 0), 0);
    const paid  = filtered.filter(r => r.paid_at).length;
    return { gross, net, ded, paid };
  }, [filtered]);

  // Fetch active (unfinished) advances so we can auto-deduct the monthly
  // installment onto the payslip. The advance id is stashed on the draft
  // so `save()` can bump months_deducted after the insert.
  const fetchActiveAdvances = async (employeeId) => {
    if (!window.sb || !employeeId) return [];
    const { data } = await window.sb.from('advances')
      .select('id, monthly_deduction, months_total, months_deducted')
      .eq('employee_id', employeeId)
      .eq('status', 'approved');
    return (data || []).filter(a => a.months_deducted < a.months_total);
  };
  const sumAdvances = (advs) =>
    (advs || []).reduce((s, a) => s + (Number(a.monthly_deduction) || 0), 0);

  // Build the derived display values for a draft payslip.
  const recomputeDraft = (draft, employee, daValue) => {
    const shared = {
      salary:  num(draft.monthly_salary ?? employee?.monthly_salary),
      days:    num(draft.days_in_month  ?? daysInMonthIso(draft.month)),
      p_days:  num(draft.p_days),
      l_days:  num(draft.l_days),
      bonus:   num(draft.bonus),
      advance: num(draft.advance_amt),
    };
    if (draft.salary_type === 'esi_pf') {
      const calc = computeEsiPf({
        ...shared,
        hra:       num(draft.hra ?? employee?.hra),
        wa:        num(draft.wa  ?? employee?.wa),
        da:        num(daValue),
        incentive: num(draft.credit),         // new-joined 'Credit' column = ESI/PF 'Incentive'
        diff_pct:  num(draft.diff_pct),
      });
      return {
        ...draft,
        calc,
        gross:      calc.total + num(draft.bonus) + num(draft.credit),
        deductions: calc.esi_epf + num(draft.advance_amt),
        net:        calc.net_wages,
        amount:     calc.total,
      };
    }
    // new_joined
    const calc = computeNewJoined({ ...shared, dues: num(draft.dues), credit: num(draft.credit) });
    return {
      ...draft,
      calc,
      gross:      calc.amount + num(draft.bonus) + num(draft.credit),
      deductions: num(draft.dues) + num(draft.advance_amt),
      net:        calc.net,
      amount:     calc.amount,
    };
  };

  // Build an insert payload from the draft state.
  const draftToPayload = (draft) => {
    const base = {
      employee_id:   draft.employee_id,
      month:         draft.month,
      salary_type:   draft.salary_type,
      monthly_salary: num(draft.monthly_salary),
      hra:           draft.salary_type === 'esi_pf' ? num(draft.hra) : null,
      wa:            draft.salary_type === 'esi_pf' ? num(draft.wa)  : null,
      days_in_month: num(draft.days_in_month),
      p_days:        num(draft.p_days),
      l_days:        num(draft.l_days),
      amount:        num(draft.amount),
      bonus:         num(draft.bonus),
      dues:          num(draft.dues),
      credit:        num(draft.credit),
      advance_amt:   num(draft.advance_amt),
      diff_pct:      num(draft.diff_pct),
      gross:         num(draft.gross),
      deductions:    num(draft.deductions),
      net:           num(draft.net),
      paid_at:       draft.paid_at || null,
      bank_last4:    (draft.bank_last4 || '').trim() || null,
    };
    // Keep the legacy JSONB fields populated so the Reports CSV export
    // and any historical tooling still see a breakdown.
    const earnings = [];
    const deduct_items = [];
    if (draft.salary_type === 'esi_pf' && draft.calc) {
      const c = draft.calc;
      earnings.push({ label: 'Basic (pro-rated)', amount: c.p_basics });
      earnings.push({ label: 'DA (pro-rated)',    amount: c.p_da });
      earnings.push({ label: 'HRA (pro-rated)',   amount: c.p_hra });
      if (c.ld_s)   earnings.push({ label: `Leave encashment (${draft.l_days} d)`, amount: c.ld_s });
      if (c.wa_paid) earnings.push({ label: 'W.A.', amount: c.wa_paid });
      if (num(draft.bonus))  earnings.push({ label: 'Bonus',     amount: num(draft.bonus) });
      if (num(draft.credit)) earnings.push({ label: 'Incentive', amount: num(draft.credit) });
      if (c.epf_12)  deduct_items.push({ label: 'EPF 12%',  amount: c.epf_12 });
      if (c.esi_075) deduct_items.push({ label: 'ESI 0.75%', amount: c.esi_075 });
      if (c.diff)    deduct_items.push({ label: 'Diff 2%',  amount: c.diff });
    } else {
      earnings.push({ label: `Amount (${draft.p_days}+${draft.l_days}/${draft.days_in_month} d)`, amount: num(draft.amount) });
      if (num(draft.bonus))  earnings.push({ label: 'Bonus',  amount: num(draft.bonus) });
      if (num(draft.credit)) earnings.push({ label: 'Credit', amount: num(draft.credit) });
      if (num(draft.dues))   deduct_items.push({ label: 'Dues', amount: num(draft.dues) });
    }
    if (num(draft.advance_amt) && Array.isArray(draft._advances)) {
      draft._advances.forEach(a => {
        deduct_items.push({
          label: `Advance repayment (${a.months_deducted + 1}/${a.months_total})`,
          amount: a.monthly_deduction || 0,
          advance_id: a.id,
        });
      });
    } else if (num(draft.advance_amt)) {
      deduct_items.push({ label: 'Advance repayment', amount: num(draft.advance_amt) });
    }
    base.earnings = earnings;
    base.deduct_items = deduct_items;
    return base;
  };

  // Compose a brand-new draft for the given employee.
  const makeDraftForEmployee = async (emp, overrides = {}) => {
    const advs = await fetchActiveAdvances(emp.id);
    const stats = attendance[emp.id] || { p_days: daysInMonth, l_days: PAID_LEAVE_BANK };
    const draft = {
      id: null,
      _new: true,
      employee_id: emp.id,
      salary_type: emp.salary_type || 'new_joined',
      month,
      monthly_salary: num(emp.monthly_salary),
      hra: num(emp.hra),
      wa:  num(emp.wa),
      days_in_month: daysInMonth,
      p_days:  stats.p_days,
      l_days:  stats.l_days,
      bonus:   0,
      dues:    0,
      credit:  0,
      advance_amt: sumAdvances(advs),
      diff_pct: 0,
      _advances: advs,
      paid_at: null,
      bank_last4: '',
      ...overrides,
    };
    return recomputeDraft(draft, emp, da);
  };

  const startNew = async (employeeId) => {
    const emp = empById[employeeId];
    if (employeeId && emp) {
      setEditing(await makeDraftForEmployee(emp));
    } else {
      // Blank until an employee is picked.
      setEditing({
        id: null, _new: true, employee_id: '', salary_type: 'new_joined',
        month, monthly_salary: 0, hra: 0, wa: 0,
        days_in_month: daysInMonth, p_days: daysInMonth, l_days: PAID_LEAVE_BANK,
        bonus: 0, dues: 0, credit: 0, advance_amt: 0, diff_pct: 0,
        _advances: [], paid_at: null, bank_last4: '',
        amount: 0, gross: 0, deductions: 0, net: 0,
      });
    }
  };

  const pickEmployee = async (employeeId) => {
    const emp = empById[employeeId];
    if (!emp) return;
    setEditing(await makeDraftForEmployee(emp));
  };

  // Editing an existing row: if it pre-dates the new schema (no
  // salary_type), fall back to the stored gross/deductions so the form
  // at least renders something sensible.
  const startEdit = (row) => {
    const emp = empById[row.employee_id];
    const legacy = !row.salary_type;
    const draft = {
      ...row,
      _new: false,
      salary_type: row.salary_type || emp?.salary_type || 'new_joined',
      monthly_salary: row.monthly_salary ?? emp?.monthly_salary ?? 0,
      hra: row.hra ?? emp?.hra ?? 0,
      wa:  row.wa  ?? emp?.wa  ?? 0,
      days_in_month: row.days_in_month || daysInMonthIso(row.month),
      p_days:   row.p_days   ?? daysInMonthIso(row.month),
      l_days:   row.l_days   ?? 0,
      bonus:    row.bonus    ?? 0,
      dues:     row.dues     ?? 0,
      credit:   row.credit   ?? 0,
      advance_amt: row.advance_amt ?? 0,
      diff_pct: row.diff_pct ?? 0,
      _legacy: legacy,
    };
    setEditing(recomputeDraft(draft, emp, da));
  };
  const close = () => setEditing(null);

  // Update one field on the draft and re-run the compute engine.
  const patchDraft = (patch) => {
    setEditing(cur => {
      if (!cur) return cur;
      const emp = empById[cur.employee_id];
      return recomputeDraft({ ...cur, ...patch }, emp, da);
    });
  };

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.employee_id) { toast('Pick an employee'); return; }
    setSaving(true);
    try {
      const payload = draftToPayload(editing);
      if (editing._new) {
        const { error } = await window.sb.from('payslips').insert(payload);
        if (error) {
          toast(error.message.includes('duplicate')
            ? 'Payslip already exists for this employee this month'
            : 'Could not save (see console)');
          console.error(error);
        } else {
          await bumpAdvances(editing._advances);
          toast(editing._advances?.length
            ? `Payslip created · ${editing._advances.length} advance${editing._advances.length === 1 ? '' : 's'} updated`
            : 'Payslip created');
          close();
        }
      } else {
        const { error } = await window.sb.from('payslips').update(payload).eq('id', editing.id);
        if (error) { toast('Could not save'); console.error(error); }
        else { toast('Saved'); close(); }
      }
    } finally { setSaving(false); }
  };

  // Bump months_deducted on every advance that rode along with the
  // newly-created payslip; mark the advance 'completed' when it hits
  // months_total.
  const bumpAdvances = async (advs) => {
    if (!advs || !advs.length) return;
    const { data: fresh } = await window.sb.from('advances')
      .select('id, months_total, months_deducted')
      .in('id', advs.map(a => a.id));
    await Promise.all((fresh || []).map(a => {
      const next = (a.months_deducted || 0) + 1;
      const done = next >= a.months_total;
      return window.sb.from('advances').update({
        months_deducted: next,
        status: done ? 'completed' : 'approved',
      }).eq('id', a.id);
    }));
  };

  const del = async (row) => {
    if (!can('payslips', 'delete')) return;
    if (!window.confirm('Delete this payslip?')) return;
    await window.sb.from('payslips').delete().eq('id', row.id);
    toast('Deleted');
  };

  const markPaid = async (row) => {
    if (!can('payslips', 'edit')) return;
    await window.sb.from('payslips')
      .update({ paid_at: row.paid_at ? null : fmtDateISO(new Date()) })
      .eq('id', row.id);
  };

  // Bulk generate: one payslip per eligible employee of the chosen
  // salary_type who doesn't already have one this month. Uses the
  // month's attendance to pre-fill P.DAYS / L.DAYS.
  const bulkGenerate = async (kind) => {
    if (!can('payslips', 'create') || bulkBusy) return;
    const pool = eligibleList.filter(e => (e.salary_type || 'new_joined') === kind);
    const missing = pool.filter(e => !rows.find(r => r.employee_id === e.id));
    if (!pool.length) {
      toast(`No active ${kind === 'esi_pf' ? 'ESI / PF' : 'new-joined'} employees. Set their salary type on the Employees page first.`);
      return;
    }
    if (!missing.length) { toast(`All ${pool.length} employees already have a payslip this month`); return; }
    if (!window.confirm(
      `Generate ${missing.length} ${kind === 'esi_pf' ? 'ESI / PF' : 'new-joined'} payslip${missing.length === 1 ? '' : 's'} for ${monthLabel}?\n\n` +
      `P.DAYS and L.DAYS are auto-filled from attendance (${PAID_LEAVE_BANK}-day paid-leave bank). You can edit each row after.`
    )) return;
    setBulkBusy(true);
    try {
      const payloads = [];
      const advsByEmp = {};
      for (const emp of missing) {
        const advs = await fetchActiveAdvances(emp.id);
        advsByEmp[emp.id] = advs;
        const stats = attendance[emp.id] || { p_days: daysInMonth, l_days: PAID_LEAVE_BANK };
        const draft = recomputeDraft({
          employee_id: emp.id,
          month,
          salary_type: kind,
          monthly_salary: num(emp.monthly_salary),
          hra: num(emp.hra), wa: num(emp.wa),
          days_in_month: daysInMonth,
          p_days: stats.p_days, l_days: stats.l_days,
          bonus: 0, dues: 0, credit: 0,
          advance_amt: sumAdvances(advs),
          diff_pct: 0,
          _advances: advs,
        }, emp, da);
        payloads.push(draftToPayload(draft));
      }
      const { error } = await window.sb.from('payslips').insert(payloads);
      if (error) { toast('Bulk generate failed (see console)'); console.error(error); return; }
      // Bump months_deducted for every advance touched.
      const allAdvs = Object.values(advsByEmp).flat();
      await bumpAdvances(allAdvs);
      toast(`Generated ${payloads.length} payslip${payloads.length === 1 ? '' : 's'}`);
    } finally { setBulkBusy(false); }
  };

  // Build an .xlsx with two sheets matching the templates the Owner
  // supplied. One sheet per salary_type. Uses the SheetJS CDN loaded
  // in <head>. New-joined rows follow the Silks template (English
  // headers); ESI/PF rows follow the EPF & ESI template.
  const exportExcel = async () => {
    if (exporting) return;
    if (typeof window.XLSX === 'undefined') {
      toast('Excel library still loading, try again in a second');
      return;
    }
    if (!filtered.length) { toast('Nothing to export for this month'); return; }
    setExporting(true);
    try {
      const newJoinedHeader = [
        'No', 'Town', 'Name', 'Days', 'P.DAYS', 'L.DAYS', 'TOTAL', 'Salary',
        'Bonus', 'Amount', 'BONUS', 'Dues', 'Credit', 'SIGNATURE', 'ADVANCE',
      ];
      const esiHeader = [
        'S.NO', 'TMB ACCOUNT NO.', 'ESI NO.', 'EPF NO', 'UAN NO.',
        'EMPLOYEE NAME', 'DESIGNATION',
        'SALARY', 'HRA', 'W.A.', 'TOTAL', 'DA', 'N.BASICS',
        'DAYS', 'P.DAYS', 'L.D.',
        'P.BASICS', 'P.DA', 'WAGES', 'P.HRA', 'L.D.S', 'W.A.',
        'Total', 'BONUS', 'INCENTIVE',
        'EPF WAGES', 'ESI WAGES', 'diff. 2%',
        'EPF 12%', 'ESI 0.75%', 'ESI/EPF', 'NET WAGES',
      ];

      const njRows = [];
      const esiRows = [];
      filtered.forEach(r => {
        const emp = empById[r.employee_id];
        const rowType = r.salary_type || emp?.salary_type || 'new_joined';
        const days = r.days_in_month || daysInMonthIso(r.month);
        const pDays = num(r.p_days);
        const lDays = num(r.l_days);
        if (rowType === 'new_joined') {
          njRows.push([
            njRows.length + 1,
            emp?.city || '',
            emp?.name || r.employee_id,
            days,
            pDays,
            lDays,
            pDays + lDays,
            num(r.monthly_salary),
            '',                             // போனஸ் (empty — BONUS flows in the English column instead)
            num(r.amount),
            num(r.bonus),
            num(r.dues),
            num(r.credit),
            '',                             // SIGNATURE (printed blank)
            num(r.advance_amt),
          ]);
        } else {
          // Re-run the compute so the exported figures are exact — the
          // stored gross/deductions/net won't split the statutory pieces
          // out for us.
          const c = computeEsiPf({
            salary:    num(r.monthly_salary),
            hra:       num(r.hra ?? emp?.hra),
            wa:        num(r.wa  ?? emp?.wa),
            da:        num(da),
            days,
            p_days:    pDays,
            l_days:    lDays,
            bonus:     num(r.bonus),
            incentive: num(r.credit),
            diff_pct:  num(r.diff_pct),
            advance:   num(r.advance_amt),
          });
          esiRows.push([
            esiRows.length + 1,
            emp?.tmb_account_no || '',
            emp?.esi_no || '',
            emp?.epf_no || '',
            emp?.uan_no || '',
            emp?.name || r.employee_id,
            emp?.role || '',
            num(r.monthly_salary),
            num(r.hra ?? emp?.hra),
            num(r.wa  ?? emp?.wa),
            num(r.monthly_salary) - num(r.hra ?? emp?.hra) - num(r.wa ?? emp?.wa),  // TOTAL
            num(da),
            c.n_basics,
            days,
            pDays,
            lDays,
            c.p_basics,
            c.p_da,
            c.wages,
            c.p_hra,
            c.ld_s,
            c.wa_paid,
            c.total,
            num(r.bonus),
            num(r.credit),                   // INCENTIVE column
            c.epf_wages,
            c.esi_wages,
            num(r.diff_pct),
            c.epf_12,
            c.esi_075,
            c.esi_epf,
            c.net_wages - num(r.advance_amt),
          ]);
        }
      });

      const wb = window.XLSX.utils.book_new();
      if (njRows.length) {
        const ws = window.XLSX.utils.aoa_to_sheet([newJoinedHeader, ...njRows]);
        window.XLSX.utils.book_append_sheet(wb, ws, 'New joined');
      }
      if (esiRows.length) {
        const ws = window.XLSX.utils.aoa_to_sheet([esiHeader, ...esiRows]);
        window.XLSX.utils.book_append_sheet(wb, ws, 'EPF & ESI');
      }
      if (!wb.SheetNames.length) { toast('Nothing to export'); return; }
      const filename = `payslips_${month.slice(0, 7)}.xlsx`;
      window.XLSX.writeFile(wb, filename);
      toast(`Exported ${njRows.length + esiRows.length} payslip${njRows.length + esiRows.length === 1 ? '' : 's'}`);
    } finally { setExporting(false); }
  };

  const readOnly = !can('payslips', 'edit');
  const monthLabel = new Date(month + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  const coverage = eligibleList.length ? Math.round((rows.length / eligibleList.length) * 100) : 0;
  const editingEmp = editing ? empById[editing.employee_id] : null;

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Payslips</div><div className="v">{filtered.length}</div></div>
        <div className="stat present"><div className="k">Paid</div><div className="v">{totals.paid}</div></div>
        <div className="stat"><div className="k">Gross total</div><div className="v" style={{ fontSize: 18 }}>{rupees(totals.gross)}</div></div>
        <div className="stat absent"><div className="k">Deductions</div><div className="v" style={{ fontSize: 18 }}>{rupees(totals.ded)}</div></div>
        <div className="stat leave"><div className="k">Net total</div><div className="v" style={{ fontSize: 18 }}>{rupees(totals.net)}</div></div>
      </div>

      <div className="toolbar">
        <input type="month" value={month.slice(0, 7)}
          onChange={e => setMonth(e.target.value + '-01')} />

        <div className="seg">
          {[
            { id: 'all', label: 'All types' },
            { id: 'new_joined', label: 'New joined' },
            { id: 'esi_pf', label: 'ESI / PF' },
          ].map(s => (
            <button key={s.id}
              className={typeFilter === s.id ? 'active' : ''}
              onClick={() => setTypeFilter(s.id)}>
              {s.label}
            </button>
          ))}
        </div>

        <div className="seg">
          {[{ id: 'all', label: 'All sections' }, ...Object.entries(SECTION_META).map(([k, v]) => ({ id: k, label: v.label }))]
            .map(s => (
              <button key={s.id}
                className={sectionFilter === s.id ? 'active' : ''}
                onClick={() => setSectionFilter(s.id)}>
                {s.label}
              </button>
            ))}
        </div>

        <input type="search" placeholder="Search name, ID, code or company…"
          value={search} onChange={e => setSearch(e.target.value)} />

        <div style={{ fontSize: 12, color: 'var(--inkMuted)' }}>
          Coverage: {rows.length} / {eligibleList.length} ({coverage}%)
        </div>

        {readOnly && (
          <div style={{
            fontSize: 12, color: 'var(--warning)',
            background: 'var(--warningSoft)', padding: '8px 12px', borderRadius: 10,
          }}>
            Read-only — only Owner can edit payslips.
          </div>
        )}

        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button className="btn" onClick={() => setPrinting(true)} disabled={!filtered.length}
            title="Print receipt cards for every payslip in this view (advance-receipt style)">
            🖨 Print
          </button>
          <button className="btn" onClick={exportExcel} disabled={!filtered.length || exporting}
            title="Download an .xlsx with two sheets matching the Silks + EPF/ESI templates">
            {exporting ? 'Exporting…' : '↓ Excel'}
          </button>
          {!readOnly && (
            <>
              <button className="btn" onClick={() => bulkGenerate('new_joined')} disabled={bulkBusy}
                title="Create payslips for every active 'new joined' employee who doesn't have one this month">
                {bulkBusy ? 'Generating…' : 'Bulk: New joined'}
              </button>
              <button className="btn" onClick={() => bulkGenerate('esi_pf')} disabled={bulkBusy}
                title="Create payslips for every active ESI/PF employee who doesn't have one this month">
                {bulkBusy ? 'Generating…' : 'Bulk: ESI / PF'}
              </button>
              {can('payslips', 'create') && (
                <button className="btn primary" onClick={() => startNew('')}>+ New payslip</button>
              )}
            </>
          )}
        </div>
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 80 }}>ID</th>
              <th>Employee</th>
              <th style={{ width: 100 }}>Type</th>
              <th style={{ width: 110 }}>Section</th>
              <th style={{ width: 110 }}>Days (P+L)</th>
              <th style={{ width: 120 }}>Gross</th>
              <th style={{ width: 120 }}>Deductions</th>
              <th style={{ width: 120 }}>Net</th>
              <th style={{ width: 110 }}>Paid</th>
              {!readOnly && <th style={{ width: 220 }}>Actions</th>}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr>
                <td colSpan={readOnly ? 9 : 10} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No payslips for this month.'}
                </td>
              </tr>
            )}
            {filtered.map(r => {
              const emp = empById[r.employee_id];
              const rowType = r.salary_type || emp?.salary_type || 'new_joined';
              return (
                <tr key={r.id}>
                  <td className="id">{r.employee_id}</td>
                  <td className="name">
                    {emp?.name || r.employee_id}
                    {emp?.role && (
                      <div style={{ fontSize: 11, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 2 }}>
                        {emp.role}
                      </div>
                    )}
                  </td>
                  <td>
                    <span className={`status-pill ${rowType === 'esi_pf' ? 'leave' : 'unmarked'}`}>
                      {rowType === 'esi_pf' ? 'ESI / PF' : 'New joined'}
                    </span>
                  </td>
                  <td>{SECTION_META[emp?.section_id]?.label || <span className="muted">—</span>}</td>
                  <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
                    {r.p_days != null
                      ? `${r.p_days} + ${r.l_days || 0} / ${r.days_in_month || daysInMonthIso(r.month)}`
                      : <span className="muted">—</span>}
                  </td>
                  <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>{rupees(r.gross)}</td>
                  <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', color: 'var(--danger)' }}>−{rupees(r.deductions)}</td>
                  <td style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', fontWeight: 600 }}>{rupees(r.net)}</td>
                  <td>
                    {r.paid_at
                      ? <span className="status-pill present">{fmtDate(r.paid_at)}</span>
                      : <span className="status-pill unmarked">Unpaid</span>}
                  </td>
                  {!readOnly && (
                    <td>
                      <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                        onClick={() => markPaid(r)}>
                        {r.paid_at ? 'Unpay' : 'Mark paid'}
                      </button>
                      <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                        onClick={() => startEdit(r)}>Edit</button>
                      {can('payslips', 'delete') && (
                        <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                          onClick={() => del(r)}>Delete</button>
                      )}
                    </td>
                  )}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--inkFaint)' }}>
        {monthLabel} · {eligibleList.length} eligible · DA {rupees(da)}/mo
        {!readOnly && ' · P.DAYS and L.DAYS auto-fill from attendance. Always review before marking paid.'}
      </div>

      <Modal
        open={!!editing}
        title={editing?._new ? 'New payslip' : `Payslip · ${editingEmp?.name || editing?.employee_id}`}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving || !editing?.employee_id}>
              {saving ? 'Saving…' : editing?._new ? 'Create payslip' : 'Save'}
            </button>
          </>
        }
      >
        {editing && (
          <PayslipEditor
            editing={editing}
            emp={editingEmp}
            eligibleList={eligibleList}
            attendance={attendance}
            da={da}
            daysInMonth={daysInMonth}
            onPickEmployee={pickEmployee}
            onPatch={patchDraft}
          />
        )}
      </Modal>

      {printing && (
        <PayslipReceiptsPrint
          rows={filtered}
          empById={empById}
          da={da}
          monthLabel={monthLabel}
          onClose={() => setPrinting(false)}
        />
      )}
    </div>
  );
};

                      <>
                        <tr><td className="l">Amount ({num(r.p_days)}+{num(r.l_days)}/{days} × {rupees(r.monthly_salary)})</td><td className="r">{rupees(r.amount)}</td></tr>
                        {num(r.bonus)  > 0 && <tr><td className="l">+ Bonus</td> <td className="r">{rupees(r.bonus)}</td></tr>}
                        {num(r.credit) > 0 && <tr><td className="l">+ Credit</td><td className="r">{rupees(r.credit)}</td></tr>}
                        {num(r.dues)   > 0 && <tr><td className="l neg">− Dues</td>    <td className="r neg">−{rupees(r.dues)}</td></tr>}
                        {num(r.advance_amt) > 0 && <tr><td className="l neg">− Advance</td><td className="r neg">−{rupees(r.advance_amt)}</td></tr>}
                      </>
                    )}
                  </tbody>
                </table>
                <div className="netbar">
                  <div className="label">Net pay</div>
                  <div className="amount">{rupees(r.net)}</div>
                </div>
                <div className="sigs">
                  <div>Employee signature</div>
                  <div>Owner signature</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </>,
    document.body
  );
};

// ──────────────────────────────────────────────────────────
// Bonus planner — per-month page showing each eligible employee's
// attendance performance + an editable Bonus ₹ column. HR saves the
// plan; Owner (payslips.edit) pushes it onto that month's payslips.
// Bonuses done twice a year, per the Owner's brief.
// ──────────────────────────────────────────────────────────
const BonusPlannerPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);
  const { rows: employees } = useEmployees();

  const [month, setMonth] = useState(() => firstOfMonth(new Date()));
  const [attendance, setAttendance] = useState({});
  const [payslips, setPayslips] = useState({}); // employee_id -> payslip row
  const [plan, setPlan] = useState(null);
  const [bonuses, setBonuses] = useState({});   // employee_id -> ₹
  const [note, setNote] = useState('');
  const [saving, setSaving]   = useState(false);
  const [pushing, setPushing] = useState(false);
  const [loading, setLoading] = useState(true);
  const [search, setSearch]   = useState('');
  const [typeFilter, setTypeFilter] = useState('all');

  const eligibleList = useMemo(() =>
    employees.filter(e => e.user_type !== 'owner' && e.is_active)
      .sort((a, b) => a.name.localeCompare(b.name))
  , [employees]);

  const monthEnd = useMemo(() => {
    const d = new Date(month + 'T00:00:00');
    return fmtDateISO(new Date(d.getFullYear(), d.getMonth() + 1, 0));
  }, [month]);

  const load = useCallback(async () => {
    if (!window.sb) return;
    setLoading(true);
    const [planRes, rowsRes, attRes, payRes] = await Promise.all([
      window.sb.from('bonus_plans').select('*').eq('month', month).maybeSingle(),
      window.sb.from('bonus_plan_rows').select('*'),
      window.sb.from('attendance')
        .select('employee_id, status, date')
        .gte('date', month).lte('date', monthEnd),
      window.sb.from('payslips').select('id, employee_id, bonus, amount, gross, deductions, net, salary_type, p_days, l_days, days_in_month, monthly_salary, hra, wa, dues, credit, advance_amt, diff_pct').eq('month', month),
    ]);
    // Bucket attendance by employee.
    const byEmp = {};
    (attRes.data || []).forEach(r => { (byEmp[r.employee_id] = byEmp[r.employee_id] || []).push(r); });
    const stats = {};
    Object.keys(byEmp).forEach(id => { stats[id] = attendanceToPayDays(byEmp[id]); });
    setAttendance(stats);
    // Bucket payslips by employee.
    const payByEmp = {};
    (payRes.data || []).forEach(r => { payByEmp[r.employee_id] = r; });
    setPayslips(payByEmp);
    // Plan + rows.
    const planRow = planRes.data || null;
    setPlan(planRow);
    setNote(planRow?.note || '');
    const seeded = {};
    if (planRow) {
      (rowsRes.data || []).filter(r => r.plan_id === planRow.id)
        .forEach(r => { seeded[r.employee_id] = Number(r.bonus_amount) || 0; });
    }
    setBonuses(seeded);
    setLoading(false);
  }, [month, monthEnd]);

  useEffect(() => { load(); }, [load]);

  const filteredList = useMemo(() => {
    const q = search.trim().toLowerCase();
    return eligibleList.filter(e => {
      if (typeFilter !== 'all' && (e.salary_type || 'new_joined') !== typeFilter) return false;
      if (q) {
        if (!e.name.toLowerCase().includes(q) &&
            !e.id.toLowerCase().includes(q) &&
            !(e.employee_code || '').toLowerCase().includes(q) &&
            !(e.company || '').toLowerCase().includes(q) &&
            !(e.role || '').toLowerCase().includes(q)) return false;
      }
      return true;
    });
  }, [eligibleList, typeFilter, search]);

  const totals = useMemo(() => {
    const sum = Object.values(bonuses).reduce((s, v) => s + (num(v) || 0), 0);
    const given = Object.values(bonuses).filter(v => num(v) > 0).length;
    const payslipMatches = Object.keys(bonuses)
      .filter(id => num(bonuses[id]) > 0 && payslips[id]).length;
    return { sum, given, payslipMatches };
  }, [bonuses, payslips]);

  const save = async () => {
    if (saving || !can('bonus', 'edit')) return;
    setSaving(true);
    try {
      let planId = plan?.id;
      if (!planId) {
        const { data, error } = await window.sb.from('bonus_plans')
          .insert({ month, note: note.trim() || null })
          .select().maybeSingle();
        if (error) { toast('Could not save plan'); console.error(error); return; }
        planId = data.id;
        setPlan(data);
      } else {
        await window.sb.from('bonus_plans')
          .update({ note: note.trim() || null })
          .eq('id', planId);
      }
      // Upsert one row per eligible employee that has a stats entry.
      const rowsPayload = eligibleList.map(e => {
        const s = attendance[e.id] || { p_days: 0, late_days: 0, leaves_taken: 0 };
        return {
          plan_id:      planId,
          employee_id:  e.id,
          present_days: s.p_days || 0,
          late_days:    s.late_days || 0,
          leave_days:   s.leaves_taken || 0,
          bonus_amount: num(bonuses[e.id]),
        };
      });
      const { error } = await window.sb.from('bonus_plan_rows')
        .upsert(rowsPayload, { onConflict: 'plan_id,employee_id' });
      if (error) { toast('Could not save rows'); console.error(error); return; }
      toast(`Saved ${rowsPayload.length} rows`);
    } finally { setSaving(false); }
  };

  // Push every non-zero bonus onto the matching payslip row for this
  // month, updating bonus + gross/net. Requires payslips.edit (Owner).
  const pushToPayslips = async () => {
    if (pushing || !can('payslips', 'edit')) return;
    const hits = Object.keys(bonuses).filter(id => num(bonuses[id]) > 0 && payslips[id]);
    const skipped = Object.keys(bonuses).filter(id => num(bonuses[id]) > 0 && !payslips[id]);
    if (!hits.length) { toast('No matching payslips for the bonuses entered'); return; }
    if (!window.confirm(
      `Push ${hits.length} bonus${hits.length === 1 ? '' : 'es'} onto payslips for this month?\n\n` +
      (skipped.length ? `${skipped.length} employee${skipped.length === 1 ? ' has' : 's have'} no payslip yet and will be skipped.\n\n` : '') +
      `This updates the Bonus column on each payslip and recomputes Net pay.`
    )) return;
    setPushing(true);
    try {
      // Save plan first so what we push is persisted.
      await save();
      // Update each payslip with the new bonus. Recompute with the
      // same engine the Payslips page uses so the numbers stay in sync.
      let ok = 0;
      for (const id of hits) {
        const p = payslips[id];
        const bonus = num(bonuses[id]);
        const days = p.days_in_month || daysInMonthIso(month);
        const shared = {
          salary: num(p.monthly_salary), days,
          p_days: num(p.p_days), l_days: num(p.l_days),
          bonus, advance: num(p.advance_amt),
        };
        let newGross, newDed, newNet, newAmount;
        if (p.salary_type === 'esi_pf') {
          // DA is whatever the payslips page would have used. Fetch the
          // current setting so we don't stale-out if it changed.
          const { data: daRow } = await window.sb.from('app_settings')
            .select('value').eq('key', 'payroll.da').maybeSingle();
          const daVal = num(daRow?.value?.amount) || 7313;
          const c = computeEsiPf({
            ...shared,
            hra: num(p.hra), wa: num(p.wa), da: daVal,
            incentive: num(p.credit), diff_pct: num(p.diff_pct),
          });
          newAmount = c.total;
          newGross  = c.total + bonus + num(p.credit);
          newDed    = c.esi_epf + num(p.advance_amt);
          newNet    = c.net_wages;
        } else {
          const c = computeNewJoined({ ...shared, dues: num(p.dues), credit: num(p.credit) });
          newAmount = c.amount;
          newGross  = c.amount + bonus + num(p.credit);
          newDed    = num(p.dues) + num(p.advance_amt);
          newNet    = c.net;
        }
        const { error } = await window.sb.from('payslips')
          .update({ bonus, amount: newAmount, gross: newGross, deductions: newDed, net: newNet })
          .eq('id', p.id);
        if (!error) ok++;
      }
      // Stamp the plan as pushed.
      if (plan?.id) {
        await window.sb.from('bonus_plans')
          .update({ pushed_at: new Date().toISOString() })
          .eq('id', plan.id);
        setPlan(p => p ? { ...p, pushed_at: new Date().toISOString() } : p);
      }
      toast(`Pushed ${ok}/${hits.length} bonus${hits.length === 1 ? '' : 'es'}`);
      await load();
    } finally { setPushing(false); }
  };

  const readOnly = !can('bonus', 'edit');
  const canPush  = can('payslips', 'edit');
  const monthLabel = new Date(month + 'T00:00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Employees</div><div className="v">{filteredList.length}</div></div>
        <div className="stat present"><div className="k">With bonus</div><div className="v">{totals.given}</div></div>
        <div className="stat leave"><div className="k">Total ₹</div><div className="v" style={{ fontSize: 18 }}>{rupees(totals.sum)}</div></div>
        <div className="stat"><div className="k">Payslips matched</div><div className="v">{totals.payslipMatches}</div></div>
      </div>

      <div className="toolbar">
        <input type="month" value={month.slice(0, 7)}
          onChange={e => setMonth(e.target.value + '-01')} />

        <div className="seg">
          {[
            { id: 'all', label: 'All types' },
            { id: 'new_joined', label: 'New joined' },
            { id: 'esi_pf', label: 'ESI / PF' },
          ].map(s => (
            <button key={s.id}
              className={typeFilter === s.id ? 'active' : ''}
              onClick={() => setTypeFilter(s.id)}>{s.label}</button>
          ))}
        </div>

        <input type="search" placeholder="Search name, ID, code, company or role…"
          value={search} onChange={e => setSearch(e.target.value)} />

        {plan?.pushed_at && (
          <span className="status-pill present" title={`Pushed ${new Date(plan.pushed_at).toLocaleString('en-GB')}`}>
            Pushed to payslips
          </span>
        )}

        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {!readOnly && (
            <button className="btn" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : (plan?.id ? 'Save plan' : 'Create plan')}
            </button>
          )}
          {canPush && (
            <button className="btn primary" onClick={pushToPayslips} disabled={pushing || !totals.given}>
              {pushing ? 'Pushing…' : `Push to payslips${totals.payslipMatches ? ` (${totals.payslipMatches})` : ''}`}
            </button>
          )}
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 280px', gap: 12, marginBottom: 10 }}>
        <div className="table-wrap">
          <table className="data">
            <thead>
              <tr>
                <th style={{ width: 50 }}>#</th>
                <th style={{ width: 90 }}>ID</th>
                <th>Name</th>
                <th style={{ width: 100 }}>Type</th>
                <th style={{ width: 100 }}>Section</th>
                <th style={{ width: 110 }}>Salary</th>
                <th style={{ width: 80 }}>Present</th>
                <th style={{ width: 70 }}>Late</th>
                <th style={{ width: 100 }}>Leaves taken</th>
                <th style={{ width: 110 }}>Payslip?</th>
                <th style={{ width: 140 }}>Bonus ₹</th>
              </tr>
            </thead>
            <tbody>
              {filteredList.length === 0 && (
                <tr>
                  <td colSpan={11} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                    {loading ? 'Loading…' : 'No employees match these filters.'}
                  </td>
                </tr>
              )}
              {filteredList.map((e, idx) => {
                const s = attendance[e.id] || { p_days: 0, late_days: 0, leaves_taken: 0 };
                const hasPayslip = !!payslips[e.id];
                const stype = e.salary_type || 'new_joined';
                return (
                  <tr key={e.id}>
                    <td className="muted">{idx + 1}</td>
                    <td className="id">{e.id}</td>
                    <td className="name">
                      {e.name}
                      {e.role && (
                        <div style={{ fontSize: 11, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 2 }}>{e.role}</div>
                      )}
                    </td>
                    <td>
                      <span className={`status-pill ${stype === 'esi_pf' ? 'leave' : 'unmarked'}`}>
                        {stype === 'esi_pf' ? 'ESI / PF' : 'New joined'}
                      </span>
                    </td>
                    <td>{SECTION_META[e.section_id]?.label || <span className="muted">—</span>}</td>
                    <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>{rupees(e.monthly_salary)}</td>
                    <td style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>{s.p_days}</td>
                    <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>{s.late_days}</td>
                    <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
                      {s.leaves_taken}
                      {s.leaves_taken > 0 && (
                        <span style={{ fontSize: 10, color: 'var(--inkMuted)' }}> · {s.l_days} unused</span>
                      )}
                    </td>
                    <td>
                      {hasPayslip
                        ? <span className="status-pill present">Yes</span>
                        : <span className="status-pill unmarked">—</span>}
                    </td>
                    <td>
                      <input type="number" min="0" step="1"
                        value={bonuses[e.id] ?? ''}
                        disabled={readOnly}
                        onChange={ev => setBonuses({ ...bonuses, [e.id]: ev.target.value })}
                        placeholder="0"
                        style={{
                          fontFamily: 'JetBrains Mono, Menlo, monospace', textAlign: 'right',
                          background: num(bonuses[e.id]) > 0 ? 'var(--brandSoft)' : undefined,
                        }} />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div style={{
          background: 'var(--surface)', border: '1px solid var(--border)',
          borderRadius: 12, padding: 16, alignSelf: 'start',
          position: 'sticky', top: 16,
        }}>
          <div style={{
            fontSize: 12, color: 'var(--inkMuted)', fontWeight: 600,
            textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 8,
          }}>Plan · {monthLabel}</div>
          <label>Note (optional)</label>
          <textarea rows={3} value={note} disabled={readOnly}
            onChange={e => setNote(e.target.value)}
            placeholder="e.g. Diwali bonus 2026"
            style={{ width: '100%', marginBottom: 10 }} />
          <div style={{ fontSize: 12, color: 'var(--inkMuted)', lineHeight: 1.5 }}>
            Planned bonuses appear on each payslip's <strong>Bonus</strong> line after you push.
            {canPush ? '' : ' (Only Owner can push.)'}
          </div>
          {plan?.pushed_at && (
            <div style={{
              marginTop: 10, padding: 10, borderRadius: 8,
              background: 'var(--brandSoft)', color: 'var(--brand)', fontSize: 12,
            }}>
              Pushed {new Date(plan.pushed_at).toLocaleString('en-GB')}.
              Pushing again overwrites the Bonus column with the current values.
            </div>
          )}
        </div>
      </div>

      <div style={{ marginTop: 6, fontSize: 11.5, color: 'var(--inkFaint)' }}>
        Present counts include late days. Leaves-taken eats into the 4-day paid-leave bank.
        {!payslips && 'Generate payslips first to see the "Payslip?" column turn green.'}
      </div>
    </div>
  );
};

// Escape one field for a CSV; wraps in quotes if needed.
const csvEscape = (v) => {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\r\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
};
const toCSV = (rows, columns) => {
  const header = columns.map(c => c.label).join(',');
  const body = rows.map(r =>
    columns.map(c => csvEscape(typeof c.value === 'function' ? c.value(r) : r[c.value])).join(',')
  ).join('\n');
  return '\uFEFF' + header + '\n' + body; // BOM for Excel UTF-8
};
const downloadCSV = (filename, csv) => {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
};

const ReportsPage = () => {
  const toast = useToast();
  const { rows: employees } = useEmployees();
  const empById = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.id] = e; });
    return m;
  }, [employees]);

  // ─ Attendance export ──────────────────────────

    );

  }, [attFrom, attTo, attSection]);

  const attPreviewRun = async () => {

      const rows = await fetchAttendance();

    } finally { setAttBusy(false); }
  };
  const attDownload = async () => {
    const rows = attPreview?.rows || await fetchAttendance();

      { label: 'Date',          value: 'date' },
      { label: 'Employee ID',   value: 'employee_id' },
      { label: 'Name',          value: r => r.employees?.name || '' },
      { label: 'Role',          value: r => r.employees?.role || '' },

      { label: 'Status',        value: 'status' },
      { label: 'Punch in',      value: 'punch_in_time' },
      { label: 'Punch out',     value: 'punch_out_time' },
      { label: 'Source',        value: 'source' },
    ]);
    downloadCSV(`attendance_${attFrom}_to_${attTo}.csv`, csv);
    toast(`Downloaded ${rows.length} attendance rows`);
  };

  // ─ Payroll export ─────────────────────────────
  const [payMonth, setPayMonth] = useState(() => firstOfMonth(new Date()));
  const [paySection, setPaySection] = useState('all');
  const [payPreview, setPayPreview] = useState(null);

      .eq('month', payMonth)
      .order('employee_id');

      paySection === 'all' || r.employees?.section_id === paySection
    );
  }, [payMonth, paySection]);

  const payPreviewRun = async () => {
    setPayBusy(true);
    try {
      const rows = await fetchPayroll();
      const gross = rows.reduce((s, r) => s + (r.gross || 0), 0);
      const ded   = rows.reduce((s, r) => s + (r.deductions || 0), 0);
      const net   = rows.reduce((s, r) => s + (r.net || 0), 0);
      const paid  = rows.filter(r => r.paid_at).length;
      setPayPreview({ rows, gross, ded, net, paid });
    } finally { setPayBusy(false); }
  };
  const payDownload = async () => {
    const rows = payPreview?.rows || await fetchPayroll();
    const fmtItems = (items) => (items || [])
      .map(i => `${i.label}: ${i.amount}`).join('; ');
    const csv = toCSV(rows, [
      { label: 'Employee ID',    value: 'employee_id' },

      { label: 'Role',           value: r => r.employees?.role || '' },
      { label: 'Section',        value: r => SECTION_META[r.employees?.section_id]?.full || r.employees?.section_id || '' },
      { label: 'Month',          value: 'month' },
      { label: 'Earnings',       value: r => fmtItems(r.earnings) },
