const KioskSettingsPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);

  const [settings, setSettings] = useState({ late_cutoff: '10:00', match_threshold: '0.55', kiosk_pin: '0000' });
  const [loading, setLoading] = useState(true);
  const [savingKey, setSavingKey] = useState(null);

  const [faceStats, setFaceStats] = useState({ totalStaff: 0, enrolled: 0, partials: 0 });
  const [partialList, setPartialList] = useState([]);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [setRes, staffRes, facesRes] = await Promise.all([
      window.sb.from('settings').select('*').in('key', ['late_cutoff', 'match_threshold', 'kiosk_pin']),
      window.sb.from('employees').select('id, name, role, section_id')
        .eq('user_type', 'staff').eq('is_active', true),
      window.sb.from('face_embeddings').select('employee_id'),
    ]);
    const s = { late_cutoff: '10:00', match_threshold: '0.55', kiosk_pin: '0000' };
    (setRes.data || []).forEach(r => { s[r.key] = r.value; });
    setSettings(s);

    const counts = {};
    (facesRes.data || []).forEach(f => {
      counts[f.employee_id] = (counts[f.employee_id] || 0) + 1;
    });
    const staff = staffRes.data || [];
    const enrolled = staff.filter(e => (counts[e.id] || 0) >= 3).length;
    const partials = staff.filter(e => (counts[e.id] || 0) > 0 && (counts[e.id] || 0) < 3);
    setFaceStats({ totalStaff: staff.length, enrolled, partials: partials.length });
    setPartialList(partials.map(e => ({ ...e, count: counts[e.id] })));
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-kiosk')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' },        () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'face_embeddings' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' },       () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const writeSetting = async (key, value) => {
    if (!can('attendance', 'edit')) return;
    setSavingKey(key);
    try {
      const { error } = await window.sb.from('settings').upsert({
        key, value, updated_at: new Date().toISOString(),
      });
      if (error) toast('Could not save');
      else {
        setSettings(s => ({ ...s, [key]: value }));
        toast('Saved');
      }
    } finally { setSavingKey(null); }
  };

  const saveCutoff = () => writeSetting('late_cutoff', settings.late_cutoff);
  const saveThreshold = () => writeSetting('match_threshold',
    String(Math.max(0.30, Math.min(0.80, parseFloat(settings.match_threshold) || 0.55)).toFixed(2)));

  const clearAllFaces = async () => {
    if (!can('attendance', 'delete')) return;
    if (!window.confirm('Delete ALL face embeddings across every employee?\n\nYou will need to re-enroll everyone via the mobile app. This cannot be undone.')) return;
    const { error } = await window.sb.from('face_embeddings').delete().not('id', 'is', null);
    if (error) toast('Could not delete');
    else toast('All face data cleared');
  };

  const readOnly = !can('attendance', 'edit');
  const thresholdPct = Math.round(parseFloat(settings.match_threshold) * 100);

  return (
    <div>
      <div className="stat-strip">
        <div className="stat present"><div className="k">Enrolled</div><div className="v">{faceStats.enrolled}</div></div>
        <div className="stat late"><div className="k">Partial</div><div className="v">{faceStats.partials}</div></div>
        <div className="stat"><div className="k">Active staff</div><div className="v">{faceStats.totalStaff}</div></div>
        <div className="stat leave"><div className="k">Coverage</div><div className="v">{faceStats.totalStaff ? Math.round((faceStats.enrolled / faceStats.totalStaff) * 100) : 0}%</div></div>
        <div className="stat"><div className="k">Threshold</div><div className="v">{thresholdPct}%</div></div>
      </div>

      {/* Late cutoff + threshold in a two-column layout */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
        <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 16, padding: 24 }}>

            fontFamily: 'Fraunces, Georgia, serif', fontSize: 20, fontWeight: 500,
            letterSpacing: -0.3, marginBottom: 4,

              style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', fontSize: 18, height: 44, flex: 1 }} />
            {!readOnly && (

            <input type="number" min="0.35" max="0.75" step="0.01"

            {!readOnly && (

              </button>

          </div>
          <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--inkFaint)' }}>
            0.45 lenient · 0.55 balanced (default) · 0.65 strict · 0.70 very strict
          </div>
        </div>
      </div>

      {/* Kiosk PIN */}
      <div style={{
        background: 'var(--surface)', border: '1px solid var(--border)',
        borderRadius: 16, padding: 24, marginBottom: 16,
      }}>
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif', fontSize: 20, fontWeight: 500,
          letterSpacing: -0.3, marginBottom: 4,
        }}>Kiosk PIN</div>
        <div style={{ fontSize: 13, color: 'var(--inkMuted)', marginBottom: 16 }}>
          Needed to <strong>launch</strong> the kiosk from the app's login screen and to <strong>exit</strong> kiosk mode.
          Keep it short so staff can remember it, but not something easy to guess.
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <input type="text" inputMode="numeric"
            value={settings.kiosk_pin}
            disabled={readOnly}
            onChange={e => setSettings(s => ({ ...s, kiosk_pin: e.target.value }))}
            placeholder="0000"
            maxLength={12}
            style={{
              fontFamily: 'JetBrains Mono, Menlo, monospace',
              fontSize: 18, height: 44, flex: 1, letterSpacing: 4, textAlign: 'center',
            }} />
          {!readOnly && (
            <button className="btn primary"
              onClick={() => writeSetting('kiosk_pin', (settings.kiosk_pin || '').trim() || '0000')}
              disabled={savingKey === 'kiosk_pin'}>

      {/* Dedicated kiosk phone — setup guide */}
      <div style={{
        background: 'var(--surface)', border: '1px solid var(--border)',
        borderRadius: 16, padding: 24, marginBottom: 16,
      }}>
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif', fontSize: 20, fontWeight: 500,
          letterSpacing: -0.3, marginBottom: 4,
        }}>Set up a dedicated kiosk phone</div>
        <div style={{ fontSize: 13, color: 'var(--inkMuted)', marginBottom: 16 }}>
          Turn any phone or tablet into the attendance kiosk at the staff entrance. Once the phone enters kiosk mode, it stays in kiosk mode even after reboot — only someone with the PIN above can exit it.
        </div>

        <ol style={{ fontSize: 13.5, lineHeight: 1.65, color: 'var(--inkSoft)', paddingLeft: 20, margin: 0 }}>
          <li style={{ marginBottom: 10 }}>
            On the kiosk phone, open a browser (Safari on iPhone, Chrome on Android) and go to the <strong>staff app URL</strong> — the same link you use on your own phone.
          </li>
          <li style={{ marginBottom: 10 }}>
            <strong>Install to home screen</strong> so it looks like an app (no browser bar):
            <ul style={{ marginTop: 4, paddingLeft: 18 }}>
              <li><em>iPhone</em>: tap Share → "Add to Home Screen".</li>

          <li style={{ marginBottom: 10 }}>

// ──────────────────────────────────────────────────────────
// Team access — Owner-only. Promote employees to manager/supervisor/HR
// and set their per-section scope + granular power flags.
// ──────────────────────────────────────────────────────────
const ROLE_OPTIONS = [
  { id: 'owner',      label: 'Owner',      sub: 'Full access — only the Owner can grant Admin', ownerOnly: true },
  { id: 'admin',      label: 'Admin',      sub: 'Same rights as Owner. Only the Owner can grant this.', ownerOnly: true },
  { id: 'manager',    label: 'Manager',    sub: 'Sees their sections, full operational access' },
  { id: 'supervisor', label: 'Supervisor', sub: 'Sees their sections, limited powers by default' },
  { id: 'hr',         label: 'HR',         sub: 'Operations only — no payroll, no access management' },
  { id: 'cc',         label: 'Customer Care', sub: 'CRM only — customers, calls, muhurtham. No payroll / attendance.' },
];

const TeamAccessPage = () => {
  const toast = useToast();
  const { can, role: currentRole } = useContext(AppCtx);
  const roleOptions = useMemo(
    () => ROLE_OPTIONS.filter(o => !o.ownerOnly || currentRole === 'owner'),
    [currentRole]
  );

  const [employees, setEmployees] = useState([]);
  const [access, setAccess]       = useState([]); // joined: user_access + employee
  const [sections, setSections]   = useState([]);
  const [loading, setLoading]     = useState(true);
  const [search, setSearch]       = useState('');

  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [empRes, accessRes, secRes] = await Promise.all([
      window.sb.from('employees')
        .select('id, name, role, section_id, user_type, is_active')
        .eq('is_active', true)
        .order('name'),
      window.sb.from('user_access')
        .select('*, employees(id, name, role, section_id, user_type, is_active)'),
      window.sb.from('sections').select('*').order('sort_order'),
    ]);
    setEmployees(empRes.data || []);
    setAccess((accessRes.data || []).filter(a => a.employees));
    setSections(secRes.data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-access')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'user_access' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' },   () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return access.filter(a => {
      const e = a.employees;
      return matchesQuery(q, e.name, e.id, e.employee_code, e.company, e.role);
    });
  }, [access, search]);

  const startGrant = () => setEditing({
    _new: true,
    employee_id: '',
    role: 'manager',
    section_ids: [],
    all_sections: false,
    can_approve_leaves:     true,
    can_edit_attendance:    true,
    can_post_announcements: true,
    can_manage_tasks:       true,
    username: '',
    password: '',           // plaintext in the form; hashed on save
    password_set: false,    // true if the existing row already has a password
    notes: '',
  });

  const startEdit = (row) => setEditing({
    _new: false,
    employee_id: row.employee_id,
    role: row.employees.user_type,
    section_ids: row.section_ids || [],
    all_sections: !!row.all_sections,
    can_approve_leaves:     !!row.can_approve_leaves,
    can_edit_attendance:    !!row.can_edit_attendance,
    can_post_announcements: !!row.can_post_announcements,
    can_manage_tasks:       !!row.can_manage_tasks,
    username: row.username || '',
    password: '',           // only filled if the admin wants to change it
    password_set: !!row.password_sha256,
    notes: row.notes || '',
  });

  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.employee_id) { toast('Pick an employee'); return; }
    if ((editing.role === 'owner' || editing.role === 'admin') && currentRole !== 'owner') {
      toast('Only the Owner can assign Owner or Admin rights');
      return;
    }
    if (!editing.all_sections && editing.section_ids.length === 0 && editing.role !== 'hr') {
      toast('Pick at least one section (or All sections)'); return;
    }
    // Username + password validation.
    const usernameClean = (editing.username || '').trim().toLowerCase();
    if (usernameClean && !/^[a-z0-9_.-]{2,32}$/.test(usernameClean)) {
      toast('Username must be 2–32 chars (letters, numbers, . _ -)');
      return;
    }
    if (editing.password && editing.password.length < 4) {
      toast('Password must be at least 4 characters');
      return;
    }

    setSaving(true);
    try {
      // Promote/demote the employee's user_type. Role changes go through
      // the admin_change_role() RPC so the DB-side trigger can verify the
      // actor's credentials. Owner/Admin grants are restricted to the
      // signed-in Owner by the RPC itself.
      const sess = loadSession();
      if (!sess?.username || !sess?.password_sha256) {
        toast('Your session lacks credentials to change roles. Sign out and sign in again.');
        return;
      }
      const { error: roleErr } = await window.sb.rpc('admin_change_role', {
        p_actor_username:        sess.username,
        p_actor_password_sha256: sess.password_sha256,
        p_target_employee_id:    editing.employee_id,
        p_new_role:              editing.role,
      });
      if (roleErr) {
        const msg = (roleErr.message || '').toLowerCase();
        if (msg.includes('owner or admin')) toast('Only the Owner can grant Owner or Admin rights');
        else if (msg.includes('invalid credentials')) toast('Session expired — sign in again');
        else toast('Could not promote employee: ' + (roleErr.message || roleErr.hint || roleErr.code || 'unknown error'));
        console.error('admin_change_role error', roleErr);
        return;
      }

      // Hash the password if a new one was typed.
      let passwordHash = undefined;
      if (editing.password) {
        passwordHash = await window.sha256(editing.password);
      }

      const payload = {
        employee_id: editing.employee_id,
        section_ids: editing.all_sections ? [] : editing.section_ids,
        all_sections: editing.all_sections,
        can_approve_leaves:     editing.can_approve_leaves,
        can_edit_attendance:    editing.can_edit_attendance,
        can_post_announcements: editing.can_post_announcements,
        can_manage_tasks:       editing.can_manage_tasks,
        username: usernameClean || null,
        notes: editing.notes || null,
      };
      // Only overwrite password when a new one was typed OR the admin
      // explicitly cleared the existing password (password_set flipped
      // off while the field is empty).
      if (passwordHash !== undefined) payload.password_sha256 = passwordHash;
      else if (!editing.password_set) payload.password_sha256 = null;

      const { error: axErr } = await window.sb.from('user_access')
        .upsert(payload, { onConflict: 'employee_id' });
      if (axErr) {
        toast(axErr.message.includes('duplicate') && axErr.message.includes('username')
          ? 'That username is already taken'
          : 'Could not save access');
        return;
      }

      toast(editing._new ? 'Access granted' : 'Access updated');
      close();
    } finally { setSaving(false); }
  };

  const revoke = async (row) => {
    if (row.employees.user_type === 'owner') {
      toast('Cannot revoke the owner'); return;
    }
    if (!window.confirm(`Revoke ${row.employees.name}'s login access?\n\nThey'll be demoted to regular staff. Their attendance/leave history stays intact.`)) return;
    await Promise.all([
      window.sb.from('user_access').delete().eq('employee_id', row.employee_id),
      window.sb.from('employees').update({ user_type: 'staff' }).eq('id', row.employee_id),
    ]);
    toast(`Access revoked for ${row.employees.name}`);
  };

  // Employees who don't already have access (used by the pick-employee dropdown)
  const availableEmployees = useMemo(() => {
    const taken = new Set(access.map(a => a.employee_id));
    return employees.filter(e => !taken.has(e.id) || (editing && !editing._new && editing.employee_id === e.id));
  }, [employees, access, editing]);

  const sectionLabel = (id) => sections.find(s => s.id === id)?.name || id;
  const roleLabel = (r) => r === 'owner' ? 'Owner'
                       : r === 'admin' ? 'Admin'
                       : r === 'hr' ? 'HR'
                       : r === 'manager' ? 'Manager'
                       : r === 'supervisor' ? 'Supervisor'
                       : r === 'cc' ? 'Customer Care'
                       : r;

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Login users</div><div className="v">{access.length}</div></div>
        <div className="stat present"><div className="k">Owners</div><div className="v">{access.filter(a => a.employees.user_type === 'owner').length}</div></div>
        <div className="stat present"><div className="k">Admins</div><div className="v">{access.filter(a => a.employees.user_type === 'admin').length}</div></div>
        <div className="stat leave"><div className="k">HR</div><div className="v">{access.filter(a => a.employees.user_type === 'hr').length}</div></div>
        <div className="stat late"><div className="k">Managers</div><div className="v">{access.filter(a => a.employees.user_type === 'manager').length}</div></div>
        <div className="stat"><div className="k">Supervisors</div><div className="v">{access.filter(a => a.employees.user_type === 'supervisor').length}</div></div>
        <div className="stat leave"><div className="k">Customer Care</div><div className="v">{access.filter(a => a.employees.user_type === 'cc').length}</div></div>
      </div>

      <div className="toolbar">
        <input type="search" placeholder="Search name, ID, code or company…"
          value={search} onChange={e => setSearch(e.target.value)} />
        <div style={{ marginLeft: 'auto' }}>
          <button className="btn primary" onClick={startGrant}>+ Grant access</button>
        </div>
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 80 }}>ID</th>
              <th>Name</th>
              <th style={{ width: 110 }}>Role</th>
              <th>Scope</th>
              <th>Powers</th>
              <th style={{ width: 180 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={6} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No login users yet — click Grant access to add your first.'}
                </td>
              </tr>
            )}
            {rows.map(r => {
              const e = r.employees;
              const scope = r.all_sections ? 'All sections'
                : (r.section_ids.length
                    ? r.section_ids.map(sectionLabel).join(' · ')
                    : '—');
              const powers = [
                r.can_approve_leaves     && 'Leaves',
                r.can_edit_attendance    && 'Attendance',
                r.can_post_announcements && 'Announcements',
                r.can_manage_tasks       && 'Tasks',
              ].filter(Boolean);
              return (
                <tr key={r.employee_id}>
                  <td className="id">{r.employee_id}</td>
                  <td className="name">{e.name}
                    <div style={{ fontSize: 11, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 2 }}>
                      {e.role}
                      {r.username && (
                        <> · <span style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>@{r.username}</span></>
                      )}
                      {r.password_sha256 && (
                        <> · <span style={{ color: 'var(--success)' }} title="Password set">🔒</span></>
                      )}
                    </div>
                  </td>
                  <td>
                    <span className={`status-pill ${e.user_type === 'owner' || e.user_type === 'admin' ? 'present' : e.user_type === 'hr' || e.user_type === 'cc' ? 'leave' : e.user_type === 'manager' ? 'late' : 'unmarked'}`}>
                      {roleLabel(e.user_type)}
                    </span>
                  </td>
                  <td>{scope}</td>
                  <td style={{ fontSize: 12, color: 'var(--inkSoft)' }}>
                    {powers.length ? powers.join(' · ') : <span className="muted">—</span>}
                  </td>
                  <td>
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(r)}>Edit</button>
                    {e.user_type !== 'owner' && (
                      <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                        onClick={() => revoke(r)}>Revoke</button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <Modal
        open={!!editing}
        title={editing?._new ? 'Grant access' : 'Edit access'}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : editing?._new ? 'Grant access' : 'Save'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row">
              <label>Employee</label>
              {editing._new ? (
                <EmployeePicker
                  employees={availableEmployees}
                  value={editing.employee_id}
                  onChange={id => setEditing({ ...editing, employee_id: id })}
                  placeholder="Search by name, code, ID or role…"
                />
              ) : (
                <input readOnly
                  value={`${employees.find(e => e.id === editing.employee_id)?.name || editing.employee_id}`}
                  style={{ background: 'var(--surfaceAlt)' }} />
              )}
            </div>

            <div className="field-row">
              <label>Role</label>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {roleOptions.map(opt => (
                  <label key={opt.id} className="checkbox-row" style={{ cursor: 'pointer' }}>
                    <input type="radio"
                      name="role-pick"
                      checked={editing.role === opt.id}
                      onChange={() => setEditing({ ...editing, role: opt.id })} />
                    <div>
                      <div className="label-text">{opt.label}</div>
                      <div className="sub">{opt.sub}</div>
                    </div>
                  </label>
                ))}
                {currentRole !== 'owner' && (
                  <div style={{ fontSize: 11.5, color: 'var(--inkMuted)', marginTop: 4 }}>
                    Only the Owner can grant Owner or Admin rights. Ask the Owner to create those accounts.
                  </div>
                )}
              </div>
            </div>

            <div className="field-row">
              <label>Sections they can see</label>
              <label className="checkbox-row" style={{ cursor: 'pointer', marginBottom: 8 }}>
                <input type="checkbox"
                  checked={editing.all_sections}
                  onChange={e => setEditing({ ...editing, all_sections: e.target.checked })} />
                <div>
                  <div className="label-text">All sections</div>
                  <div className="sub">Company-wide visibility, including any sections added later.</div>
                </div>
              </label>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8, opacity: editing.all_sections ? 0.4 : 1 }}>
                {sections.map(s => {
                  const checked = editing.section_ids.includes(s.id);
                  return (
                    <label key={s.id} className="checkbox-row" style={{ cursor: 'pointer' }}>
                      <input type="checkbox"
                        checked={checked}
                        disabled={editing.all_sections}
                        onChange={e => {
                          setEditing({
                            ...editing,
                            section_ids: e.target.checked
                              ? [...editing.section_ids, s.id]
                              : editing.section_ids.filter(id => id !== s.id),
                          });
                        }} />
                      <div>
                        <div className="label-text">{s.name}</div>
                        <div className="sub">{s.monogram}</div>
                      </div>
                    </label>
                  );
                })}
              </div>
            </div>

            <div className="field-row">
              <label>Powers</label>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 8 }}>
                {[
                  { k: 'can_approve_leaves',     label: 'Approve / reject leaves' },
                  { k: 'can_edit_attendance',    label: 'Mark / edit attendance' },
                  { k: 'can_post_announcements', label: 'Post announcements' },
                  { k: 'can_manage_tasks',       label: 'Create / edit tasks' },
                ].map(p => (
                  <label key={p.k} className="checkbox-row" style={{ cursor: 'pointer' }}>
                    <input type="checkbox"
                      checked={editing[p.k]}
                      onChange={e => setEditing({ ...editing, [p.k]: e.target.checked })} />
                    <div>
                      <div className="label-text">{p.label}</div>
                    </div>
                  </label>
                ))}
              </div>
            </div>

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Username {editing._new ? '' : '(login)'}</label>
                <input
                  value={editing.username || ''}
                  onChange={e => setEditing({ ...editing, username: e.target.value.toLowerCase() })}
                  placeholder="e.g. fuzail"
                  style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
                <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 4 }}>
                  Optional — if set, the user must log in with username + password.
                </div>
              </div>
              <div>
                <label>
                  Password
                  {editing.password_set && !editing.password
                    ? <span style={{ color: 'var(--success)', marginLeft: 6 }}>· already set</span>
                    : ''}
                </label>
                <input type="password"
                  value={editing.password || ''}
                  onChange={e => setEditing({ ...editing, password: e.target.value })}
                  placeholder={editing.password_set ? 'Leave blank to keep current' : 'min 4 characters'} />
                {editing.password_set && (
                  <label style={{
                    display: 'inline-flex', alignItems: 'center', gap: 6,
                    marginTop: 6, fontSize: 12, color: 'var(--inkSoft)', cursor: 'pointer',
                  }}>
                    <input type="checkbox"
                      checked={!editing.password_set}
                      onChange={e => setEditing({ ...editing, password_set: !e.target.checked, password: '' })} />
                    Remove password (allow tap-to-login)
                  </label>
                )}
              </div>
            </div>

            <div className="field-row">
              <label>Notes (optional)</label>
              <textarea
                value={editing.notes || ''}
                onChange={e => setEditing({ ...editing, notes: e.target.value })}
                placeholder="Shift pattern, hand-off rules, anything worth remembering…" />
            </div>
          </>
        )}
      </Modal>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Page router
// ──────────────────────────────────────────────────────────
// ──────────────────────────────────────────────────────────
// Advances — HR files, Owner approves (can edit amount + months).
// Repayment tracked via months_deducted; auto-deduction lands in
// the payslip generator (separate hook-in).
// ──────────────────────────────────────────────────────────
const ADV_STATUS_TONE = {
  pending:   'late',
  approved:  'present',
  rejected:  'absent',
  completed: 'leave',
  cancelled: 'unmarked',
};

const AdvancesPage = () => {
  const toast = useToast();
  const { role, can, session } = useContext(AppCtx);
  const canDecide = role === 'owner';

  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [statusFilter, setStatusFilter] = useState('pending');
  const [search, setSearch] = useState('');

  const [filing, setFiling] = useState(null);      // new advance form
  const [detail, setDetail] = useState(null);      // selected row to view/decide
  const [saving, setSaving] = useState(false);
  const [printing, setPrinting] = useState(false); // print preview on

  const [employees, setEmployees] = useState([]);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [advRes, empRes] = await Promise.all([
      window.sb.from('advances')
        .select('*, employees!advances_employee_id_fkey(id, name, role, section_id, user_type, city), decider:employees!advances_decided_by_fkey(id, name), filer:employees!advances_filed_by_fkey(id, name)')
        .order('created_at', { ascending: false }),
      window.sb.from('employees')
        .select('id, name, role, section_id, user_type')
        .eq('is_active', true)
        .neq('user_type', 'owner')
        .order('name'),
    ]);
    setRows((advRes.data || []).filter(r => r.employees));
    setEmployees(empRes.data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-advances')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'advances' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' }, () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return rows.filter(r => {
      if (statusFilter !== 'all' && r.status !== statusFilter) return false;
      if (!matchesQuery(q, r.employees?.name, r.employee_id, r.reason)) return false;
      return true;
    });
  }, [rows, statusFilter, search]);

  const counts = useMemo(() => {
    const outstanding = rows
      .filter(r => r.status === 'approved')
      .reduce((s, r) => {
        const remaining = Math.max(0, (r.months_total - r.months_deducted)) * (r.monthly_deduction || 0);
        return s + remaining;
      }, 0);
    return {
      total:     rows.length,
      pending:   rows.filter(r => r.status === 'pending').length,
      approved:  rows.filter(r => r.status === 'approved').length,
      completed: rows.filter(r => r.status === 'completed').length,
      rejected:  rows.filter(r => r.status === 'rejected').length,
      outstanding,
    };
  }, [rows]);

  const startFile = () => setFiling({
    employee_id: '',
    amount_requested: 5000,
    months_total: 2,
    reason: '',
  });

  const submitFile = async () => {
    if (!filing || saving) return;
    if (!filing.employee_id) { toast('Pick an employee'); return; }
    const amt = parseInt(filing.amount_requested, 10);
    const months = parseInt(filing.months_total, 10);
    if (!amt || amt <= 0) { toast('Amount must be > 0'); return; }
    if (!months || months <= 0) { toast('Months must be > 0'); return; }
    setSaving(true);
    try {
      await window.sb.from('advances').insert({
        employee_id: filing.employee_id,
        amount_requested: amt,
        months_total: months,
        reason: (filing.reason || '').trim() || null,
        status: 'pending',
        filed_by: session?.employee_id || null,
      });
      toast('Advance request filed');
      setFiling(null);
    } finally { setSaving(false); }
  };

  const startDetail = (row) => setDetail({
    ...row,
    // Owner-editable draft fields, pre-filled from the request.
    _amount:      row.amount_approved ?? row.amount_requested,
    _months:      row.months_total,
    _note:        row.owner_note || '',
  });

  const decide = async (action) => {
    if (!detail || saving || !canDecide) return;
    const amt = parseInt(detail._amount, 10);
    const months = parseInt(detail._months, 10);
    if (action === 'approved') {
      if (!amt || amt <= 0) { toast('Approved amount must be > 0'); return; }
      if (!months || months <= 0) { toast('Months must be > 0'); return; }
    }
    setSaving(true);
    try {
      const monthly = action === 'approved' ? Math.ceil(amt / months) : null;
      const patch = {
        status: action,
        decided_at: new Date().toISOString(),
        decided_by: session?.employee_id || null,
        owner_note: (detail._note || '').trim() || null,
      };
      if (action === 'approved') {
        patch.amount_approved = amt;
        patch.months_total = months;
        patch.monthly_deduction = monthly;
      }
      await window.sb.from('advances').update(patch).eq('id', detail.id);
      toast(action === 'approved' ? 'Advance approved' : 'Advance rejected');
      setDetail(null);
    } finally { setSaving(false); }
  };

  const cancel = async (row) => {
    if (!window.confirm('Cancel this advance request?')) return;
    await window.sb.from('advances').update({ status: 'cancelled' }).eq('id', row.id);
    toast('Cancelled');
  };

  const formatRemaining = (r) => {
    if (r.status !== 'approved') return '—';
    const monthsLeft = Math.max(0, r.months_total - r.months_deducted);
    return `${rupees(monthsLeft * (r.monthly_deduction || 0))} · ${monthsLeft}/${r.months_total} mo`;
  };

  const employeesForPicker = employees;

  return (
    <div>
      <div className="stat-strip">
        <div className="stat late"><div className="k">Pending</div><div className="v">{counts.pending}</div></div>
        <div className="stat present"><div className="k">Approved</div><div className="v">{counts.approved}</div></div>
        <div className="stat leave"><div className="k">Completed</div><div className="v">{counts.completed}</div></div>
        <div className="stat absent"><div className="k">Rejected</div><div className="v">{counts.rejected}</div></div>
        <div className="stat"><div className="k">Outstanding</div><div className="v" style={{ fontSize: 18 }}>{rupees(counts.outstanding)}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'pending',   label: `Pending · ${counts.pending}` },
            { id: 'approved',  label: `Approved · ${counts.approved}` },
            { id: 'completed', label: `Completed · ${counts.completed}` },
            { id: 'rejected',  label: `Rejected · ${counts.rejected}` },
            { id: 'all',       label: `All · ${counts.total}` },
          ].map(s => (
            <button key={s.id} className={statusFilter === s.id ? 'active' : ''}
              onClick={() => setStatusFilter(s.id)}>{s.label}</button>
          ))}
        </div>
        <input type="search" placeholder="Search name, ID, or reason…"
          value={search} onChange={e => setSearch(e.target.value)} />
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <button className="btn"
            onClick={() => setPrinting(true)}
            disabled={!rows.some(r => r.status === 'approved' || r.status === 'completed')}
            title="Print all approved/completed advance receipts">
            🖨 Print receipts ({rows.filter(r => r.status === 'approved' || r.status === 'completed').length})
          </button>
          {can('advances', 'create') && (
            <button className="btn primary" onClick={startFile}>+ File advance</button>
          )}
        </div>
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 80 }}>ID</th>
              <th>Employee</th>
              <th style={{ width: 120 }}>Requested</th>
              <th style={{ width: 120 }}>Approved</th>
              <th style={{ width: 90 }}>Months</th>
              <th>Reason</th>
              <th style={{ width: 170 }}>Outstanding</th>
              <th style={{ width: 120 }}>Filed by</th>
              <th style={{ width: 100 }}>Status</th>
              <th style={{ width: 130 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr>
                <td colSpan={10} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No advances match.'}
                </td>
              </tr>
            )}
            {filtered.map(r => (
              <tr key={r.id}>
                <td className="id">{r.employee_id}</td>
                <td className="name">
                  {r.employees?.name || r.employee_id}
                  <div style={{ fontSize: 11, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 2 }}>
                    {r.employees?.role || ''}
                    {r.employees?.section_id ? ` · ${SECTION_META[r.employees.section_id]?.label || r.employees.section_id}` : ''}
                  </div>
                </td>
                <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
                  {rupees(r.amount_requested)}
                </td>
                <td style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', fontWeight: 600 }}>
                  {r.amount_approved != null ? rupees(r.amount_approved) : <span className="muted">—</span>}
                </td>
                <td className="muted">
                  {r.months_total}{r.status === 'approved' ? ` (${r.months_deducted} done)` : ''}
                </td>
                <td style={{ maxWidth: 280 }}>
                  <div style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}
                    title={r.reason}>{r.reason || '—'}</div>
                </td>
                <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
                  {formatRemaining(r)}
                </td>
                <td style={{ fontSize: 12.5 }}>
                  {r.filer?.name
                    ? r.filer.name
                    : r.filed_by
                      ? <span className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>{r.filed_by}</span>
                      : <span className="muted">—</span>}
                </td>
                <td>
                  <span className={`status-pill ${ADV_STATUS_TONE[r.status]}`}>{r.status}</span>
                </td>
                <td>
                  <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                    onClick={() => startDetail(r)}>Review</button>
                  {r.status === 'pending' && can('advances', 'edit') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => cancel(r)}>Cancel</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* File advance modal */}
      <Modal
        open={!!filing}
        title="File advance request"
        onClose={() => setFiling(null)}
        footer={
          <>
            <button className="btn" onClick={() => setFiling(null)} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={submitFile} disabled={saving}>
              {saving ? 'Filing…' : 'Submit for owner approval'}
            </button>
          </>
        }
      >
        {filing && (
          <>
            <div className="field-row">
              <label>Employee (no owners)</label>
              <EmployeePicker
                employees={employeesForPicker}
                value={filing.employee_id}
                onChange={id => setFiling({ ...filing, employee_id: id })}
                extraLabel={e => e.section_id ? (SECTION_META[e.section_id]?.label || e.section_id) : ''}
              />
            </div>
            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Amount (₹)</label>
                <input type="number" min="1"
                  value={filing.amount_requested}
                  onChange={e => setFiling({ ...filing, amount_requested: e.target.value })}
                  style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
              </div>
              <div>
                <label>Repay over (months)</label>
                <input type="number" min="1" max="24"
                  value={filing.months_total}
                  onChange={e => setFiling({ ...filing, months_total: e.target.value })} />
                <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 4 }}>
                  {(() => {
                    const amt = parseInt(filing.amount_requested, 10) || 0;
                    const mo = parseInt(filing.months_total, 10) || 0;
                    if (!amt || !mo) return '';
                    return `~ ${rupees(Math.ceil(amt / mo))} deducted / month`;
                  })()}
                </div>
              </div>
            </div>
            <div className="field-row">
              <label>Reason</label>
              <textarea value={filing.reason || ''}
                onChange={e => setFiling({ ...filing, reason: e.target.value })}
                placeholder="e.g. Medical emergency for mother" />
            </div>
            <div style={{
              fontSize: 12, color: 'var(--info)',
              background: 'var(--infoSoft)', padding: 10, borderRadius: 10,
            }}>
              The Owner will review this request. They can adjust the approved amount or repayment period before approving.
            </div>
          </>
        )}
      </Modal>

      {/* Review / decide modal */}
      <Modal
        open={!!detail}
        title={detail
          ? (detail.status === 'pending'
              ? `Review advance · ${detail.employees?.name || ''}`
              : `Advance · ${detail.employees?.name || ''}`)
          : ''}
        onClose={() => setDetail(null)}
        footer={
          <>
            <button className="btn" onClick={() => setDetail(null)} disabled={saving}>Close</button>
            {detail?.status === 'pending' && canDecide && (
              <>
                <button className="btn danger" onClick={() => decide('rejected')} disabled={saving}>
                  Reject
                </button>
                <button className="btn primary" onClick={() => decide('approved')} disabled={saving}>
                  {saving ? 'Saving…' : 'Approve'}
                </button>
              </>
            )}
          </>
        }
      >
        {detail && (
          <>
            <div style={{
              display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12,
              padding: 14, background: 'var(--bg)',
              border: '1px solid var(--border)', borderRadius: 12, marginBottom: 14,
            }}>
              <DetailField label="Employee ID" value={detail.employee_id} mono />
              <DetailField label="Name"        value={detail.employees?.name || '—'} />
              <DetailField label="Role"        value={detail.employees?.role || '—'} />
              <DetailField label="Section"     value={SECTION_META[detail.employees?.section_id]?.label || '—'} />
              <DetailField label="Requested"   value={rupees(detail.amount_requested)} mono />
              <DetailField label="Requested over" value={`${detail.months_total} month${detail.months_total === 1 ? '' : 's'}`} />
              <DetailField label="Filed at"    value={fmtDateTime(detail.created_at)} />
              <DetailField
                label="Filed by"
                value={detail.filer?.name || detail.filed_by || '—'}
                mono={!detail.filer?.name && !!detail.filed_by}
              />
              <DetailField label="Status"      value={detail.status} />
              {detail.status !== 'pending' && (
                <DetailField
                  label={detail.status === 'approved' ? 'Approved by' : 'Decided by'}
                  value={detail.decider?.name || detail.decided_by || '—'}
                  mono={!detail.decider?.name && !!detail.decided_by}
                />
              )}
              {detail.reason && (
                <div style={{ gridColumn: '1 / -1' }}>
                  <DetailField label="Reason" value={detail.reason} />
                </div>
              )}
            </div>

            {detail.status === 'pending' && canDecide && (
              <>
                <div style={{
                  fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: 'var(--inkMuted)', marginBottom: 8,
                }}>Your decision</div>
                <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                  <div>
                    <label>Approved amount (₹)</label>
                    <input type="number" min="1"
                      value={detail._amount}
                      onChange={e => setDetail({ ...detail, _amount: e.target.value })}
                      style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
                  </div>
                  <div>
                    <label>Months</label>
                    <input type="number" min="1" max="24"
                      value={detail._months}
                      onChange={e => setDetail({ ...detail, _months: e.target.value })} />
                    <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 4 }}>
                      {(() => {
                        const amt = parseInt(detail._amount, 10) || 0;
                        const mo = parseInt(detail._months, 10) || 0;
                        if (!amt || !mo) return '';
                        return `${rupees(Math.ceil(amt / mo))} / month for ${mo} mo`;
                      })()}
                    </div>
                  </div>
                </div>
                <div className="field-row">
                  <label>Note to HR (optional)</label>
                  <textarea value={detail._note || ''}
                    onChange={e => setDetail({ ...detail, _note: e.target.value })}
                    placeholder="Visible on the advance record" />
                </div>
              </>
            )}

            {detail.status === 'approved' && (
              <div style={{
                background: 'var(--brandSoft)', borderRadius: 12, padding: 14, marginBottom: 10,
              }}>
                <div style={{
                  fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: 'var(--brand)', marginBottom: 6,
                }}>Repayment</div>
                <div style={{
                  display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10,
                  fontFamily: 'JetBrains Mono, Menlo, monospace',
                }}>
                  <DetailField label="Approved"    value={rupees(detail.amount_approved)} mono />
                  <DetailField label="Per month"   value={rupees(detail.monthly_deduction)} mono />
                  <DetailField label="Remaining"   value={formatRemaining(detail)} mono />
                </div>
              </div>
            )}

            {detail.owner_note && detail.status !== 'pending' && (
              <div style={{
                fontSize: 12.5, color: 'var(--inkSoft)',
                padding: 12, borderRadius: 10, background: 'var(--surfaceAlt)',
                marginBottom: 10,
              }}>
                <strong>Owner's note:</strong> {detail.owner_note}
              </div>
            )}
          </>
        )}
      </Modal>

      {printing && (
        <AdvanceReceiptsPrint
          rows={rows
            .filter(r => r.status === 'approved' || r.status === 'completed')
            .sort((a, b) => (b.decided_at || b.created_at || '').localeCompare(a.decided_at || a.created_at || ''))}
          onClose={() => setPrinting(false)}
        />
      )}
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// CRM — Customers list, add / edit, detail sheet with
// Preferences + Family tabs. Scoped by the `customers` PERM.
// ──────────────────────────────────────────────────────────
const RELATIONS = ['husband', 'wife', 'son', 'daughter', 'mother', 'father', 'sister', 'brother', 'other'];
const SOURCES   = ['walk-in', 'referral', 'muhurtham', 'social', 'other'];
const PREF_CATEGORIES = ['silk', 'cotton', 'dhoti', 'shirting', 'kurta', 'dress', 'other'];

const CustomersPage = () => {
  const toast = useToast();
  const { can, session } = useContext(AppCtx);

  const [rows, setRows]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [tagFilter, setTagFilter] = useState('all');
  const [editing, setEditing] = useState(null);    // customer being created/edited
  const [detail, setDetail]   = useState(null);    // customer whose detail sheet is open
  const [saving, setSaving]   = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('customers')
      .select('*')
      .order('created_at', { ascending: false });
    setRows(data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-customers')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  // Keep the detail sheet in sync with the underlying row (so edits made
  // via the "Edit" button or realtime updates elsewhere flow in).
  useEffect(() => {
    if (!detail) return;
    const fresh = rows.find(r => r.id === detail.id);
    if (fresh && fresh.updated_at !== detail.updated_at) setDetail(fresh);
  }, [rows, detail]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return rows.filter(c => {
      if (tagFilter === 'vip' && !c.is_vip) return false;
      if (tagFilter === 'muhurtham' && !(c.tags || []).includes('muhurtham')) return false;
      if (tagFilter === 'dnc' && !c.do_not_contact) return false;
      if (!matchesQuery(q, c.name, c.phone, c.alt_phone, c.email, c.city, (c.tags || []).join(' '))) return false;
      return true;
    });
  }, [rows, search, tagFilter]);

  const counts = useMemo(() => ({
    total: rows.length,
    vip:   rows.filter(c => c.is_vip).length,
    muhurtham: rows.filter(c => (c.tags || []).includes('muhurtham')).length,
    dnc:   rows.filter(c => c.do_not_contact).length,
    thisMonth: rows.filter(c => {
      const d = new Date(c.created_at);
      const now = new Date();
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length,
  }), [rows]);

  const blankCustomer = () => ({
    id: null, _new: true,
    name: '', phone: '', alt_phone: '', email: '',
    address: '', city: '', pincode: '',
    birthday: '', anniversary: '',
    language_pref: 'ta', source: 'walk-in',
    tags: [], is_vip: false, do_not_contact: false,
    notes: '',
  });

  const startNew = () => setEditing(blankCustomer());
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.name.trim()) { toast('Name is required'); return; }
    setSaving(true);
    try {
      const payload = {
        name: editing.name.trim(),
        phone:         (editing.phone || '').trim() || null,
        alt_phone:     (editing.alt_phone || '').trim() || null,
        email:         (editing.email || '').trim() || null,
        address:       (editing.address || '').trim() || null,
        city:          (editing.city || '').trim() || null,
        pincode:       (editing.pincode || '').trim() || null,
        birthday:      editing.birthday || null,
        anniversary:   editing.anniversary || null,
        language_pref: editing.language_pref || 'ta',
        source:        editing.source || 'walk-in',
        tags:          Array.isArray(editing.tags) ? editing.tags : [],
        is_vip:        !!editing.is_vip,
        do_not_contact:!!editing.do_not_contact,
        notes:         (editing.notes || '').trim() || null,
      };
      if (editing._new) {
        payload.created_by = session?.employee_id || null;
        const { data, error } = await window.sb.from('customers').insert(payload).select().single();
        if (error) { toast('Could not add customer: ' + error.message); console.error(error); return; }
        toast('Customer added');
        setDetail(data);
      } else {
        const { error } = await window.sb.from('customers').update(payload).eq('id', editing.id);
        if (error) { toast('Could not save: ' + error.message); console.error(error); return; }
        toast('Customer updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const del = async (row) => {
    if (!can('customers', 'delete')) return;
    if (!window.confirm(`Delete ${row.name}? This removes preferences + family notes too. Cannot be undone.`)) return;
    await window.sb.from('customers').delete().eq('id', row.id);
    toast('Customer deleted');
    if (detail?.id === row.id) setDetail(null);
  };

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
        <div className="stat present"><div className="k">VIP</div><div className="v">{counts.vip}</div></div>
        <div className="stat late"><div className="k">Muhurtham</div><div className="v">{counts.muhurtham}</div></div>
        <div className="stat leave"><div className="k">New this month</div><div className="v">{counts.thisMonth}</div></div>
        <div className="stat absent"><div className="k">Do-not-contact</div><div className="v">{counts.dnc}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'all',       label: `All · ${counts.total}` },
            { id: 'vip',       label: `VIP · ${counts.vip}` },
            { id: 'muhurtham', label: `Muhurtham · ${counts.muhurtham}` },
            { id: 'dnc',       label: `DNC · ${counts.dnc}` },
          ].map(s => (
            <button key={s.id}
              className={tagFilter === s.id ? 'active' : ''}
              onClick={() => setTagFilter(s.id)}>
              {s.label}
            </button>
          ))}
        </div>
        <input type="search" placeholder="Search name, phone, email, city, tag…"
          value={search} onChange={e => setSearch(e.target.value)} />
        {can('customers', 'create') && (
          <button className="btn primary" onClick={startNew}
            style={{ marginLeft: 'auto' }}>
            + New customer
          </button>
        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th>Name</th>
              <th style={{ width: 150 }}>Phone</th>
              <th style={{ width: 120 }}>City</th>
              <th style={{ width: 130 }}>Source</th>
              <th style={{ width: 160 }}>Tags</th>
              <th style={{ width: 130 }}>Added</th>
              <th style={{ width: 190 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr>
                <td colSpan={7} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : rows.length === 0 ? 'No customers yet. Click "+ New customer" to add the first.' : 'No customers match these filters.'}
                </td>
              </tr>
            )}
            {filtered.map(c => (
              <tr key={c.id} onClick={() => setDetail(c)} style={{ cursor: 'pointer' }}>
                <td className="name">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span>{c.name}</span>
                    {c.is_vip && <span className="status-pill late" style={{ fontSize: 10 }}>★ VIP</span>}
                    {c.do_not_contact && <span className="status-pill absent" style={{ fontSize: 10 }}>DNC</span>}
                  </div>
                </td>
                <td className="muted" style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', fontSize: 12.5 }}>
                  {c.phone || <span className="muted">—</span>}
                </td>
                <td>{c.city || <span className="muted">—</span>}</td>
                <td className="muted" style={{ fontSize: 12.5 }}>{c.source || '—'}</td>
                <td>
                  {(c.tags || []).length === 0
                    ? <span className="muted">—</span>
                    : (c.tags || []).slice(0, 2).map(t => (
                        <span key={t} className="status-pill" style={{ marginRight: 4, fontSize: 10, background: 'var(--surfaceAlt)', color: 'var(--inkSoft)' }}>
                          {t}
                        </span>
                      ))
                  }
                  {(c.tags || []).length > 2 && <span className="muted" style={{ fontSize: 11 }}>+{(c.tags || []).length - 2}</span>}
                </td>
                <td className="muted" style={{ fontSize: 12 }}>{fmtDateTime(c.created_at)}</td>
                <td onClick={e => e.stopPropagation()}>
                  {can('customers', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(c)}>Edit</button>
                  )}
                  {can('customers', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => del(c)}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <CustomerEditModal
        open={!!editing}
        draft={editing}
        onChange={setEditing}
        onClose={close}
        onSave={save}
        saving={saving}
      />

      <CustomerDetailSheet
        customer={detail}
        onClose={() => setDetail(null)}
        onEdit={() => setEditing({ ...detail, _new: false })}
        canEdit={can('customers', 'edit')}
      />
    </div>
  );
};

// ─── Customer edit modal ───────────────────────────────────
const CustomerEditModal = ({ open, draft, onChange, onClose, onSave, saving }) => {
  if (!draft) return null;
  const setField = (k, v) => onChange({ ...draft, [k]: v });
  const toggleTag = (tag) => {
    const cur = Array.isArray(draft.tags) ? draft.tags : [];
    setField('tags', cur.includes(tag) ? cur.filter(t => t !== tag) : [...cur, tag]);
  };
  const commonTags = ['muhurtham', 'regular', 'referral', 'wholesale', 'priority'];

  return (
    <Modal
      open={open}
      title={draft._new ? 'New customer' : `Edit · ${draft.name}`}
      onClose={onClose}
      footer={
        <>
          <button className="btn" onClick={onClose} disabled={saving}>Cancel</button>
          <button className="btn primary" onClick={onSave} disabled={saving}>
            {saving ? 'Saving…' : draft._new ? 'Add customer' : 'Save'}
          </button>
        </>
      }
    >
      <div className="field-row">
        <label>Full name *</label>
        <input autoFocus value={draft.name}
          onChange={e => setField('name', e.target.value)}
          placeholder="e.g. Priya Kannan" />
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <label>Phone</label>
          <input value={draft.phone || ''} inputMode="tel"
            onChange={e => setField('phone', e.target.value)}
            placeholder="9876543210" />
        </div>
        <div>
          <label>Alt phone</label>
          <input value={draft.alt_phone || ''} inputMode="tel"
            onChange={e => setField('alt_phone', e.target.value)}
            placeholder="Husband / mother / etc." />
        </div>
      </div>

      <div className="field-row">
        <label>Email (optional)</label>
        <input value={draft.email || ''} type="email"
          onChange={e => setField('email', e.target.value)} />
      </div>

      <div className="field-row">
        <label>Address</label>
        <textarea value={draft.address || ''} rows={2}
          onChange={e => setField('address', e.target.value)}
          placeholder="House / flat, street, landmark" />
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <label>City / town</label>
          <input value={draft.city || ''}
            onChange={e => setField('city', e.target.value)} />
        </div>
        <div>
          <label>Pincode</label>
          <input value={draft.pincode || ''} inputMode="numeric" maxLength={6}
            onChange={e => setField('pincode', e.target.value)} />
        </div>
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <label>Birthday</label>
          <input type="date" value={draft.birthday || ''}
            onChange={e => setField('birthday', e.target.value)} />
        </div>
        <div>
          <label>Anniversary</label>
          <input type="date" value={draft.anniversary || ''}
            onChange={e => setField('anniversary', e.target.value)} />
        </div>
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <label>Language preference</label>
          <select value={draft.language_pref || 'ta'}
            onChange={e => setField('language_pref', e.target.value)}>
            <option value="ta">Tamil (தமிழ்)</option>
            <option value="en">English</option>
          </select>
        </div>
        <div>
          <label>Source</label>
          <select value={draft.source || 'walk-in'}
            onChange={e => setField('source', e.target.value)}>
            {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      </div>

      <div className="field-row">
        <label>Tags</label>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
          {commonTags.map(tag => {
            const on = (draft.tags || []).includes(tag);
            return (
              <button key={tag} type="button"
                onClick={() => toggleTag(tag)}
                className={`btn ${on ? 'primary' : ''}`}
                style={{ height: 26, padding: '0 10px', fontSize: 12 }}>
                {on ? '✓ ' : ''}{tag}
              </button>
            );
          })}
        </div>
        <div className="sub" style={{ marginTop: 4, fontSize: 11.5, color: 'var(--inkMuted)' }}>
          Pick the ones that apply. 'muhurtham' surfaces the customer on the Muhurtham pipeline (Part C).
        </div>
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <label className="checkbox-row" style={{ cursor: 'pointer' }}>
          <input type="checkbox" checked={!!draft.is_vip}
            onChange={e => setField('is_vip', e.target.checked)} />
          <div>
            <div className="label-text">VIP customer</div>
            <div className="sub">Highlighted on every list.</div>
          </div>
        </label>
        <label className="checkbox-row" style={{ cursor: 'pointer' }}>
          <input type="checkbox" checked={!!draft.do_not_contact}
            onChange={e => setField('do_not_contact', e.target.checked)} />
          <div>
            <div className="label-text">Do not contact</div>
            <div className="sub">CC team should not call / message.</div>
          </div>
        </label>
      </div>

      <div className="field-row">
        <label>Notes (free text)</label>
        <textarea value={draft.notes || ''} rows={3}
          onChange={e => setField('notes', e.target.value)}
          placeholder="Anything the CC team should remember — preferred stylist, past complaint, family context, etc." />
      </div>
    </Modal>
  );
};

// ─── Customer detail sheet with Preferences + Family tabs ──
const CustomerDetailSheet = ({ customer, onClose, onEdit, canEdit }) => {
  const { session } = useContext(AppCtx);
  const [tab, setTab] = useState('summary');
  const [prefs, setPrefs]         = useState([]);
  const [family, setFamily]       = useState([]);
  const [interactions, setInteractions] = useState([]);
  const [muhurthams,  setMuhurthams]    = useState([]);
  const [loading, setLoading] = useState(false);

  const [prefDraft, setPrefDraft]       = useState(null);
  const [famDraft, setFamDraft]         = useState(null);
  const [interDraft, setInterDraft]     = useState(null);   // null | draft for InteractionLogModal
  const [muhDraft, setMuhDraft]         = useState(null);   // null | draft for MuhurthamEditModal
  const [interSaving, setInterSaving]   = useState(false);
  const [muhSaving, setMuhSaving]       = useState(false);

  useEffect(() => {
    if (!customer || !window.sb) return;
    let cancelled = false;
    setLoading(true);
    const fetchRelated = async () => {
      const [prefRes, famRes, interRes, muhRes] = await Promise.all([
        window.sb.from('customer_preferences').select('*')
          .eq('customer_id', customer.id).order('created_at', { ascending: true }),
        window.sb.from('customer_family_members').select('*')
          .eq('customer_id', customer.id).order('created_at', { ascending: true }),
        window.sb.from('customer_interactions').select('*')
          .eq('customer_id', customer.id).order('occurred_at', { ascending: false }),
        window.sb.from('muhurtham_visits').select('*')
          .eq('customer_id', customer.id).order('visit_date', { ascending: false, nullsFirst: false }),
      ]);
      if (cancelled) return;
      setPrefs(prefRes.data || []);
      setFamily(famRes.data || []);
      setInteractions(interRes.data || []);
      setMuhurthams(muhRes.data || []);
      setLoading(false);
    };
    fetchRelated();
    const ch = window.sb.channel(`customer-${customer.id}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'customer_preferences', filter: `customer_id=eq.${customer.id}` },
        () => fetchRelated())
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'customer_family_members', filter: `customer_id=eq.${customer.id}` },
        () => fetchRelated())
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'customer_interactions', filter: `customer_id=eq.${customer.id}` },
        () => fetchRelated())
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'muhurtham_visits', filter: `customer_id=eq.${customer.id}` },
        () => fetchRelated())
      .subscribe();
    return () => { cancelled = true; window.sb.removeChannel(ch); };
  }, [customer]);

  const savePref = async () => {
    if (!prefDraft) return;
    const payload = {
      customer_id:  customer.id,
      category:     (prefDraft.category || '').trim() || null,
      sub_category: (prefDraft.sub_category || '').trim() || null,
      color_notes:  (prefDraft.color_notes || '').trim() || null,
      price_min:    prefDraft.price_min === '' ? null : Number(prefDraft.price_min),
      price_max:    prefDraft.price_max === '' ? null : Number(prefDraft.price_max),
      notes:        (prefDraft.notes || '').trim() || null,
    };
    if (prefDraft.id) {
      await window.sb.from('customer_preferences').update(payload).eq('id', prefDraft.id);
    } else {
      await window.sb.from('customer_preferences').insert(payload);
    }
    setPrefDraft(null);
  };

  const delPref = async (p) => {
    if (!window.confirm('Delete this preference?')) return;
    await window.sb.from('customer_preferences').delete().eq('id', p.id);
  };

  const saveFam = async () => {
    if (!famDraft) return;
    if (!(famDraft.name || '').trim()) return;
    const payload = {
      customer_id: customer.id,
      name: famDraft.name.trim(),
      relation: famDraft.relation || null,
      age:      famDraft.age === '' ? null : Number(famDraft.age),
      notes:    (famDraft.notes || '').trim() || null,
    };
    if (famDraft.id) {
      await window.sb.from('customer_family_members').update(payload).eq('id', famDraft.id);
    } else {
      await window.sb.from('customer_family_members').insert(payload);
    }
    setFamDraft(null);
  };

  const delFam = async (m) => {
    if (!window.confirm(`Remove ${m.name} from family notes?`)) return;
    await window.sb.from('customer_family_members').delete().eq('id', m.id);
  };

  if (!customer) return null;
  return (
    <Modal
      open={!!customer}
      title={customer.name}
      onClose={onClose}
      footer={
        <>
          {canEdit && <button className="btn" onClick={onEdit}>Edit customer</button>}
          <button className="btn primary" onClick={onClose}>Close</button>
        </>
      }
    >
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap', marginBottom: 14 }}>
        {customer.is_vip && <span className="status-pill late">★ VIP</span>}
        {customer.do_not_contact && <span className="status-pill absent">Do not contact</span>}
        {(customer.tags || []).map(t => (
          <span key={t} className="status-pill" style={{ background: 'var(--surfaceAlt)', color: 'var(--inkSoft)' }}>{t}</span>
        ))}
      </div>

      <div className="seg" style={{ width: 'fit-content', marginBottom: 14 }}>
        {[
          { id: 'summary',     label: 'Summary' },
          { id: 'prefs',       label: `Preferences (${prefs.length})` },
          { id: 'family',      label: `Family (${family.length})` },
          { id: 'interactions',label: `Interactions (${interactions.length})` },
          { id: 'muhurtham',   label: `Muhurtham (${muhurthams.length})` },
        ].map(t => (
          <button key={t.id} type="button"
            className={tab === t.id ? 'active' : ''}
            onClick={() => setTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === 'summary' && (
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 10,
          background: 'var(--bg)', border: '1px solid var(--border)',
          borderRadius: 12, padding: 14, marginBottom: 10,
        }}>
          <DetailField label="Phone"        value={customer.phone || '—'} mono />
          <DetailField label="Alt phone"    value={customer.alt_phone || '—'} mono />
          <DetailField label="Email"        value={customer.email || '—'} />
          <DetailField label="City / pincode" value={[customer.city, customer.pincode].filter(Boolean).join(' · ') || '—'} />
          <DetailField label="Address"      value={customer.address || '—'} />
          <DetailField label="Birthday"     value={customer.birthday ? fmtDate(customer.birthday) : '—'} />
          <DetailField label="Anniversary"  value={customer.anniversary ? fmtDate(customer.anniversary) : '—'} />
          <DetailField label="Language"     value={customer.language_pref === 'ta' ? 'Tamil' : 'English'} />
          <DetailField label="Source"       value={customer.source || '—'} />
          <DetailField label="Added"        value={fmtDateTime(customer.created_at)} />
          {customer.notes && (
            <div style={{ gridColumn: '1 / -1' }}>
              <DetailField label="Notes" value={customer.notes} />
            </div>
          )}
        </div>
      )}

      {tab === 'prefs' && (
        <div>
          {!prefDraft && (
            <button className="btn primary" style={{ marginBottom: 10 }}
              onClick={() => setPrefDraft({ category: 'silk', sub_category: '', color_notes: '', price_min: '', price_max: '', notes: '' })}>
              + Add preference
            </button>
          )}
          {prefDraft && (
            <div style={{
              background: 'var(--surfaceAlt)', padding: 12, borderRadius: 10,
              marginBottom: 10, border: '1px solid var(--border)',
            }}>
              <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <div>
                  <label>Category</label>
                  <select value={prefDraft.category || ''}
                    onChange={e => setPrefDraft({ ...prefDraft, category: e.target.value })}>
                    <option value="">—</option>
                    {PREF_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label>Sub-category</label>
                  <input value={prefDraft.sub_category || ''}
                    onChange={e => setPrefDraft({ ...prefDraft, sub_category: e.target.value })}
                    placeholder="e.g. Kanjivaram, Banarasi" />
                </div>
              </div>
              <div className="field-row">
                <label>Colour / pattern notes</label>
                <input value={prefDraft.color_notes || ''}
                  onChange={e => setPrefDraft({ ...prefDraft, color_notes: e.target.value })}
                  placeholder="e.g. prefers maroon + gold, dislikes pastels" />
              </div>
              <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                <div>
                  <label>Price min (₹)</label>
                  <input type="number" value={prefDraft.price_min}
                    onChange={e => setPrefDraft({ ...prefDraft, price_min: e.target.value })} />
                </div>
                <div>
                  <label>Price max (₹)</label>
                  <input type="number" value={prefDraft.price_max}
                    onChange={e => setPrefDraft({ ...prefDraft, price_max: e.target.value })} />
                </div>
              </div>
              <div className="field-row">
                <label>Notes</label>
                <textarea rows={2} value={prefDraft.notes || ''}
                  onChange={e => setPrefDraft({ ...prefDraft, notes: e.target.value })} />
              </div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                <button className="btn" onClick={() => setPrefDraft(null)}>Cancel</button>
                <button className="btn primary" onClick={savePref}>Save</button>
              </div>
            </div>
          )}
          {loading && <div style={{ color: 'var(--inkMuted)', fontSize: 13 }}>Loading…</div>}
          {!loading && prefs.length === 0 && !prefDraft && (
            <div style={{ color: 'var(--inkMuted)', fontSize: 13, padding: 20, textAlign: 'center' }}>
              No preferences captured yet.
            </div>
          )}
          {prefs.map(p => (
            <div key={p.id} style={{
              padding: 12, borderBottom: '1px solid var(--border)',
              display: 'flex', gap: 10, alignItems: 'flex-start',
            }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600, marginBottom: 2 }}>
                  {[p.category, p.sub_category].filter(Boolean).join(' · ') || 'Preference'}
                </div>
                {p.color_notes && <div style={{ fontSize: 13, color: 'var(--inkSoft)' }}>{p.color_notes}</div>}
                {(p.price_min != null || p.price_max != null) && (
                  <div style={{ fontSize: 12, color: 'var(--inkMuted)', marginTop: 2 }}>
                    ₹{p.price_min ?? '?'} – ₹{p.price_max ?? '?'}
                  </div>
                )}
                {p.notes && <div style={{ fontSize: 12, color: 'var(--inkMuted)', marginTop: 3 }}>{p.notes}</div>}
              </div>
              <div>
                <button className="btn" style={{ height: 26, padding: '0 8px', marginRight: 4, fontSize: 11 }}
                  onClick={() => setPrefDraft({ ...p, price_min: p.price_min ?? '', price_max: p.price_max ?? '' })}>Edit</button>
                <button className="btn danger" style={{ height: 26, padding: '0 8px', fontSize: 11 }}
                  onClick={() => delPref(p)}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'family' && (
        <div>
          {!famDraft && (
            <button className="btn primary" style={{ marginBottom: 10 }}
              onClick={() => setFamDraft({ name: '', relation: 'husband', age: '', notes: '' })}>
              + Add family member
            </button>
          )}
          {famDraft && (
            <div style={{
              background: 'var(--surfaceAlt)', padding: 12, borderRadius: 10,
              marginBottom: 10, border: '1px solid var(--border)',
            }}>
              <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 80px', gap: 10 }}>
                <div>
                  <label>Name *</label>
                  <input value={famDraft.name}
                    onChange={e => setFamDraft({ ...famDraft, name: e.target.value })} />
                </div>
                <div>
                  <label>Relation</label>
                  <select value={famDraft.relation || ''}
                    onChange={e => setFamDraft({ ...famDraft, relation: e.target.value })}>
                    {RELATIONS.map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                </div>
                <div>
                  <label>Age</label>
                  <input type="number" min="0" max="120" value={famDraft.age}
                    onChange={e => setFamDraft({ ...famDraft, age: e.target.value })} />
                </div>
              </div>
              <div className="field-row">
                <label>Notes</label>
                <input value={famDraft.notes || ''}
