                  onChange={e => setFamDraft({ ...famDraft, notes: e.target.value })}
                  placeholder="e.g. prefers kurtas, size L" />
              </div>
              <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
                <button className="btn" onClick={() => setFamDraft(null)}>Cancel</button>
                <button className="btn primary" onClick={saveFam}>Save</button>
              </div>
            </div>
          )}
          {loading && <div style={{ color: 'var(--inkMuted)', fontSize: 13 }}>Loading…</div>}
          {!loading && family.length === 0 && !famDraft && (
            <div style={{ color: 'var(--inkMuted)', fontSize: 13, padding: 20, textAlign: 'center' }}>
              No family members captured yet.
            </div>
          )}
          {family.map(m => (
            <div key={m.id} style={{
              padding: 12, borderBottom: '1px solid var(--border)',
              display: 'flex', gap: 10, alignItems: 'center',
            }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 600 }}>
                  {m.name}{' '}
                  {m.relation && <span style={{ fontWeight: 400, color: 'var(--inkMuted)' }}>· {m.relation}</span>}
                  {m.age != null && <span style={{ fontWeight: 400, color: 'var(--inkMuted)' }}>, {m.age} yrs</span>}
                </div>
                {m.notes && <div style={{ fontSize: 12.5, color: 'var(--inkSoft)', marginTop: 2 }}>{m.notes}</div>}
              </div>
              <div>
                <button className="btn" style={{ height: 26, padding: '0 8px', marginRight: 4, fontSize: 11 }}
                  onClick={() => setFamDraft({ ...m, age: m.age ?? '' })}>Edit</button>
                <button className="btn danger" style={{ height: 26, padding: '0 8px', fontSize: 11 }}
                  onClick={() => delFam(m)}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {tab === 'interactions' && (
        <div>
          {canEdit && (
            <button className="btn primary" style={{ marginBottom: 10 }}
              onClick={() => setInterDraft({
                _new: true, customer_id: customer.id,
                type: 'call-out',
                occurred_at: new Date().toISOString().slice(0, 16),
                duration_min: '', topic: 'follow-up',
                outcome: '', follow_up_date: '', follow_up_note: '', follow_up_done: false,
                notes: '',
              })}>
              + Log interaction
            </button>
          )}
          {loading && <div style={{ color: 'var(--inkMuted)', fontSize: 13 }}>Loading…</div>}
          {!loading && interactions.length === 0 && (
            <div style={{ color: 'var(--inkMuted)', fontSize: 13, padding: 20, textAlign: 'center' }}>
              No interactions yet.
            </div>
          )}
          {interactions.map(i => {
            const followDue = i.follow_up_date && !i.follow_up_done;
            const today = todayISO();
            const overdue = followDue && i.follow_up_date < today;
            return (
              <div key={i.id} style={{
                padding: 12, borderBottom: '1px solid var(--border)',
                display: 'flex', gap: 10, alignItems: 'flex-start',
              }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 3 }}>
                    <span className="status-pill" style={{ background: 'var(--surfaceAlt)', color: 'var(--inkSoft)', fontSize: 10 }}>
                      {INTERACTION_TYPES.find(t => t.id === i.type)?.label || i.type}
                    </span>
                    {i.topic && <span style={{ fontSize: 11.5, color: 'var(--inkMuted)' }}>· {i.topic}</span>}
                    {i.duration_min != null && i.duration_min > 0 && (
                      <span style={{ fontSize: 11.5, color: 'var(--inkMuted)' }}>· {i.duration_min} min</span>
                    )}
                    {followDue && (
                      <span className={`status-pill ${overdue ? 'absent' : 'late'}`} style={{ fontSize: 10 }}>
                        Follow-up {fmtDate(i.follow_up_date)}
                      </span>
                    )}
                    {i.follow_up_done && (
                      <span className="status-pill present" style={{ fontSize: 10 }}>✓ done</span>
                    )}
                  </div>
                  {i.outcome && <div style={{ fontSize: 13, fontWeight: 600 }}>{i.outcome}</div>}
                  {i.notes && <div style={{ fontSize: 12.5, color: 'var(--inkSoft)', marginTop: 2, whiteSpace: 'pre-wrap' }}>{i.notes}</div>}
                  <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 4 }}>
                    {fmtDateTime(i.occurred_at)}{i.logged_by_name ? ` · ${i.logged_by_name}` : ''}
                  </div>
                </div>
                {canEdit && (
                  <button className="btn" style={{ height: 26, padding: '0 8px', fontSize: 11 }}
                    onClick={() => setInterDraft({
                      ...i, _new: false,
                      occurred_at: i.occurred_at ? i.occurred_at.slice(0, 16) : '',
                      duration_min: i.duration_min ?? '',
                      follow_up_date: i.follow_up_date || '',
                      follow_up_note: i.follow_up_note || '',
                    })}>Edit</button>
                )}
              </div>
            );
          })}
        </div>
      )}

      {tab === 'muhurtham' && (
        <div>
          {canEdit && (
            <button className="btn primary" style={{ marginBottom: 10 }}
              onClick={() => setMuhDraft({
                _new: true, customer_id: customer.id,
                wedding_date: '', visit_date: '', visit_time: '',
                address: customer.address || '',
                budget_min: '', budget_max: '',
                color_theme: '', family_joining: '', special_requests: '',
                pre_visit_done: false, post_visit_done: false,
                post_visit_outcome: '', post_visit_notes: '',
                reminder_resolved: false, status: 'scheduled',
              })}>
              + Schedule Muhurtham
            </button>
          )}
          {loading && <div style={{ color: 'var(--inkMuted)', fontSize: 13 }}>Loading…</div>}
          {!loading && muhurthams.length === 0 && (
            <div style={{ color: 'var(--inkMuted)', fontSize: 13, padding: 20, textAlign: 'center' }}>
              No muhurtham visits yet.
            </div>
          )}
          {muhurthams.map(m => (
            <div key={m.id} style={{
              padding: 12, borderBottom: '1px solid var(--border)',
              display: 'flex', gap: 10, alignItems: 'flex-start',
            }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 3 }}>
                  <span className={`status-pill ${
                    m.status === 'completed' ? 'present'
                    : m.status === 'cancelled' ? 'absent'
                    : m.status === 'visited' ? 'late'
                    : m.status === 'pre-captured' ? 'leave'
                    : 'unmarked'
                  }`} style={{ fontSize: 10 }}>{m.status}</span>
                  <span className={`status-pill ${m.pre_visit_done ? 'present' : 'unmarked'}`} style={{ fontSize: 10 }}>
                    {m.pre_visit_done ? '✓ pre' : '○ pre'}
                  </span>
                  <span className={`status-pill ${m.post_visit_done ? 'present' : 'unmarked'}`} style={{ fontSize: 10 }}>
                    {m.post_visit_done ? '✓ post' : '○ post'}
                  </span>
                </div>
                <div style={{ fontSize: 13, fontWeight: 600 }}>
                  Visit {m.visit_date ? fmtDate(m.visit_date) : '—'}
                  {m.visit_time && <span style={{ fontWeight: 400, color: 'var(--inkMuted)' }}> · {m.visit_time}</span>}
                  {m.wedding_date && (
                    <span style={{ fontWeight: 400, color: 'var(--inkMuted)' }}>
                      {' '}· wedding {fmtDate(m.wedding_date)}
                    </span>
                  )}
                </div>
                {(m.budget_min != null || m.budget_max != null || m.color_theme) && (
                  <div style={{ fontSize: 12, color: 'var(--inkSoft)', marginTop: 3 }}>
                    {(m.budget_min != null || m.budget_max != null) &&
                      <>₹{m.budget_min ?? '?'}–{m.budget_max ?? '?'}</>}
                    {(m.budget_min != null || m.budget_max != null) && m.color_theme && ' · '}
                    {m.color_theme}
                  </div>
                )}
                {m.post_visit_outcome && (
                  <div style={{ fontSize: 12.5, color: 'var(--inkSoft)', marginTop: 4,
                    padding: 6, borderRadius: 6, background: 'var(--surfaceAlt)',
                  }}>
                    <strong>{MUHURTHAM_OUTCOMES.find(o => o.id === m.post_visit_outcome)?.label || m.post_visit_outcome}</strong>
                    {m.post_visit_notes && <> — {m.post_visit_notes}</>}
                  </div>
                )}
              </div>
              {canEdit && (
                <button className="btn" style={{ height: 26, padding: '0 8px', fontSize: 11 }}
                  onClick={() => setMuhDraft({
                    ...m, _new: false,
                    budget_min: m.budget_min ?? '',
                    budget_max: m.budget_max ?? '',
                    family_joining: m.family_joining ?? '',
                    visit_time: m.visit_time || '',
                    color_theme: m.color_theme || '',
                    special_requests: m.special_requests || '',
                    post_visit_outcome: m.post_visit_outcome || '',
                    post_visit_notes: m.post_visit_notes || '',
                  })}>Open</button>
              )}
            </div>
          ))}
        </div>
      )}

      <InteractionLogModal
        open={!!interDraft}
        draft={interDraft}
        customers={[]}
        onChange={setInterDraft}
        onClose={() => setInterDraft(null)}
        saving={interSaving}
        lockCustomer={true}
        onSave={async () => {
          if (!interDraft || interSaving) return;
          setInterSaving(true);
          try {
            const payload = {
              customer_id:    customer.id,
              type:           interDraft.type,
              occurred_at:    interDraft.occurred_at ? new Date(interDraft.occurred_at).toISOString() : new Date().toISOString(),
              duration_min:   interDraft.duration_min === '' ? null : Number(interDraft.duration_min),
              topic:          interDraft.topic || null,
              outcome:        (interDraft.outcome || '').trim() || null,
              follow_up_date: interDraft.follow_up_date || null,
              follow_up_note: (interDraft.follow_up_note || '').trim() || null,
              follow_up_done: !!interDraft.follow_up_done,
              notes:          (interDraft.notes || '').trim() || null,
            };
            if (interDraft._new) {
              payload.logged_by      = session?.employee_id || null;
              payload.logged_by_name = session?.display_name || 'CC';
              await window.sb.from('customer_interactions').insert(payload);
            } else {
              await window.sb.from('customer_interactions').update(payload).eq('id', interDraft.id);
            }
            setInterDraft(null);
          } finally { setInterSaving(false); }
        }}
      />

      <MuhurthamEditModal
        open={!!muhDraft}
        draft={muhDraft}
        customers={[]}
        onChange={setMuhDraft}
        onClose={() => setMuhDraft(null)}
        saving={muhSaving}
        lockCustomer={true}
        onSave={async () => {
          if (!muhDraft || muhSaving) return;
          setMuhSaving(true);
          try {
            const now = new Date().toISOString();
            const prev = muhurthams.find(x => x.id === muhDraft.id) || {};
            const payload = {
              customer_id:     customer.id,
              wedding_date:    muhDraft.wedding_date || null,
              visit_date:      muhDraft.visit_date || null,
              visit_time:      (muhDraft.visit_time || '').trim() || null,
              address:         (muhDraft.address || '').trim() || null,
              budget_min:      muhDraft.budget_min === '' ? null : Number(muhDraft.budget_min),
              budget_max:      muhDraft.budget_max === '' ? null : Number(muhDraft.budget_max),
              color_theme:     (muhDraft.color_theme || '').trim() || null,
              family_joining:  muhDraft.family_joining === '' ? null : Number(muhDraft.family_joining),
              special_requests:(muhDraft.special_requests || '').trim() || null,
              pre_visit_done:  !!muhDraft.pre_visit_done,
              post_visit_outcome: muhDraft.post_visit_outcome || null,
              post_visit_notes:(muhDraft.post_visit_notes || '').trim() || null,
              post_visit_done: !!muhDraft.post_visit_done,
              reminder_resolved: !!muhDraft.reminder_resolved,
              status:          muhDraft.status || 'scheduled',
            };
            if (payload.pre_visit_done && !prev.pre_visit_done) payload.pre_visit_done_at = now;
            if (!payload.pre_visit_done) payload.pre_visit_done_at = null;
            if (payload.post_visit_done && !prev.post_visit_done) payload.post_visit_done_at = now;
            if (!payload.post_visit_done) payload.post_visit_done_at = null;
            if (muhDraft._new) {
              payload.created_by = session?.employee_id || null;
              await window.sb.from('muhurtham_visits').insert(payload);
            } else {
              await window.sb.from('muhurtham_visits').update(payload).eq('id', muhDraft.id);
            }
            setMuhDraft(null);
          } finally { setMuhSaving(false); }
        }}
      />
    </Modal>
  );
};

// ──────────────────────────────────────────────────────────
// CRM — Interactions (call / store visit / home visit) log.
// Reusable InteractionLogModal is used both on this page and
// later on the Customer Detail sheet's Interactions tab.
// ──────────────────────────────────────────────────────────
const INTERACTION_TYPES = [
  { id: 'call-out',    label: 'Call (out)' },
  { id: 'call-in',     label: 'Call (in)' },
  { id: 'whatsapp',    label: 'WhatsApp' },
  { id: 'sms',         label: 'SMS' },
  { id: 'store-visit', label: 'Store visit' },
  { id: 'home-visit',  label: 'Home visit' },
  { id: 'other',       label: 'Other' },
];
const INTERACTION_TOPICS = [
  'greeting', 'follow-up', 'new-collection', 'offer',
  'appointment', 'complaint', 'feedback', 'muhurtham', 'other',
];

const InteractionsPage = () => {
  const toast = useToast();
  const { can, session } = useContext(AppCtx);

  const [rows, setRows]           = useState([]);
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading]     = useState(true);
  const [typeFilter, setTypeFilter] = useState('all');
  const [dueFilter, setDueFilter]   = useState('all');
  const [search, setSearch]       = useState('');
  const [editing, setEditing]     = useState(null);
  const [saving, setSaving]       = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [interRes, custRes] = await Promise.all([
      window.sb.from('customer_interactions')
        .select('*, customers(id, name, phone, city, is_vip, do_not_contact)')
        .order('occurred_at', { ascending: false })
        .limit(500),
      window.sb.from('customers').select('id, name, phone').order('name'),
    ]);
    setRows((interRes.data || []).filter(r => r.customers));
    setCustomers(custRes.data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-interactions')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'customer_interactions' },
        () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const today = todayISO();
  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return rows.filter(r => {
      if (typeFilter !== 'all' && r.type !== typeFilter) return false;
      if (dueFilter === 'due-today' && !(r.follow_up_date === today && !r.follow_up_done)) return false;
      if (dueFilter === 'overdue' && !(r.follow_up_date && r.follow_up_date < today && !r.follow_up_done)) return false;
      if (dueFilter === 'upcoming' && !(r.follow_up_date && r.follow_up_date > today && !r.follow_up_done)) return false;
      if (!matchesQuery(q, r.customers?.name, r.customers?.phone, r.topic, r.outcome, r.notes, r.logged_by_name)) return false;
      return true;
    });
  }, [rows, typeFilter, dueFilter, search, today]);

  const counts = useMemo(() => {
    const isToday = (d) => d && d === today;
    const isThisWeek = (ts) => {
      if (!ts) return false;
      const ms = Date.parse(ts);
      return ms >= Date.now() - 7 * 24 * 3600 * 1000;
    };
    return {
      total:    rows.length,
      today:    rows.filter(r => r.occurred_at && isToday(dateISO(r.occurred_at))).length,
      week:     rows.filter(r => isThisWeek(r.occurred_at)).length,
      dueToday: rows.filter(r => r.follow_up_date === today && !r.follow_up_done).length,
      overdue:  rows.filter(r => r.follow_up_date && r.follow_up_date < today && !r.follow_up_done).length,
    };
  }, [rows, today]);

  const blank = (customer_id = '') => ({
    id: null, _new: true,
    customer_id,
    type: 'call-out',
    occurred_at: new Date().toISOString().slice(0, 16), // YYYY-MM-DDTHH:MM for datetime-local
    duration_min: '',
    topic: 'follow-up',
    outcome: '',
    follow_up_date: '',
    follow_up_note: '',
    follow_up_done: false,
    notes: '',
  });

  const startNew = () => setEditing(blank());
  const startEdit = (row) => setEditing({
    ...row, _new: false,
    occurred_at: row.occurred_at ? row.occurred_at.slice(0, 16) : '',
    duration_min: row.duration_min ?? '',
    follow_up_date: row.follow_up_date || '',
    follow_up_note: row.follow_up_note || '',
  });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.customer_id) { toast('Pick a customer'); return; }
    if (!editing.type) { toast('Pick an interaction type'); return; }
    setSaving(true);
    try {
      const payload = {
        customer_id:    editing.customer_id,
        type:           editing.type,
        occurred_at:    editing.occurred_at ? new Date(editing.occurred_at).toISOString() : new Date().toISOString(),
        duration_min:   editing.duration_min === '' ? null : Number(editing.duration_min),
        topic:          editing.topic || null,
        outcome:        (editing.outcome || '').trim() || null,
        follow_up_date: editing.follow_up_date || null,
        follow_up_note: (editing.follow_up_note || '').trim() || null,
        follow_up_done: !!editing.follow_up_done,
        notes:          (editing.notes || '').trim() || null,
      };
      if (editing._new) {
        payload.logged_by = session?.employee_id || null;
        payload.logged_by_name = session?.display_name || 'CC';
        const { error } = await window.sb.from('customer_interactions').insert(payload);
        if (error) { toast('Could not save: ' + error.message); console.error(error); return; }
        toast('Interaction logged');
      } else {
        const { error } = await window.sb.from('customer_interactions').update(payload).eq('id', editing.id);
        if (error) { toast('Could not save: ' + error.message); console.error(error); return; }
        toast('Interaction updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const markDone = async (row) => {
    await window.sb.from('customer_interactions').update({ follow_up_done: true }).eq('id', row.id);
    toast('Follow-up marked done');
  };

  const del = async (row) => {
    if (!can('interactions', 'delete')) return;
    if (!window.confirm('Delete this interaction log?')) return;
    await window.sb.from('customer_interactions').delete().eq('id', row.id);
    toast('Deleted');
  };

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Today</div><div className="v">{counts.today}</div></div>
        <div className="stat present"><div className="k">This week</div><div className="v">{counts.week}</div></div>
        <div className="stat late"><div className="k">Follow-ups today</div><div className="v">{counts.dueToday}</div></div>
        <div className="stat absent"><div className="k">Overdue</div><div className="v">{counts.overdue}</div></div>
        <div className="stat"><div className="k">Total logged</div><div className="v">{counts.total}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'all',       label: 'All' },
            { id: 'due-today', label: `Due today · ${counts.dueToday}` },
            { id: 'overdue',   label: `Overdue · ${counts.overdue}` },
            { id: 'upcoming',  label: 'Upcoming' },
          ].map(s => (
            <button key={s.id} className={dueFilter === s.id ? 'active' : ''}
              onClick={() => setDueFilter(s.id)}>{s.label}</button>
          ))}
        </div>
        <select value={typeFilter} onChange={e => setTypeFilter(e.target.value)}
          style={{ height: 34 }}>
          <option value="all">All types</option>
          {INTERACTION_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
        </select>
        <input type="search" placeholder="Search customer, topic, outcome, CC…"
          value={search} onChange={e => setSearch(e.target.value)} />
        {can('interactions', 'create') && (
          <button className="btn primary" onClick={startNew} style={{ marginLeft: 'auto' }}>
            + Log interaction
          </button>
        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 150 }}>When</th>
              <th>Customer</th>
              <th style={{ width: 110 }}>Type</th>
              <th style={{ width: 120 }}>Topic</th>
              <th>Outcome / notes</th>
              <th style={{ width: 160 }}>Follow-up</th>
              <th style={{ width: 110 }}>Logged by</th>
              <th style={{ width: 140 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr>
                <td colSpan={8} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : rows.length === 0
                    ? 'No interactions logged yet. Click "+ Log interaction" to add the first.'
                    : 'No interactions match these filters.'}
                </td>
              </tr>
            )}
            {filtered.map(r => {
              const followDue = r.follow_up_date && !r.follow_up_done;
              const overdue   = followDue && r.follow_up_date < today;
              const today_    = followDue && r.follow_up_date === today;
              return (
                <tr key={r.id}>
                  <td className="muted" style={{ fontSize: 12 }}>{fmtDateTime(r.occurred_at)}</td>
                  <td className="name">
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span>{r.customers?.name || r.customer_id}</span>
                      {r.customers?.is_vip && <span className="status-pill late" style={{ fontSize: 10 }}>VIP</span>}
                      {r.customers?.do_not_contact && <span className="status-pill absent" style={{ fontSize: 10 }}>DNC</span>}
                    </div>
                    <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 2, fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
                      {r.customers?.phone || '—'}
                    </div>
                  </td>
                  <td>
                    <span className="status-pill" style={{
                      background: 'var(--surfaceAlt)', color: 'var(--inkSoft)', fontSize: 11,
                    }}>
                      {INTERACTION_TYPES.find(t => t.id === r.type)?.label || r.type}
                    </span>
                    {r.duration_min != null && r.duration_min > 0 && (
                      <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 2 }}>
                        {r.duration_min} min
                      </div>
                    )}
                  </td>
                  <td className="muted" style={{ fontSize: 12.5 }}>{r.topic || '—'}</td>
                  <td style={{ maxWidth: 320 }}>
                    {r.outcome && <div style={{ fontSize: 13 }}>{r.outcome}</div>}
                    {r.notes && <div style={{ fontSize: 12, color: 'var(--inkMuted)', marginTop: 2, whiteSpace: 'pre-wrap' }}>{r.notes}</div>}
                    {!r.outcome && !r.notes && <span className="muted">—</span>}
                  </td>
                  <td>
                    {!r.follow_up_date && <span className="muted">—</span>}
                    {r.follow_up_date && r.follow_up_done && (
                      <span className="status-pill present" style={{ fontSize: 10 }}>✓ done</span>
                    )}
                    {followDue && (
                      <>
                        <span className={`status-pill ${overdue ? 'absent' : today_ ? 'late' : 'leave'}`} style={{ fontSize: 10 }}>
                          {fmtDate(r.follow_up_date)}
                        </span>
                        {r.follow_up_note && <div style={{ fontSize: 11, color: 'var(--inkMuted)', marginTop: 3 }}>{r.follow_up_note}</div>}
                      </>
                    )}
                  </td>
                  <td className="muted" style={{ fontSize: 12 }}>{r.logged_by_name || '—'}</td>
                  <td>
                    {followDue && can('interactions', 'edit') && (
                      <button className="btn" style={{ height: 26, padding: '0 8px', marginRight: 4, fontSize: 11 }}
                        onClick={() => markDone(r)}>Mark done</button>
                    )}
                    {can('interactions', 'edit') && (
                      <button className="btn" style={{ height: 26, padding: '0 8px', marginRight: 4, fontSize: 11 }}
                        onClick={() => startEdit(r)}>Edit</button>
                    )}
                    {can('interactions', 'delete') && (
                      <button className="btn danger" style={{ height: 26, padding: '0 8px', fontSize: 11 }}
                        onClick={() => del(r)}>Delete</button>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <InteractionLogModal
        open={!!editing}
        draft={editing}
        customers={customers}
        onChange={setEditing}
        onClose={close}
        onSave={save}
        saving={saving}
      />
    </div>
  );
};

// Reusable log-interaction form. Customer picker is hidden when the
// caller passes lockCustomer (used later on the Customer Detail sheet).
const InteractionLogModal = ({ open, draft, customers, onChange, onClose, onSave, saving, lockCustomer = false }) => {
  if (!draft) return null;
  const setField = (k, v) => onChange({ ...draft, [k]: v });
  const isCall = draft.type === 'call-out' || draft.type === 'call-in';

  return (
    <Modal
      open={open}
      title={draft._new ? 'Log interaction' : 'Edit interaction'}
      onClose={onClose}
      footer={
        <>
          <button className="btn" onClick={onClose} disabled={saving}>Cancel</button>
          <button className="btn primary" onClick={onSave} disabled={saving}>
            {saving ? 'Saving…' : 'Save'}
          </button>
        </>
      }
    >
      {!lockCustomer && (
        <div className="field-row">
          <label>Customer *</label>
          <select value={draft.customer_id || ''}
            onChange={e => setField('customer_id', e.target.value)}>
            <option value="">— Pick a customer —</option>
            {customers.map(c => (
              <option key={c.id} value={c.id}>
                {c.name}{c.phone ? ` · ${c.phone}` : ''}
              </option>
            ))}
          </select>
        </div>
      )}

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <div>
          <label>Type</label>
          <select value={draft.type}
            onChange={e => setField('type', e.target.value)}>
            {INTERACTION_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
          </select>
        </div>
        <div>
          <label>Topic</label>
          <select value={draft.topic || ''}
            onChange={e => setField('topic', e.target.value)}>
            <option value="">—</option>
            {INTERACTION_TOPICS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: isCall ? '2fr 1fr' : '1fr', gap: 12 }}>
        <div>
          <label>When</label>
          <input type="datetime-local"
            value={draft.occurred_at || ''}
            onChange={e => setField('occurred_at', e.target.value)} />
        </div>
        {isCall && (
          <div>
            <label>Duration (min)</label>
            <input type="number" min="0" max="240"
              value={draft.duration_min}
              onChange={e => setField('duration_min', e.target.value)} />
          </div>
        )}
      </div>

      <div className="field-row">
        <label>Outcome (short)</label>
        <input value={draft.outcome || ''}
          onChange={e => setField('outcome', e.target.value)}
          placeholder='e.g. "Interested — will visit Saturday"' />
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 12 }}>
        <div>
          <label>Follow-up date</label>
          <input type="date" value={draft.follow_up_date || ''}
            onChange={e => setField('follow_up_date', e.target.value)} />
        </div>
        <div>
          <label>Follow-up note</label>
          <input value={draft.follow_up_note || ''}
            onChange={e => setField('follow_up_note', e.target.value)}
            placeholder='e.g. "Call to confirm saree selection"' />
        </div>
      </div>

      {!draft._new && (
        <label className="checkbox-row" style={{ cursor: 'pointer', marginBottom: 10 }}>
          <input type="checkbox" checked={!!draft.follow_up_done}
            onChange={e => setField('follow_up_done', e.target.checked)} />
          <div>
            <div className="label-text">Follow-up done</div>
            <div className="sub">Hides this row from the "Follow-ups today" filter.</div>
          </div>
        </label>
      )}

      <div className="field-row">
        <label>Detailed notes</label>
        <textarea rows={3} value={draft.notes || ''}
          onChange={e => setField('notes', e.target.value)}
          placeholder="Anything the next CC picking up this customer should know." />
      </div>
    </Modal>
  );
};

// ──────────────────────────────────────────────────────────
// CRM — Muhurtham home-visit pipeline.
// Cards rather than table because each visit carries a lot of
// context and CC staff glance-scan by visit-date + status.
// ──────────────────────────────────────────────────────────
const MUHURTHAM_OUTCOMES = [
  { id: 'ordered',           label: 'Ordered' },
  { id: 'deciding',          label: 'Deciding / thinking' },
  { id: 'wants-store-visit', label: 'Wants to visit store' },
  { id: 'not-interested',    label: 'Not interested' },
  { id: 'rescheduled',       label: 'Rescheduled' },
  { id: 'other',             label: 'Other' },
];

const MuhurthamPage = () => {
  const toast = useToast();
  const { can, session } = useContext(AppCtx);

  const [rows, setRows]           = useState([]);
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading]     = useState(true);
  const [bucket, setBucket]       = useState('upcoming'); // upcoming | today | week | followup | completed | cancelled | all
  const [search, setSearch]       = useState('');
  const [editing, setEditing]     = useState(null);
  const [saving, setSaving]       = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [mvRes, custRes] = await Promise.all([
      window.sb.from('muhurtham_visits')
        .select('*, customers(id, name, phone, city, is_vip)')
        .order('visit_date', { ascending: true, nullsFirst: false })
        .limit(500),
      window.sb.from('customers').select('id, name, phone').order('name'),
    ]);
    setRows((mvRes.data || []).filter(r => r.customers));
    setCustomers(custRes.data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-muhurtham')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'muhurtham_visits' },
        () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'customers' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const today = todayISO();
  const weekEnd = (() => {
    const d = new Date(today + 'T00:00:00');
    d.setDate(d.getDate() + 7);
    return dateISO(d);
  })();

  const counts = useMemo(() => ({
    total:     rows.length,
    today:     rows.filter(r => r.visit_date === today && r.status !== 'cancelled').length,
    week:      rows.filter(r => r.visit_date >= today && r.visit_date <= weekEnd && r.status !== 'cancelled').length,
    upcoming:  rows.filter(r => r.visit_date >= today && r.status !== 'cancelled' && r.status !== 'completed').length,
    followup:  rows.filter(r => r.reminder_due_on && r.reminder_due_on <= today && !r.reminder_resolved && r.status !== 'cancelled').length,
    completed: rows.filter(r => r.status === 'completed').length,
    cancelled: rows.filter(r => r.status === 'cancelled').length,
  }), [rows, today, weekEnd]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    return rows.filter(r => {
      if (bucket === 'today'     && !(r.visit_date === today && r.status !== 'cancelled')) return false;
      if (bucket === 'week'      && !(r.visit_date >= today && r.visit_date <= weekEnd && r.status !== 'cancelled')) return false;
      if (bucket === 'upcoming'  && !(r.visit_date >= today && r.status !== 'cancelled' && r.status !== 'completed')) return false;
      if (bucket === 'followup'  && !(r.reminder_due_on && r.reminder_due_on <= today && !r.reminder_resolved && r.status !== 'cancelled')) return false;
      if (bucket === 'completed' && r.status !== 'completed') return false;
      if (bucket === 'cancelled' && r.status !== 'cancelled') return false;
      if (!matchesQuery(q, r.customers?.name, r.customers?.phone, r.address, r.color_theme, r.post_visit_notes, r.special_requests)) return false;
      return true;
    });
  }, [rows, bucket, search, today, weekEnd]);

  const blank = (customer_id = '') => ({
    id: null, _new: true,
    customer_id,
    wedding_date: '', visit_date: '', visit_time: '',
    address: '', budget_min: '', budget_max: '',
    color_theme: '', family_joining: '', special_requests: '',
    pre_visit_done: false, post_visit_done: false,
    post_visit_outcome: '', post_visit_notes: '',
    reminder_resolved: false,
    status: 'scheduled',
  });

  const startNew = () => setEditing(blank());
  const startEdit = (row) => setEditing({
    ...row, _new: false,
    budget_min:      row.budget_min ?? '',
    budget_max:      row.budget_max ?? '',
    family_joining:  row.family_joining ?? '',
    visit_time:      row.visit_time || '',
    color_theme:     row.color_theme || '',
    special_requests: row.special_requests || '',
    post_visit_outcome: row.post_visit_outcome || '',
    post_visit_notes:   row.post_visit_notes || '',
  });
  const close = () => setEditing(null);

  const buildPayload = () => {
    const now = new Date().toISOString();
    const prev = rows.find(r => r.id === editing.id) || {};
    const payload = {
      customer_id:     editing.customer_id,
      wedding_date:    editing.wedding_date || null,
      visit_date:      editing.visit_date || null,
      visit_time:      (editing.visit_time || '').trim() || null,
      address:         (editing.address || '').trim() || null,
      budget_min:      editing.budget_min === '' ? null : Number(editing.budget_min),
      budget_max:      editing.budget_max === '' ? null : Number(editing.budget_max),
      color_theme:     (editing.color_theme || '').trim() || null,
      family_joining:  editing.family_joining === '' ? null : Number(editing.family_joining),
      special_requests:(editing.special_requests || '').trim() || null,
      pre_visit_done:  !!editing.pre_visit_done,
      post_visit_outcome: editing.post_visit_outcome || null,
      post_visit_notes:(editing.post_visit_notes || '').trim() || null,
      post_visit_done: !!editing.post_visit_done,
      reminder_resolved: !!editing.reminder_resolved,
      status:          editing.status || 'scheduled',
    };
    // Stamp the done-at fields only on transition, so completing a row
    // twice doesn't overwrite the original timestamp.
    if (payload.pre_visit_done && !prev.pre_visit_done) payload.pre_visit_done_at = now;
    if (!payload.pre_visit_done) payload.pre_visit_done_at = null;
    if (payload.post_visit_done && !prev.post_visit_done) payload.post_visit_done_at = now;
    if (!payload.post_visit_done) payload.post_visit_done_at = null;
    return payload;
  };

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.customer_id) { toast('Pick a customer'); return; }
    setSaving(true);
    try {
      const payload = buildPayload();
      if (editing._new) {
        payload.created_by = session?.employee_id || null;
        const { error } = await window.sb.from('muhurtham_visits').insert(payload);
        if (error) { toast('Could not save: ' + error.message); console.error(error); return; }
        toast('Muhurtham visit scheduled');
      } else {
        const { error } = await window.sb.from('muhurtham_visits').update(payload).eq('id', editing.id);
        if (error) { toast('Could not save: ' + error.message); console.error(error); return; }
        toast('Muhurtham visit updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const resolveReminder = async (row) => {
    await window.sb.from('muhurtham_visits').update({ reminder_resolved: true }).eq('id', row.id);
    toast('Reminder cleared');
  };

  const del = async (row) => {
    if (!can('muhurtham', 'delete')) return;
    if (!window.confirm(`Delete muhurtham visit for ${row.customers?.name}?`)) return;
    await window.sb.from('muhurtham_visits').delete().eq('id', row.id);
    toast('Deleted');
  };

  return (
    <div>
      <div className="stat-strip">
        <div className="stat late"><div className="k">Today</div><div className="v">{counts.today}</div></div>
        <div className="stat present"><div className="k">This week</div><div className="v">{counts.week}</div></div>
        <div className="stat absent"><div className="k">Follow-up due</div><div className="v">{counts.followup}</div></div>
        <div className="stat"><div className="k">Completed</div><div className="v">{counts.completed}</div></div>
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'upcoming',  label: `Upcoming · ${counts.upcoming}` },
            { id: 'today',     label: `Today · ${counts.today}` },
            { id: 'week',      label: `This week · ${counts.week}` },
            { id: 'followup',  label: `Follow-up · ${counts.followup}` },
            { id: 'completed', label: `Completed · ${counts.completed}` },
            { id: 'cancelled', label: `Cancelled · ${counts.cancelled}` },
            { id: 'all',       label: 'All' },
          ].map(s => (
            <button key={s.id} className={bucket === s.id ? 'active' : ''}
              onClick={() => setBucket(s.id)}>{s.label}</button>
          ))}
        </div>
        <input type="search" placeholder="Search customer, address, theme, notes…"
          value={search} onChange={e => setSearch(e.target.value)} />
        {can('muhurtham', 'create') && (
          <button className="btn primary" onClick={startNew} style={{ marginLeft: 'auto' }}>
            + Schedule Muhurtham
          </button>
        )}
      </div>

      {loading && (
        <div style={{ padding: 40, textAlign: 'center', color: 'var(--inkMuted)' }}>Loading…</div>
      )}

      {!loading && filtered.length === 0 && (
        <div style={{ padding: 40, textAlign: 'center', color: 'var(--inkMuted)' }}>
          {rows.length === 0
            ? 'No muhurtham visits yet. Click "+ Schedule Muhurtham" to add the first.'
            : 'No visits match this filter.'}
        </div>
      )}

      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))',
        gap: 14, marginTop: 6,
      }}>
        {filtered.map(r => {
          const overdue  = r.reminder_due_on && r.reminder_due_on < today && !r.reminder_resolved && r.status !== 'cancelled';
          const dueToday = r.reminder_due_on === today && !r.reminder_resolved && r.status !== 'cancelled';
          return (
            <div key={r.id} style={{
              background: 'var(--surface)', border: '1px solid var(--border)', borderRadius: 14,
              padding: 14, display: 'flex', flexDirection: 'column', gap: 10,
              opacity: r.status === 'cancelled' ? 0.55 : 1,
            }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: 'Fraunces, Georgia, serif', fontSize: 18, fontWeight: 500, letterSpacing: -0.3 }}>
                    {r.customers?.name || r.customer_id}
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--inkMuted)', marginTop: 2 }}>
                    {r.customers?.phone ? <span style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>{r.customers.phone}</span> : ''}
                    {r.customers?.phone && r.customers?.city ? ' · ' : ''}
                    {r.customers?.city || ''}
                  </div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'flex-end' }}>
                  <span className={`status-pill ${
                    r.status === 'completed' ? 'present'
                    : r.status === 'cancelled' ? 'absent'
                    : r.status === 'visited' ? 'late'
                    : r.status === 'pre-captured' ? 'leave'
                    : 'unmarked'
                  }`} style={{ fontSize: 10 }}>
                    {r.status}
                  </span>
                  {r.customers?.is_vip && <span className="status-pill late" style={{ fontSize: 10 }}>★ VIP</span>}
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, fontSize: 12 }}>
                <div>
                  <div style={{ fontSize: 10, letterSpacing: 0.4, textTransform: 'uppercase', color: 'var(--inkMuted)', fontWeight: 600 }}>Wedding</div>
                  <div style={{ fontWeight: 600 }}>{r.wedding_date ? fmtDate(r.wedding_date) : '—'}</div>
                </div>
                <div>
                  <div style={{ fontSize: 10, letterSpacing: 0.4, textTransform: 'uppercase', color: 'var(--inkMuted)', fontWeight: 600 }}>Visit</div>
                  <div style={{ fontWeight: 600 }}>
                    {r.visit_date ? fmtDate(r.visit_date) : '—'}
                    {r.visit_time && <span style={{ fontWeight: 400, color: 'var(--inkMuted)' }}> · {r.visit_time}</span>}
                  </div>
                </div>
              </div>

              {(r.budget_min != null || r.budget_max != null) && (
                <div style={{ fontSize: 12, color: 'var(--inkSoft)' }}>
                  <strong>Budget:</strong> ₹{r.budget_min ?? '?'} – ₹{r.budget_max ?? '?'}
                </div>
              )}
              {r.color_theme && (
                <div style={{ fontSize: 12, color: 'var(--inkSoft)' }}>
                  <strong>Theme:</strong> {r.color_theme}
                </div>
              )}

              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                <span className={`status-pill ${r.pre_visit_done ? 'present' : 'unmarked'}`} style={{ fontSize: 10 }}>
                  {r.pre_visit_done ? '✓ Pre-visit' : '○ Pre-visit'}
                </span>
                <span className={`status-pill ${r.post_visit_done ? 'present' : 'unmarked'}`} style={{ fontSize: 10 }}>
                  {r.post_visit_done ? '✓ Post-visit' : '○ Post-visit'}
                </span>
                {(overdue || dueToday) && (
                  <span className={`status-pill ${overdue ? 'absent' : 'late'}`} style={{ fontSize: 10 }}>
                    {overdue ? 'Follow-up overdue' : 'Follow-up today'}
                  </span>
                )}
              </div>

              {r.post_visit_outcome && (
                <div style={{ fontSize: 12.5, color: 'var(--inkSoft)',
                  padding: 8, borderRadius: 8, background: 'var(--surfaceAlt)',
                }}>
                  <strong>{MUHURTHAM_OUTCOMES.find(o => o.id === r.post_visit_outcome)?.label || r.post_visit_outcome}</strong>
                  {r.post_visit_notes && <div style={{ marginTop: 3 }}>{r.post_visit_notes}</div>}
                </div>
              )}

              <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {can('muhurtham', 'edit') && (
                  <button className="btn" style={{ height: 28, padding: '0 10px', fontSize: 12 }}
                    onClick={() => startEdit(r)}>Open</button>
                )}
                {(overdue || dueToday) && can('muhurtham', 'edit') && (
                  <button className="btn" style={{ height: 28, padding: '0 10px', fontSize: 12 }}
                    onClick={() => resolveReminder(r)}>Clear reminder</button>
                )}
                {can('muhurtham', 'delete') && (
                  <button className="btn danger" style={{ height: 28, padding: '0 10px', fontSize: 12, marginLeft: 'auto' }}
                    onClick={() => del(r)}>Delete</button>
                )}
              </div>
            </div>
          );
        })}
      </div>

      <MuhurthamEditModal
        open={!!editing}
        draft={editing}
        customers={customers}
        onChange={setEditing}
        onClose={close}
        onSave={save}
        saving={saving}
      />
    </div>
  );
};

// Reusable schedule / pre-visit / post-visit form. Customer picker
// hidden when caller sets lockCustomer (used later on the Customer
// Detail sheet's Muhurtham tab).
const MuhurthamEditModal = ({ open, draft, customers, onChange, onClose, onSave, saving, lockCustomer = false }) => {
  if (!draft) return null;
  const set = (k, v) => onChange({ ...draft, [k]: v });
  return (
    <Modal
      open={open}
      title={draft._new ? 'Schedule Muhurtham visit' : 'Edit Muhurtham visit'}
      onClose={onClose}
      footer={
        <>
          <button className="btn" onClick={onClose} disabled={saving}>Cancel</button>
          <button className="btn primary" onClick={onSave} disabled={saving}>
            {saving ? 'Saving…' : draft._new ? 'Schedule' : 'Save'}
          </button>
        </>
      }
    >
      {!lockCustomer && (
        <div className="field-row">
          <label>Customer *</label>
          <select value={draft.customer_id || ''}
            onChange={e => set('customer_id', e.target.value)}>
            <option value="">— Pick a customer —</option>
            {customers.map(c => (
              <option key={c.id} value={c.id}>
                {c.name}{c.phone ? ` · ${c.phone}` : ''}
              </option>
            ))}
          </select>
        </div>
      )}

      <div style={{
        fontSize: 11, letterSpacing: 0.5, textTransform: 'uppercase',
        color: 'var(--inkMuted)', fontWeight: 700, marginTop: 6, marginBottom: 6,
      }}>Schedule</div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
        <div>
          <label>Wedding date</label>
          <input type="date" value={draft.wedding_date || ''}
            onChange={e => set('wedding_date', e.target.value)} />
        </div>
        <div>
          <label>Visit date</label>
          <input type="date" value={draft.visit_date || ''}
            onChange={e => set('visit_date', e.target.value)} />
        </div>
        <div>
          <label>Visit time</label>
          <input value={draft.visit_time || ''}
            onChange={e => set('visit_time', e.target.value)}
            placeholder="10:30 AM" />
        </div>
      </div>

      <div className="field-row">
        <label>Address (home)</label>
        <textarea rows={2} value={draft.address || ''}
          onChange={e => set('address', e.target.value)}
          placeholder="House / street / landmark" />
      </div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
        <div>
          <label>Status</label>
          <select value={draft.status || 'scheduled'}
            onChange={e => set('status', e.target.value)}>
            <option value="scheduled">scheduled</option>
            <option value="pre-captured">pre-captured</option>
            <option value="visited">visited</option>
            <option value="completed">completed</option>
            <option value="cancelled">cancelled</option>
          </select>
        </div>
        <label className="checkbox-row" style={{ cursor: 'pointer', alignSelf: 'end' }}>
          <input type="checkbox" checked={!!draft.reminder_resolved}
            onChange={e => set('reminder_resolved', e.target.checked)} />
          <div>
            <div className="label-text">Reminder cleared</div>
            <div className="sub">Removes this row from "Follow-up due".</div>
          </div>
        </label>
      </div>

      <div style={{
        fontSize: 11, letterSpacing: 0.5, textTransform: 'uppercase',
        color: 'var(--inkMuted)', fontWeight: 700, marginTop: 14, marginBottom: 6,
      }}>Pre-visit preferences</div>

      <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10 }}>
        <div>
          <label>Budget min (₹)</label>
          <input type="number" value={draft.budget_min}
            onChange={e => set('budget_min', e.target.value)} />
        </div>
        <div>
          <label>Budget max (₹)</label>
          <input type="number" value={draft.budget_max}
            onChange={e => set('budget_max', e.target.value)} />
        </div>
        <div>
          <label>Family joining</label>
          <input type="number" min="0" max="99" value={draft.family_joining}
            onChange={e => set('family_joining', e.target.value)} />
        </div>
      </div>

      <div className="field-row">
        <label>Colour theme</label>
        <input value={draft.color_theme || ''}
          onChange={e => set('color_theme', e.target.value)}
          placeholder="e.g. maroon + gold, peacock green" />
      </div>

      <div className="field-row">
        <label>Special requests</label>
        <textarea rows={2} value={draft.special_requests || ''}
          onChange={e => set('special_requests', e.target.value)}
          placeholder="Tailoring, blouse stitching, groom dhotis, kid dresses etc." />
      </div>

      <label className="checkbox-row" style={{ cursor: 'pointer', marginBottom: 10 }}>
        <input type="checkbox" checked={!!draft.pre_visit_done}
          onChange={e => set('pre_visit_done', e.target.checked)} />
        <div>
          <div className="label-text">Pre-visit preferences captured</div>
          <div className="sub">Stamps the time so the stylist knows it's ready before leaving.</div>
        </div>
      </label>

      <div style={{
        fontSize: 11, letterSpacing: 0.5, textTransform: 'uppercase',
        color: 'var(--inkMuted)', fontWeight: 700, marginTop: 14, marginBottom: 6,
      }}>Post-visit outcome</div>

      <div className="field-row">
        <label>Outcome</label>
        <select value={draft.post_visit_outcome || ''}
          onChange={e => set('post_visit_outcome', e.target.value)}>
          <option value="">—</option>
          {MUHURTHAM_OUTCOMES.map(o => <option key={o.id} value={o.id}>{o.label}</option>)}
        </select>
      </div>

      <div className="field-row">
        <label>Post-visit notes</label>
        <textarea rows={3} value={draft.post_visit_notes || ''}
          onChange={e => set('post_visit_notes', e.target.value)}
          placeholder="What they liked, what they asked for, next action…" />
      </div>

      <label className="checkbox-row" style={{ cursor: 'pointer' }}>
        <input type="checkbox" checked={!!draft.post_visit_done}
          onChange={e => set('post_visit_done', e.target.checked)} />
        <div>
          <div className="label-text">Post-visit captured</div>
          <div className="sub">Once ticked, the 2-day reminder is the next action.</div>
        </div>
      </label>
    </Modal>
  );
};

// Root
// ──────────────────────────────────────────────────────────
// ──────────────────────────────────────────────────────────
// Error boundary — keeps the app shell rendered even when one
// page throws (e.g. a SELECT against a missing table without
// optional chaining). The fallback shows the error message and
// a Reload button so the user is never stuck on a blank screen.
// ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error('Dashboard render error:', error, info);
  }
  render() {
    if (this.state.error) {
      const msg = (this.state.error && (this.state.error.message || String(this.state.error))) || 'Unknown error';
      return (
        <div style={{
          padding: 28, maxWidth: 640, margin: '40px auto',
          background: '#fff', border: '1px solid #f3d6c1', borderRadius: 16,
          fontFamily: 'system-ui, -apple-system, sans-serif',
        }}>
          <div style={{
            fontFamily: 'Fraunces, Georgia, serif', fontSize: 22,
            color: '#8B2323', marginBottom: 8,
          }}>Something went wrong</div>
          <div style={{ fontSize: 13.5, color: '#4a3232', marginBottom: 14 }}>
            The dashboard hit an error and stopped rendering this view.
            You can reload to try again. If it keeps happening, the most
            likely cause is a pending database migration that hasn't run
            yet — let your developer know.
          </div>
          <pre style={{
            background: '#fbf1ea', border: '1px solid #f3d6c1', borderRadius: 8,
            padding: 10, fontSize: 11.5, color: '#4a3232',
            whiteSpace: 'pre-wrap', wordBreak: 'break-word',
            marginBottom: 14, maxHeight: 200, overflow: 'auto',
          }}>{msg}</pre>
          <button onClick={() => window.location.reload()} style={{
            padding: '10px 18px', background: '#8B2323', color: '#fff',
            border: 'none', borderRadius: 10, fontWeight: 600, cursor: 'pointer',
          }}>Reload dashboard</button>
        </div>
      );
    }
    return this.props.children;
  }
}

const Root = () => {
  const [unlocked, setUnlocked] = useState(() => !!loadSession());
  if (!unlocked) return <Gate onPass={() => setUnlocked(true)} />;
  return <ToastHost><App /></ToastHost>;
};

const mount = async (attempts = 0) => {
  if (window.React && window.ReactDOM && window.supabase) {
    // Preload sections so the first render already knows every section's
    // name, not just the four hardcoded ones.
    try { await refreshSectionMeta(); } catch (_) {}
    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><Root /></ErrorBoundary>);
    // Keep the map fresh when the Owner adds / renames / reorders a section.
    if (window.sb) {
      window.sb.channel('global-sections')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'sections' },
          () => refreshSectionMeta())
        .subscribe();
    }
  } else if (attempts < 100) {
    setTimeout(() => mount(attempts + 1), 30);
  }
};
mount();
</script>
</body>
</html>
