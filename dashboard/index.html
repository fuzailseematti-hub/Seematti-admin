  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(new Set());

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('leave_requests')
      .select('id, employee_id, type, days, from_date, reason, status, decided_by, decided_at, created_at, employees(name, role, section_id)')
      .order('created_at', { ascending: false });
    setItems(data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-leaves')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'leave_requests' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return items.filter(r => {
      if (statusFilter !== 'all' && r.status !== statusFilter) return false;
      if (!matchesQuery(q, r.employees?.name, r.employee_id, r.reason, r.employees?.employee_code)) return false;
      return true;
    });
  }, [items, statusFilter, search]);

  const counts = useMemo(() => ({
    total:    items.length,
    pending:  items.filter(i => i.status === 'pending').length,
    approved: items.filter(i => i.status === 'approved').length,
    rejected: items.filter(i => i.status === 'rejected').length,
    totalDays:items.filter(i => i.status === 'approved').reduce((sum, i) => sum + (i.days || 0), 0),
  }), [items]);

  useEffect(() => { setSelected(new Set()); }, [statusFilter, search]);

  // Use the actual logged-in user's employee_id for the audit trail.
  // Bootstrap Owner sessions have no employee_id, so fall back to the
  // legacy placeholder so the column is never null.
  const deciderId = session?.employee_id || (role === 'owner' ? 'E000' : 'E001');

  const decide = async (id, action) => {
    if (!can('leaves', 'edit')) return;
    await window.sb.from('leave_requests')
      .update({ status: action, decided_by: deciderId, decided_at: new Date().toISOString() })
      .eq('id', id);
  };
  const del = async (id) => {
    if (!can('leaves', 'delete')) return;
    await window.sb.from('leave_requests').delete().eq('id', id);
  };

  const bulkDecide = async (action) => {
    if (!can('leaves', 'edit')) return;
    const ids = Array.from(selected);
    if (!ids.length) return;
    await window.sb.from('leave_requests')
      .update({ status: action, decided_by: deciderId, decided_at: new Date().toISOString() })
      .in('id', ids);
    toast(`${ids.length} leave request${ids.length === 1 ? '' : 's'} ${action}`);
    setSelected(new Set());
  };
  const bulkDelete = async () => {
    if (!can('leaves', 'delete')) return;
    const ids = Array.from(selected);
    if (!ids.length) return;
    if (!window.confirm(`Delete ${ids.length} leave request${ids.length === 1 ? '' : 's'}? This cannot be undone.`)) return;
    await window.sb.from('leave_requests').delete().in('id', ids);
    toast(`${ids.length} deleted`);
    setSelected(new Set());
  };

  const toggleRow = (id) => setSelected(s => {
    const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n;
  });
  const toggleAll = () => setSelected(s =>
    s.size === rows.length ? new Set() : new Set(rows.map(r => r.id)));

  const decidedByName = (id) => {
    if (!id) return '—';
    if (id === 'E000') return 'Owner';
    if (id === 'E001') return 'HR';
    if (session?.employee_id === id && session?.display_name) return session.display_name;
    return id;
  };

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
        <div className="stat late"><div className="k">Pending</div><div className="v">{counts.pending}</div></div>
        <div className="stat present"><div className="k">Approved</div><div className="v">{counts.approved}</div></div>
        <div className="stat absent"><div className="k">Rejected</div><div className="v">{counts.rejected}</div></div>
        <div className="stat leave"><div className="k">Days granted</div><div className="v">{counts.totalDays}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'pending',  label: `Pending · ${counts.pending}` },
            { id: 'approved', label: `Approved · ${counts.approved}` },
            { id: 'rejected', label: `Rejected · ${counts.rejected}` },
            { id: 'all',      label: `All · ${counts.total}` },
          ].map(s => (
            <button key={s.id}
              className={statusFilter === s.id ? 'active' : ''}
              onClick={() => setStatusFilter(s.id)}>
              {s.label}
            </button>
          ))}
        </div>
        <input type="search" placeholder="Search name, ID, or reason…"
          value={search} onChange={e => setSearch(e.target.value)} />
        <div style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--inkMuted)' }}>
          {loading ? 'Loading…' : `Showing ${rows.length}`}
        </div>
      </div>

      {selected.size > 0 && can('leaves', 'edit') && (
        <div className="bulk">
          <span>{selected.size} selected</span>
          <button className="btn" onClick={() => bulkDecide('approved')}>Approve all</button>
          <button className="btn" onClick={() => bulkDecide('rejected')}>Reject all</button>
          {can('leaves', 'delete') && (
            <button className="btn" onClick={bulkDelete}>Delete</button>
          )}
          <button className="btn" onClick={() => setSelected(new Set())} style={{ marginLeft: 'auto' }}>
            Deselect
          </button>
        </div>
      )}

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 36 }}>
                <input type="checkbox"
                  checked={rows.length > 0 && selected.size === rows.length}
                  onChange={toggleAll} />
              </th>
              <th style={{ width: 80 }}>ID</th>
              <th>Employee</th>
              <th>Section</th>
              <th>Type</th>
              <th style={{ width: 70 }}>Days</th>
              <th>From</th>
              <th>Reason</th>
              <th style={{ width: 100 }}>Status</th>
              <th style={{ width: 130 }}>Decided</th>
              <th style={{ width: 200 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={11} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No leave requests match.'}
                </td>
              </tr>
            )}
            {rows.map(r => (
              <tr key={r.id} className={selected.has(r.id) ? 'selected' : ''}>
                <td>
                  <input type="checkbox"
                    checked={selected.has(r.id)}
                    onChange={() => toggleRow(r.id)} />
                </td>
                <td className="id">{r.employee_id}</td>
                <td className="name">
                  {r.employees?.name || r.employee_id}
                  <div style={{ fontSize: 11, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 2 }}>
                    {r.employees?.role || ''}
                  </div>
                </td>
                <td>{SECTION_META[r.employees?.section_id]?.label || <span className="muted">—</span>}</td>
                <td>{r.type}</td>
                <td>{r.days}</td>
                <td className="muted">{fmtDate(r.from_date)}</td>
                <td style={{ maxWidth: 280 }}>
                  <div style={{
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                  }} title={r.reason}>{r.reason || '—'}</div>
                </td>
                <td>
                  <span className={`status-pill ${r.status === 'pending' ? 'late' : r.status === 'approved' ? 'present' : 'absent'}`}>
                    {r.status}
                  </span>
                </td>
                <td className="muted" style={{ fontSize: 11 }}>
                  {r.decided_at
                    ? <>{decidedByName(r.decided_by)}<br/>{fmtDateTime(r.decided_at)}</>
                    : '—'}
                </td>
                <td>
                  {r.status === 'pending' && can('leaves', 'edit') && (
                    <>
                      <button className="btn primary" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                        onClick={() => decide(r.id, 'approved')}>Approve</button>
                      <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                        onClick={() => decide(r.id, 'rejected')}>Reject</button>
                    </>
                  )}
                  {r.status !== 'pending' && can('leaves', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => decide(r.id, 'pending')}>Re-open</button>
                  )}
                  {can('leaves', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => {
                        if (!window.confirm('Delete this leave request?')) return;
                        del(r.id);
                      }}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Simple modal primitive (used by Announcements and later CRUD modules)
// ──────────────────────────────────────────────────────────
const Modal = ({ open, title, onClose, children, footer }) => {
  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Searchable employee picker. Drop-in replacement for a <select>
// that expects an employee id as its value. Searches across name,
// id, employee_code, role, section, company, phone and city.
// ──────────────────────────────────────────────────────────
const EmployeePicker = ({
  employees,
  value,
  onChange,
  placeholder = 'Search by name, code, ID, role…',
  allowClear = false,
  clearLabel = 'All',
  disabled = false,
  autoFocus = false,
  extraLabel,
}) => {
  const [query, setQuery] = useState('');
  const [open, setOpen] = useState(false);
  const [activeIdx, setActiveIdx] = useState(0);
  const wrapRef = useRef(null);
  const inputRef = useRef(null);

  const selected = useMemo(
    () => (employees || []).find(e => e.id === value) || null,
    [employees, value]
  );

  const matches = useMemo(() => {
    const list = employees || [];
    if (!query.trim()) return list.slice(0, 80);
    return list.filter(e =>
      matchesQuery(query, e.name, e.id, e.employee_code, e.role, e.company, e.phone, e.city, e.section_id)
    ).slice(0, 80);
  }, [employees, query]);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    window.addEventListener('mousedown', handler);
    return () => window.removeEventListener('mousedown', handler);
  }, [open]);

  useEffect(() => { setActiveIdx(0); }, [query, open]);

  const pick = (emp) => {
    onChange(emp ? emp.id : '');
    setQuery('');
    setOpen(false);
    inputRef.current?.blur();
  };

  const displayValue = open
    ? query
    : (selected
        ? `${selected.name || '(unnamed)'} · ${selected.id}${selected.employee_code ? ` · ${selected.employee_code}` : ''}`
        : '');

  const onKeyDown = (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setOpen(true);
      setActiveIdx(i => Math.min(i + 1, matches.length - 1));
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActiveIdx(i => Math.max(i - 1, 0));
    } else if (e.key === 'Enter') {
      if (open && matches[activeIdx]) { e.preventDefault(); pick(matches[activeIdx]); }
    } else if (e.key === 'Escape') {
      setOpen(false); setQuery(''); inputRef.current?.blur();
    }
  };

  return (
    <div ref={wrapRef} className="emp-picker">
      <input
        ref={inputRef}
        type="search"
        autoFocus={autoFocus}
        disabled={disabled}
        placeholder={placeholder}
        value={displayValue}
        onChange={e => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onKeyDown={onKeyDown}
      />
      {open && (
        <div className="emp-picker-list">
          {allowClear && (
            <div
              className="emp-picker-row"
              onMouseDown={(e) => { e.preventDefault(); pick(null); }}
            >
              <div className="emp-picker-name" style={{ color: 'var(--inkMuted)' }}>{clearLabel}</div>
            </div>
          )}
          {matches.length === 0 && (
            <div className="emp-picker-empty">No match</div>
          )}
          {matches.map((emp, i) => (
            <div
              key={emp.id}
              className={'emp-picker-row' + (i === activeIdx ? ' active' : '')}
              onMouseEnter={() => setActiveIdx(i)}
              onMouseDown={(e) => { e.preventDefault(); pick(emp); }}
            >
              <div className="emp-picker-name">{emp.name || '(unnamed)'}</div>
              <div className="emp-picker-meta">
                {emp.employee_code ? emp.employee_code + ' · ' : ''}{emp.id}
                {emp.role ? ' · ' + emp.role : ''}
                {extraLabel ? ' · ' + extraLabel(emp) : ''}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Announcements management — list, create, edit, pin, delete.
// ──────────────────────────────────────────────────────────
const AnnouncementsPage = () => {
  const toast = useToast();
  const { can, role } = useContext(AppCtx);

  const [items, setItems] = useState([]);
  const [readStats, setReadStats] = useState({}); // announcement_id -> { reads, acks }
  const [activeStaffCount, setActiveStaffCount] = useState(0);
  const [loading, setLoading] = useState(true);
  const [pinFilter, setPinFilter] = useState('all');
  const [search, setSearch] = useState('');

  const [editing, setEditing] = useState(null); // null | 'new' | row

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [annRes, readsRes, staffRes] = await Promise.all([
      window.sb.from('announcements').select('*')
        .order('pinned', { ascending: false })
        .order('created_at', { ascending: false }),
      window.sb.from('announcement_reads').select('announcement_id, acknowledged'),
      window.sb.from('employees').select('*', { count: 'exact', head: true })
        .eq('is_active', true),
    ]);
    const stats = {};
    (readsRes.data || []).forEach(r => {
      if (!stats[r.announcement_id]) stats[r.announcement_id] = { reads: 0, acks: 0 };
      stats[r.announcement_id].reads += 1;
      if (r.acknowledged) stats[r.announcement_id].acks += 1;
    });
    setItems(annRes.data || []);
    setReadStats(stats);
    setActiveStaffCount(staffRes.count || 0);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-announcements')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' },
        () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'announcement_reads' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return items.filter(a => {
      if (pinFilter === 'pinned' && !a.pinned) return false;
      if (pinFilter === 'unpinned' && a.pinned) return false;
      if (!matchesQuery(q, a.title, a.body, a.posted_by)) return false;
      return true;
    });
  }, [items, pinFilter, search]);

  const counts = useMemo(() => {
    const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    return {
      total:  items.length,
      pinned: items.filter(i => i.pinned).length,
      week:   items.filter(i => new Date(i.created_at).getTime() > weekAgo).length,
    };
  }, [items]);

  const togglePin = async (row) => {
    if (!can('announcements', 'edit')) return;
    await window.sb.from('announcements')
      .update({ pinned: !row.pinned }).eq('id', row.id);
  };
  const del = async (id) => {
    if (!can('announcements', 'delete')) return;
    if (!window.confirm('Delete this announcement?')) return;
    await window.sb.from('announcements').delete().eq('id', id);
    toast('Deleted');
  };

  const startNew = () => setEditing({
    id: null, title: '', body: '',
    posted_by: role === 'owner' ? 'Owner' : role === 'admin' ? 'Admin' : 'HR',
    pinned: false,
  });
  const startEdit = (row) => setEditing({ ...row });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing) return;
    const payload = {
      title: (editing.title || '').trim(),
      body:  (editing.body || '').trim() || null,
      posted_by: editing.posted_by || 'HR',
      pinned: !!editing.pinned,
    };
    if (!payload.title) { toast('Title is required'); return; }
    if (editing.id) {
      await window.sb.from('announcements').update(payload).eq('id', editing.id);
      toast('Updated');
    } else {
      await window.sb.from('announcements').insert(payload);
      toast('Posted');
    }
    close();
  };

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
        <div className="stat late"><div className="k">Pinned</div><div className="v">{counts.pinned}</div></div>
        <div className="stat present"><div className="k">This week</div><div className="v">{counts.week}</div></div>
        <div className="stat"><div className="k">Authors</div><div className="v">{new Set(items.map(i => i.posted_by)).size}</div></div>
        <div className="stat leave"><div className="k">Showing</div><div className="v">{rows.length}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'all',      label: `All · ${counts.total}` },
            { id: 'pinned',   label: `Pinned · ${counts.pinned}` },
            { id: 'unpinned', label: `Unpinned · ${counts.total - counts.pinned}` },
          ].map(s => (
            <button key={s.id}
              className={pinFilter === s.id ? 'active' : ''}
              onClick={() => setPinFilter(s.id)}>
              {s.label}
            </button>
          ))}
        </div>
        <input type="search" placeholder="Search title, body, or author…"
          value={search} onChange={e => setSearch(e.target.value)} />
        {can('announcements', 'create') && (
          <button className="btn primary" onClick={startNew}
            style={{ marginLeft: 'auto' }}>
            + New announcement
          </button>
        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 70 }}>Pin</th>
              <th>Title</th>
              <th style={{ width: 120 }}>Posted by</th>
              <th style={{ width: 180 }}>Posted</th>
              <th style={{ width: 150 }}>Seen / Ack</th>
              <th style={{ width: 200 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={6} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No announcements.'}
                </td>
              </tr>
            )}
            {rows.map(row => (
              <tr key={row.id}>
                <td>
                  <button
                    className="btn"
                    disabled={!can('announcements', 'edit')}
                    onClick={() => togglePin(row)}
                    style={{
                      height: 28, padding: '0 10px',
                      background: row.pinned ? 'var(--goldSoft)' : 'var(--surfaceAlt)',
                      borderColor: row.pinned ? 'var(--goldSoft)' : 'var(--border)',
                      color: row.pinned ? 'var(--gold)' : 'var(--inkMuted)',
                    }}
                    title={row.pinned ? 'Unpin' : 'Pin to top'}>
                    {row.pinned ? '★ Pinned' : '☆ Pin'}
                  </button>
                </td>
                <td className="name">
                  {row.title}
                  {row.body && (
                    <div style={{ fontSize: 12, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 3, maxWidth: 540, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {row.body}
                    </div>
                  )}
                </td>
                <td>
                  <span className="status-pill" style={{
                    background: row.posted_by === 'Owner' ? 'var(--brandSoft)' : 'var(--infoSoft)',
                    color:      row.posted_by === 'Owner' ? 'var(--brand)' : 'var(--info)',
                  }}>{row.posted_by}</span>
                </td>
                <td className="muted" style={{ fontSize: 12 }}>
                  {fmtDateTime(row.created_at)}
                </td>
                <td style={{ fontSize: 12 }}>
                  {(() => {
                    const s = readStats[row.id] || { reads: 0, acks: 0 };
                    const denom = activeStaffCount || '—';
                    const pct = activeStaffCount ? Math.round((s.reads / activeStaffCount) * 100) : 0;
                    const tone = pct >= 90 ? 'present' : pct >= 60 ? 'late' : 'unmarked';
                    return (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                        <span className={`status-pill ${tone}`} style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
                          {s.reads} / {denom} seen
                        </span>
                        <span style={{ color: 'var(--inkMuted)', fontSize: 11 }}>
                          {s.acks} acknowledged
                        </span>
                      </div>
                    );
                  })()}
                </td>
                <td>
                  {can('announcements', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(row)}>Edit</button>
                  )}
                  {can('announcements', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => del(row.id)}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <Modal
        open={!!editing}
        title={editing?.id ? 'Edit announcement' : 'New announcement'}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close}>Cancel</button>
            <button className="btn primary" onClick={save}>
              {editing?.id ? 'Save changes' : 'Post announcement'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row">
              <label>Title</label>
              <input
                autoFocus
                value={editing.title}
                onChange={e => setEditing({ ...editing, title: e.target.value })}
                placeholder="e.g. Tamil New Year holiday — 14 April, showroom closed"
              />
            </div>
            <div className="field-row">
              <label>Body (optional)</label>
              <textarea
                value={editing.body || ''}
                onChange={e => setEditing({ ...editing, body: e.target.value })}
                placeholder="Longer details, instructions, what staff should do…"
              />
            </div>
            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Posted by</label>
                <select
                  value={editing.posted_by}
                  onChange={e => setEditing({ ...editing, posted_by: e.target.value })}>
                  <option value="Owner">Owner</option>
                  <option value="Admin">Admin</option>
                  <option value="HR">HR</option>
                </select>
              </div>
              <div>
                <label>Pin to top</label>
                <label className="checkbox-row" style={{ cursor: 'pointer' }}>
                  <input type="checkbox"
                    checked={!!editing.pinned}
                    onChange={e => setEditing({ ...editing, pinned: e.target.checked })} />
                  <div>
                    <div className="label-text">{editing.pinned ? 'Pinned' : 'Normal'}</div>
                    <div className="sub">Pinned notices appear first everywhere.</div>
                  </div>
                </label>
              </div>
            </div>
          </>
        )}
      </Modal>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Tasks management — Owner checklist + per-staff tasks per day.
// ──────────────────────────────────────────────────────────
const TasksPage = () => {
  const toast = useToast();
  const { can, session } = useContext(AppCtx);

  const [date, setDate]     = useState(() => fmtDateISO(new Date()));
  const [scope, setScope]   = useState('owner'); // 'owner' | 'staff'
  const [assignee, setAssignee] = useState('all');
  const [search, setSearch] = useState('');

  const [tasks, setTasks]   = useState([]);
  const [commentCounts, setCommentCounts] = useState({}); // task_id -> count
  const [loading, setLoading] = useState(true);
  const { rows: employees } = useEmployees();

  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);
  const [copying, setCopying] = useState(false);
  const [commentsFor, setCommentsFor] = useState(null); // task row opened in the comments modal

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    // Try the new schema first (parent_task_id column from the
    // sub-tasks migration). If the column doesn't exist on prod
    // yet, fall back to the original SELECT and treat parent_task_id
    // as null. This keeps the page functional pre-migration.
    let res = await window.sb
      .from('tasks')
      .select('id, scope, assignee_id, label, owner_label, done, priority, sort_order, due_date, parent_task_id')
      .eq('due_date', date)
      .order('sort_order');
    if (res.error) {
      console.warn('Tasks SELECT (with parent_task_id) failed, retrying without:', res.error.message);
      res = await window.sb
        .from('tasks')
        .select('id, scope, assignee_id, label, owner_label, done, priority, sort_order, due_date')
        .eq('due_date', date)
        .order('sort_order');
    }
    const list = (res.data || []).map(t => ({ parent_task_id: null, ...t }));
    setTasks(list);
    // Counts of comments per task — lightweight follow-up select so the
    // UI can show a "💬 3" badge without joining on a view. Tolerates
    // the task_comments table not existing yet.
    if (list.length) {
      const ids = list.map(t => t.id);
      try {
        const { data: cData, error: cErr } = await window.sb
          .from('task_comments').select('task_id')
          .in('task_id', ids);
        if (cErr) { setCommentCounts({}); }
        else {
          const counts = {};
          (cData || []).forEach(c => {
            counts[c.task_id] = (counts[c.task_id] || 0) + 1;
          });
          setCommentCounts(counts);
        }
      } catch (_) { setCommentCounts({}); }
    } else {
      setCommentCounts({});
    }
    setLoading(false);
  }, [date]);

  useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel(`dash-tasks-${date}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'tasks', filter: `due_date=eq.${date}` },
        () => fetchAll())
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'task_comments' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, date]);

  // Flat-but-grouped ordering: every parent task shows with its children
  // immediately beneath it (indented in the table below). Search filters
  // keep a child visible only if the child matches; orphan sub-tasks
  // (parent absent in this scope/date) are shown at the top-level.
  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    const inScope = tasks.filter(t => {
      if (t.scope !== scope) return false;
      if (scope === 'staff' && assignee !== 'all' && t.assignee_id !== assignee) return false;
      if (!matchesQuery(q, t.label, t.owner_label)) return false;
      return true;
    });
    const byId = new Map(inScope.map(t => [t.id, t]));
    const children = {};
    inScope.forEach(t => {
      if (t.parent_task_id && byId.has(t.parent_task_id)) {
        (children[t.parent_task_id] = children[t.parent_task_id] || []).push(t);
      }
    });
    const ordered = [];
    inScope
      .filter(t => !t.parent_task_id || !byId.has(t.parent_task_id))
      .forEach(t => {
        ordered.push({ ...t, _depth: 0 });
        (children[t.id] || [])
          .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
          .forEach(c => ordered.push({ ...c, _depth: 1 }));
      });
    return ordered;
  }, [tasks, scope, assignee, search]);

  const counts = useMemo(() => {
    const inScope = tasks.filter(t => t.scope === scope);
    const done = inScope.filter(t => t.done).length;
    return {
      total:  inScope.length,
      done,
      pending: inScope.length - done,
      pct: inScope.length ? Math.round((done / inScope.length) * 100) : 0,
      priority: inScope.filter(t => t.priority && !t.done).length,
    };
  }, [tasks, scope]);

  const empById = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.id] = e; });
    return m;
  }, [employees]);

  const staffEmployees = useMemo(() =>
    employees.filter(e => e.user_type === 'staff' && e.is_active)
      .sort((a, b) => a.name.localeCompare(b.name))
  , [employees]);

  const toggleDone = async (row) => {
    if (!can('tasks', 'edit')) return;
    await window.sb.from('tasks').update({ done: !row.done }).eq('id', row.id);
  };

  const startNew = () => {
    const maxOrder = Math.max(0, ...tasks.filter(t => t.scope === scope).map(t => t.sort_order || 0));
    setEditing({
      id: null, scope, assignee_id: scope === 'staff' ? (assignee !== 'all' ? assignee : 'E003') : null,
      label: '', owner_label: '', priority: false, sort_order: maxOrder + 1,
      due_date: date, done: false, parent_task_id: null, _new: true,
    });
  };
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.label.trim()) { toast('Label is required'); return; }
    if (editing.scope === 'staff' && !editing.assignee_id) { toast('Assignee is required for staff tasks'); return; }
    setSaving(true);
    try {
      const payload = {
        scope: editing.scope,
        assignee_id: editing.scope === 'staff' ? editing.assignee_id : null,
        label: editing.label.trim(),
        owner_label: editing.scope === 'owner' ? (editing.owner_label || '').trim() || null : null,
        priority: !!editing.priority,
        sort_order: parseInt(editing.sort_order, 10) || 0,
        due_date: editing.due_date,
        parent_task_id: editing.parent_task_id || null,
      };
      if (editing._new) {
        await window.sb.from('tasks').insert(payload);
        toast('Task added');
      } else {
        await window.sb.from('tasks').update(payload).eq('id', editing.id);
        toast('Task updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const del = async (row) => {
    if (!can('tasks', 'delete')) return;
    if (!window.confirm(`Delete task “${row.label}”?`)) return;
    await window.sb.from('tasks').delete().eq('id', row.id);
    toast('Deleted');
  };

  const copyToDate = async () => {
    if (copying) return;
    const target = window.prompt(
      'Copy all of today\u2019s tasks (for the current scope) to which date?\n\nYYYY-MM-DD',
      fmtDateISO(new Date(new Date(date + 'T00:00:00').getTime() + 24 * 3600 * 1000))
    );
    if (!target) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(target)) { toast('Invalid date format'); return; }
    const sourceTasks = tasks.filter(t => t.scope === scope);
    if (!sourceTasks.length) { toast('Nothing to copy'); return; }
    setCopying(true);
    try {
      const payload = sourceTasks.map(t => ({
        scope: t.scope,
        assignee_id: t.assignee_id,
        label: t.label,
        owner_label: t.owner_label,
        priority: t.priority,
        sort_order: t.sort_order,
        due_date: target,
        done: false,
      }));
      await window.sb.from('tasks').insert(payload);
      toast(`Copied ${payload.length} tasks to ${target}`);
    } finally { setCopying(false); }
  };

  const dateObj = new Date(date + 'T00:00:00');
  const isToday = date === fmtDateISO(new Date());

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
        <div className="stat present"><div className="k">Done</div><div className="v">{counts.done}</div></div>
        <div className="stat late"><div className="k">Pending</div><div className="v">{counts.pending}</div></div>
        <div className="stat absent"><div className="k">Priority</div><div className="v">{counts.priority}</div></div>
        <div className="stat leave"><div className="k">Complete</div><div className="v">{counts.pct}%</div></div>
      </div>

      <div className="toolbar">
        <input type="date" value={date} onChange={e => setDate(e.target.value)}
          style={{ fontWeight: 600 }} />
        <button className="btn" onClick={() => setDate(fmtDateISO(new Date()))}
          disabled={isToday}>Today</button>

        <div className="seg">
          {[{ id: 'owner', label: 'Owner checklist' }, { id: 'staff', label: 'Staff tasks' }].map(s => (
            <button key={s.id}
              className={scope === s.id ? 'active' : ''}
              onClick={() => setScope(s.id)}>
              {s.label}
            </button>
          ))}
        </div>

        {scope === 'staff' && (
          <div style={{ minWidth: 260, flex: '0 0 260px' }}>
            <EmployeePicker
              employees={staffEmployees}
              value={assignee === 'all' ? '' : assignee}
              onChange={id => setAssignee(id || 'all')}
              allowClear
              clearLabel="All staff"
              placeholder="Filter by employee…"
            />
          </div>
        )}

        <input type="search" placeholder="Search task…"
          value={search} onChange={e => setSearch(e.target.value)} />

        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <button className="btn" onClick={copyToDate} disabled={!tasks.length || copying}
            title="Copy all tasks in this scope to another date">
            {copying ? 'Copying…' : 'Copy to date…'}
          </button>
          {can('tasks', 'create') && (
            <button className="btn primary" onClick={startNew}>+ New task</button>
          )}
        </div>
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 60 }}>Done</th>
              <th style={{ width: 60 }}>Order</th>
              <th>Task</th>
              {scope === 'owner'
                ? <th style={{ width: 220 }}>Owner (label)</th>
                : <th style={{ width: 220 }}>Assigned to</th>}
              <th style={{ width: 80 }}>Priority</th>
              <th style={{ width: 110 }}>Comments</th>
              <th style={{ width: 190 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={7} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No tasks for this date / scope.'}
                </td>
              </tr>
            )}
            {rows.map(r => (
              <tr key={r.id} style={r.done ? { opacity: 0.55 } : null}>
                <td>
                  <input type="checkbox"
                    checked={r.done}
                    onChange={() => toggleDone(r)}
                    disabled={!can('tasks', 'edit')} />
                </td>
                <td className="muted">{r.sort_order}</td>
                <td className="name" style={{
                  textDecoration: r.done ? 'line-through' : 'none',
                  paddingLeft: r._depth ? 22 : undefined,
                }}>
                  {r._depth ? <span style={{ color: 'var(--inkFaint)', marginRight: 6 }}>↳</span> : null}
                  {r.label}
                </td>
                <td className="muted">
                  {scope === 'owner'
                    ? (r.owner_label || '—')
                    : (empById[r.assignee_id]
                        ? `${empById[r.assignee_id].name} · ${r.assignee_id}`
                        : r.assignee_id)}
                </td>
                <td>
                  {r.priority
                    ? <span className="status-pill late">Priority</span>
                    : <span className="muted">—</span>}
                </td>
                <td>
                  <button className="btn"
                    style={{ height: 28, padding: '0 10px', fontWeight: 600 }}
                    onClick={() => setCommentsFor(r)}
                    title="View or add comments">
                    💬 {commentCounts[r.id] || 0}
                  </button>
                </td>
                <td>
                  {can('tasks', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(r)}>Edit</button>
                  )}
                  {can('tasks', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => del(r)}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--inkFaint)' }}>
        {dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
        {` · ${counts.total} tasks · ${counts.pct}% complete`}
      </div>

      <Modal
        open={!!editing}
        title={editing?._new
          ? `Add ${editing?.scope === 'owner' ? 'owner-checklist' : 'staff'} task`
          : 'Edit task'}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : editing?._new ? 'Add task' : 'Save'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row">
              <label>Scope</label>
              <div className="seg" style={{ width: 'fit-content' }}>
                {[{ id: 'owner', label: 'Owner checklist' }, { id: 'staff', label: 'Staff task' }].map(s => (
                  <button key={s.id}
                    type="button"
                    className={editing.scope === s.id ? 'active' : ''}
                    onClick={() => setEditing({ ...editing, scope: s.id })}>
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="field-row">
              <label>Task label</label>
              <input autoFocus
                value={editing.label}
                onChange={e => setEditing({ ...editing, label: e.target.value })}
                placeholder={editing.scope === 'owner'
                  ? 'e.g. Cash float verified at 6 counters'
                  : 'e.g. Greet bridal appointment — 11:30 AM'} />
            </div>

            {editing.scope === 'owner' ? (
              <div className="field-row">
                <label>Who's responsible? (optional)</label>
                <input
                  value={editing.owner_label || ''}
                  onChange={e => setEditing({ ...editing, owner_label: e.target.value })}
                  placeholder="e.g. Saranya (Cashier Lead)" />
              </div>
            ) : (
              <div className="field-row">
                <label>Assigned to</label>
                <EmployeePicker
                  employees={staffEmployees}
                  value={editing.assignee_id || ''}
                  onChange={id => setEditing({ ...editing, assignee_id: id })}
                />
              </div>
            )}

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
              <div>
                <label>Due date</label>
                <input type="date"
                  value={editing.due_date || ''}
                  onChange={e => setEditing({ ...editing, due_date: e.target.value })} />
              </div>
              <div>
                <label>Sort order</label>
                <input type="number"
                  value={editing.sort_order}
                  onChange={e => setEditing({ ...editing, sort_order: e.target.value })} />
              </div>
              <div>
                <label>Priority</label>
                <label className="checkbox-row" style={{ cursor: 'pointer' }}>
                  <input type="checkbox"
                    checked={!!editing.priority}
                    onChange={e => setEditing({ ...editing, priority: e.target.checked })} />
                  <div>
                    <div className="label-text">{editing.priority ? 'Priority' : 'Normal'}</div>
                    <div className="sub">Shown with a pill on the mobile app.</div>
                  </div>
                </label>
              </div>
            </div>

            <div className="field-row">
              <label>Part of task (optional)</label>
              <select
                value={editing.parent_task_id || ''}
                onChange={e => setEditing({ ...editing, parent_task_id: e.target.value || null })}
              >
                <option value="">— None (top-level task) —</option>
                {tasks
                  .filter(t =>
                    t.scope === editing.scope &&
                    t.id !== editing.id &&
                    !t.parent_task_id
                  )
                  .sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0))
                  .map(t => (
                    <option key={t.id} value={t.id}>{t.label}</option>
                  ))}
              </select>
              <div className="sub" style={{ marginTop: 4, fontSize: 11.5, color: 'var(--inkMuted)' }}>
                Pick a parent to make this a sub-task. Nesting is single-level.
              </div>
            </div>
          </>
        )}
      </Modal>

      <TaskCommentsModal
        task={commentsFor}
        session={session}
        onClose={() => setCommentsFor(null)}
      />
    </div>
  );
};

// Lightweight comments thread for a single task, loaded on demand.
const TaskCommentsModal = ({ task, session, onClose }) => {
  const [comments, setComments] = useState([]);
  const [loading, setLoading]   = useState(false);
  const [draft, setDraft]       = useState('');
  const [posting, setPosting]   = useState(false);

  useEffect(() => {
    if (!task || !window.sb) return;
    let cancelled = false;
    setLoading(true);
    const fetchComments = async () => {
      const { data } = await window.sb.from('task_comments')
        .select('id, author_id, author_name, body, created_at')
        .eq('task_id', task.id)
        .order('created_at', { ascending: true });
      if (!cancelled) { setComments(data || []); setLoading(false); }
    };
    fetchComments();
    const ch = window.sb.channel(`task-comments-${task.id}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'task_comments', filter: `task_id=eq.${task.id}` },
        () => fetchComments())
      .subscribe();
    return () => { cancelled = true; window.sb.removeChannel(ch); };
  }, [task]);

  const post = async () => {
    const body = draft.trim();
    if (!body || !task || posting) return;
    setPosting(true);
    try {
      const { error } = await window.sb.from('task_comments').insert({
        task_id: task.id,
        author_id: session?.employee_id || null,
        author_name: session?.display_name || 'Owner',
        body,
      });
      if (error) { console.error(error); return; }
      setDraft('');
    } finally { setPosting(false); }
  };

  return (
    <Modal
      open={!!task}
      title={task ? `Comments · ${task.label}` : ''}
      onClose={onClose}
      footer={
        <button className="btn" onClick={onClose}>Close</button>
      }
    >
      {task && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{
            maxHeight: 320, overflowY: 'auto',
            display: 'flex', flexDirection: 'column', gap: 8,
            padding: 4,
          }}>
            {loading && (
              <div style={{ color: 'var(--inkMuted)', fontSize: 13, padding: 8 }}>Loading…</div>
            )}
            {!loading && comments.length === 0 && (
              <div style={{ color: 'var(--inkMuted)', fontSize: 13, padding: 8 }}>
                No comments yet. Start the conversation.
              </div>
            )}
            {comments.map(c => (
              <div key={c.id} style={{
                background: 'var(--surfaceAlt)', borderRadius: 10,
                padding: '10px 12px',
              }}>
                <div style={{ fontSize: 11.5, color: 'var(--inkMuted)', marginBottom: 3 }}>
                  <strong style={{ color: 'var(--ink)' }}>{c.author_name || '—'}</strong>
                  {' · '}{fmtDateTime(c.created_at)}
                </div>
                <div style={{ fontSize: 13.5, color: 'var(--ink)', whiteSpace: 'pre-wrap' }}>
                  {c.body}
                </div>
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
            <textarea
              value={draft}
              onChange={e => setDraft(e.target.value)}
              placeholder="Write a comment…"
              rows={2}
              style={{ flex: 1, resize: 'vertical', minHeight: 44 }}
            />
            <button className="btn primary" onClick={post} disabled={!draft.trim() || posting}>
              {posting ? 'Posting…' : 'Post'}
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
};

// ──────────────────────────────────────────────────────────
// Visitors management — log, check-in/out, edit, delete.
// ──────────────────────────────────────────────────────────
const VisitorsPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);

  const [from, setFrom]   = useState(() => fmtDateISO(new Date()));
  const [to, setTo]       = useState(() => fmtDateISO(new Date()));
  const [status, setStatus] = useState('all');
  const [search, setSearch] = useState('');

  const [list, setList]   = useState([]);
  const [loading, setLoading] = useState(true);

  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const fromDT = new Date(from + 'T00:00:00').toISOString();
    const toDT   = new Date(to   + 'T23:59:59').toISOString();
    const { data } = await window.sb
      .from('visitors')
      .select('*')
      .gte('in_at', fromDT)
      .lte('in_at', toDT)
      .order('in_at', { ascending: false });
    setList(data || []);
    setLoading(false);
  }, [from, to]);

  useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel(`dash-visitors-${from}-${to}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'visitors' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, from, to]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return list.filter(v => {
      if (status === 'in' && v.status !== 'in') return false;
      if (status === 'out' && v.status !== 'out') return false;
      if (!matchesQuery(q, v.name, v.purpose, v.location)) return false;
      return true;
    });
  }, [list, status, search]);

  const counts = useMemo(() => {
    const today = fmtDateISO(new Date());
    const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    const nowIn = list.filter(v => v.status === 'in').length;
    const todayCount = list.filter(v => fmtDateISO(new Date(v.in_at)) === today).length;
    const weekCount  = list.filter(v => new Date(v.in_at).getTime() > weekAgo).length;
    return { nowIn, todayCount, weekCount, total: list.length };
  }, [list]);

  const startNew = () => setEditing({
    id: null, name: '', purpose: '', location: 'Reception',
    status: 'in', in_at: new Date().toISOString(), out_at: null,
    _new: true,
  });
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.name.trim()) { toast('Name is required'); return; }
    setSaving(true);
    try {
      const payload = {
        name: editing.name.trim(),
        purpose: (editing.purpose || '').trim() || null,
        location: (editing.location || '').trim() || null,
        status: editing.status,
        in_at: editing.in_at,
        out_at: editing.status === 'out' ? (editing.out_at || new Date().toISOString()) : null,
      };
      if (editing._new) {
        await window.sb.from('visitors').insert(payload);
        toast(`${payload.name} logged in`);
      } else {
        await window.sb.from('visitors').update(payload).eq('id', editing.id);
        toast('Updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const checkOut = async (row) => {
    if (!can('visitors', 'edit')) return;
    await window.sb.from('visitors')
      .update({ status: 'out', out_at: new Date().toISOString() })
      .eq('id', row.id);
    toast(`${row.name} checked out`);
  };

  const checkIn = async (row) => {
    if (!can('visitors', 'edit')) return;
    await window.sb.from('visitors')
      .update({ status: 'in', out_at: null })
      .eq('id', row.id);
  };

  const del = async (row) => {
    if (!can('visitors', 'delete')) return;
    if (!window.confirm(`Delete visit log for ${row.name}?`)) return;
    await window.sb.from('visitors').delete().eq('id', row.id);
    toast('Deleted');
  };

  // Convert ISO to `datetime-local` input format (YYYY-MM-DDTHH:MM)
  const toLocalInput = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const fromLocalInput = (val) => val ? new Date(val).toISOString() : null;

  return (
    <div>
      <div className="stat-strip">
        <div className="stat present"><div className="k">Currently in</div><div className="v">{counts.nowIn}</div></div>
        <div className="stat"><div className="k">Today</div><div className="v">{counts.todayCount}</div></div>
        <div className="stat leave"><div className="k">Last 7 days</div><div className="v">{counts.weekCount}</div></div>
        <div className="stat"><div className="k">In range</div><div className="v">{counts.total}</div></div>
        <div className="stat"><div className="k">Showing</div><div className="v">{rows.length}</div></div>
      </div>

      <div className="toolbar">
        <span style={{ fontSize: 12, color: 'var(--inkMuted)' }}>From</span>
        <input type="date" value={from} onChange={e => setFrom(e.target.value)} />
        <span style={{ fontSize: 12, color: 'var(--inkMuted)' }}>to</span>
        <input type="date" value={to} onChange={e => setTo(e.target.value)} />
        <button className="btn" onClick={() => {
          const today = fmtDateISO(new Date());
          setFrom(today); setTo(today);
        }}>Today</button>
        <button className="btn" onClick={() => {
          const today = new Date();
          const weekAgo = new Date(today.getTime() - 6 * 24 * 3600 * 1000);
          setFrom(fmtDateISO(weekAgo)); setTo(fmtDateISO(today));
        }}>Last 7 days</button>

        <div className="seg">
          {[
            { id: 'all', label: 'All' },
            { id: 'in',  label: `In · ${list.filter(v => v.status === 'in').length}` },
            { id: 'out', label: `Out · ${list.filter(v => v.status === 'out').length}` },
          ].map(s => (
            <button key={s.id} className={status === s.id ? 'active' : ''} onClick={() => setStatus(s.id)}>
              {s.label}
            </button>
          ))}
        </div>

        <input type="search" placeholder="Search name, purpose, location…"
          value={search} onChange={e => setSearch(e.target.value)} />

        {can('visitors', 'create') && (
          <button className="btn primary" onClick={startNew} style={{ marginLeft: 'auto' }}>
            + Log visitor
          </button>
        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th>Name</th>
              <th>Purpose</th>
              <th style={{ width: 140 }}>Location</th>
              <th style={{ width: 130 }}>In at</th>
              <th style={{ width: 130 }}>Out at</th>
              <th style={{ width: 90 }}>Status</th>
              <th style={{ width: 240 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={7} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No visitors in this range.'}
                </td>
              </tr>
            )}
            {rows.map(r => (
              <tr key={r.id}>
                <td className="name">{r.name}</td>
                <td>{r.purpose || <span className="muted">—</span>}</td>
                <td>{r.location || <span className="muted">—</span>}</td>
                <td className="muted" style={{ fontSize: 12 }}>{fmtDateTime(r.in_at)}</td>
                <td className="muted" style={{ fontSize: 12 }}>{fmtDateTime(r.out_at)}</td>
                <td>
                  <span className={`status-pill ${r.status === 'in' ? 'present' : 'unmarked'}`}>
                    {r.status === 'in' ? 'Inside' : 'Out'}
                  </span>
                </td>
                <td>
                  {r.status === 'in' && can('visitors', 'edit') && (
                    <button className="btn primary" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => checkOut(r)}>Check out</button>
                  )}
                  {r.status === 'out' && can('visitors', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => checkIn(r)}>Check back in</button>
                  )}
                  {can('visitors', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(r)}>Edit</button>
                  )}
                  {can('visitors', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => del(r)}>Delete</button>

                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <Modal
        open={!!editing}
        title={editing?._new ? 'Log visitor' : `Edit ${editing?.name || ''}`}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : editing?._new ? 'Log visitor' : 'Save'}
            </button>

        }
      >
        {editing && (
          <>
            <div className="field-row">
              <label>Name</label>
              <input autoFocus

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>

                <select value={editing.status}

const SectionsPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);

  const [rows, setRows] = useState([]);
  const [counts, setCounts] = useState({});
  const [loading, setLoading] = useState(true);

  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const [secRes, empRes] = await Promise.all([
      window.sb.from('sections').select('*').order('sort_order'),
      window.sb.from('employees').select('section_id').eq('is_active', true),
    ]);
    const c = {};
    (empRes.data || []).forEach(e => {
      if (e.section_id) c[e.section_id] = (c[e.section_id] || 0) + 1;
    });
    setCounts(c);
    setRows(secRes.data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-sections')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'sections' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' }, () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const startNew = () => {
    const nextOrder = Math.max(0, ...rows.map(r => r.sort_order || 0)) + 1;
    setEditing({ id: '', name: '', name_ta: '', monogram: '', sort_order: nextOrder, _new: true });
  };
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    const payload = {
      name: editing.name.trim(),
      name_ta: (editing.name_ta || '').trim() || null,
      monogram: (editing.monogram || '').trim().toUpperCase().slice(0, 3),
      sort_order: parseInt(editing.sort_order, 10) || 0,
    };
    if (!payload.name) { toast('Name is required'); return; }
    if (!payload.monogram) { toast('Monogram is required'); return; }
    setSaving(true);
    try {
      if (editing._new) {
        const id = editing.id.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');
        if (!id) { toast('ID is required'); setSaving(false); return; }
        const { error } = await window.sb.from('sections').insert({ id, ...payload });
        if (error) {
          toast(error.message.includes('duplicate') ? 'Section ID already exists' : 'Could not save');
        } else {
          toast('Section added');
          close();
        }
      } else {
        const { error } = await window.sb.from('sections').update(payload).eq('id', editing.id);
        if (error) toast('Could not save');
        else { toast('Saved'); close(); }
      }
    } finally { setSaving(false); }
  };

  const move = async (row, delta) => {
    const idx = rows.findIndex(r => r.id === row.id);
    const other = rows[idx + delta];
    if (!other) return;
    await Promise.all([
      window.sb.from('sections').update({ sort_order: other.sort_order }).eq('id', row.id),
      window.sb.from('sections').update({ sort_order: row.sort_order }).eq('id', other.id),
    ]);
  };

  const del = async (row) => {
    if (!can('sections', 'delete')) return;
    const n = counts[row.id] || 0;
    if (n > 0) {
      toast(`Cannot delete — ${n} active employee${n === 1 ? '' : 's'} in this section. Reassign first.`);
      return;
    }
    if (!window.confirm(`Delete section “${row.name}”? This cannot be undone.`)) return;
    const { error } = await window.sb.from('sections').delete().eq('id', row.id);
    if (error) toast('Could not delete (check FK constraints).');
    else toast('Deleted');
  };

  const readOnly = !can('sections', 'edit');

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Sections</div><div className="v">{rows.length}</div></div>
        <div className="stat present"><div className="k">Active staff</div><div className="v">{Object.values(counts).reduce((a, b) => a + b, 0)}</div></div>
        {rows.slice(0, 3).map(r => (
          <div key={r.id} className="stat">
            <div className="k">{r.name}</div>
            <div className="v">{counts[r.id] || 0}</div>
          </div>
        ))}
      </div>

      <div className="toolbar">
        {readOnly && (
          <div style={{
            fontSize: 12, color: 'var(--warning)',
            background: 'var(--warningSoft)', padding: '8px 12px', borderRadius: 10,
          }}>
            Read-only — HR accounts cannot edit sections.
          </div>
        )}
        {!readOnly && can('sections', 'create') && (
          <button className="btn primary" onClick={startNew} style={{ marginLeft: 'auto' }}>
            + New section
          </button>
        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 70 }}>Order</th>
              <th style={{ width: 80 }}>ID</th>
              <th style={{ width: 70 }}>Mono</th>
              <th>Name</th>
              <th>Tamil name</th>
              <th style={{ width: 120 }}>Active staff</th>
              {!readOnly && <th style={{ width: 240 }}>Actions</th>}
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={readOnly ? 6 : 7} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No sections.'}
                </td>
              </tr>
            )}
            {rows.map((r, idx) => (
              <tr key={r.id}>
                <td className="muted">{r.sort_order}</td>
                <td className="id">{r.id}</td>
                <td>
                  <div style={{
                    width: 30, height: 30, borderRadius: 8,
                    background: 'var(--brandSoft)', color: 'var(--brand)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontFamily: 'Fraunces, Georgia, serif',
                    fontSize: 14, fontWeight: 600,
                  }}>{r.monogram}</div>
                </td>
                <td className="name">{r.name}</td>
                <td style={{ fontFamily: 'Inter, Noto Sans Tamil, sans-serif' }}>
                  {r.name_ta || <span className="muted">—</span>}
                </td>
                <td>
                  <span className="status-pill present">{counts[r.id] || 0} staff</span>
                </td>
                {!readOnly && (
                  <td>
                    <button className="btn" style={{ height: 28, padding: '0 8px', marginRight: 4 }}
                      onClick={() => move(r, -1)} disabled={idx === 0}
                      title="Move up">↑</button>
                    <button className="btn" style={{ height: 28, padding: '0 8px', marginRight: 6 }}
                      onClick={() => move(r, 1)} disabled={idx === rows.length - 1}
                      title="Move down">↓</button>
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(r)}>Edit</button>
                    {can('sections', 'delete') && (
                      <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                        onClick={() => del(r)}>Delete</button>
                    )}
                  </td>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 14, fontSize: 11.5, color: 'var(--inkFaint)' }}>
        Section IDs are used as foreign keys on the employees table — once created they cannot be renamed,
        only the display name and monogram can be edited. Deletion is blocked while any active employees
        still reference the section.
      </div>

      <Modal
        open={!!editing}
        title={editing?._new ? 'Add section' : `Edit ${editing?.name || ''}`}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : editing?._new ? 'Add section' : 'Save'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '140px 1fr', gap: 12 }}>
              <div>
                <label>Section ID</label>
                {editing._new ? (
                  <input
                    value={editing.id}

                    style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
