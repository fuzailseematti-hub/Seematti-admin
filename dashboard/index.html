                    const n = faceCounts[r.id] || 0;
                    if (n >= 3) return <span className="status-pill present" title={`${n} poses enrolled`}>✓ {n}/3</span>;
                    if (n > 0)  return <span className="status-pill late" title={`${n} of 3 poses — needs re-enrollment`}>{n}/3</span>;
                    return <span className="status-pill unmarked">—</span>;
                  })()}
                </td>
                {(can('employees', 'edit') || can('employees', 'delete')) && (
                  <td>
                    {can('employees', 'edit') && (
                      <>
                        <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                          onClick={() => startEdit(r)}>Edit</button>
                        <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                          onClick={() => toggleActive(r)}>
                          {r.is_active ? 'Deactivate' : 'Reactivate'}
                        </button>
                        {(faceCounts[r.id] || 0) > 0 && (
                          <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                            onClick={() => clearFace(r)}
                            title="Delete face embeddings so the kiosk no longer recognises them">
                            Clear face
                          </button>
                        )}
                      </>
                    )}
                    {can('employees', 'delete') && (
                      <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                        onClick={() => del(r)}>Delete</button>
                    )}
                  </td>
                )}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Add / Edit modal */}
      <Modal
        open={!!editing}
        title={editing?._new ? 'Add employee' : `Edit ${editing?.name || ''}`}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : editing?._new ? 'Add employee' : 'Save changes'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '140px 1fr', gap: 12 }}>
              <div>
                <label>Employee ID</label>
                {editing._new ? (
                  <input
                    value={editing.id || editing._suggestedId}
                    onChange={e => setEditing({ ...editing, id: e.target.value.toUpperCase() })}
                    placeholder={editing._suggestedId}
                    style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }}
                  />
                ) : (
                  <input value={editing.id} readOnly
                    style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', background: 'var(--surfaceAlt)' }} />
                )}
              </div>
              <div>
                <label>Full name</label>
                <input autoFocus={editing._new}
                  value={editing.name || ''}
                  onChange={e => setEditing({ ...editing, name: e.target.value })}
                  placeholder="e.g. Divya Parvathy" />
              </div>
            </div>

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Employee code</label>
                <input
                  value={editing.employee_code || ''}
                  onChange={e => setEditing({ ...editing, employee_code: e.target.value })}
                  placeholder="e.g. E001"
                  style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
              </div>
              <div>
                <label>Company</label>
                <input
                  value={editing.company || ''}
                  onChange={e => setEditing({ ...editing, company: e.target.value })}
                  placeholder="e.g. Seematti Silks" />
              </div>
            </div>

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Role / designation</label>
                <input
                  value={editing.role || ''}
                  onChange={e => setEditing({ ...editing, role: e.target.value })}
                  placeholder="e.g. Sales Associate" />
              </div>
              <div>
                <label>User type</label>
                <select
                  value={editing.user_type || 'staff'}
                  onChange={e => setEditing({ ...editing, user_type: e.target.value })}>
                  <option value="staff">Staff</option>
                  <option value="hr">HR</option>
                  <option value="owner">Owner</option>
                </select>
              </div>
            </div>

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Section {editing.user_type !== 'staff' && '(staff only)'}</label>
                <select
                  value={editing.section_id || ''}
                  onChange={e => setEditing({ ...editing, section_id: e.target.value || null })}
                  disabled={editing.user_type !== 'staff'}>
                  <option value="">— none —</option>
                  {Object.entries(SECTION_META).map(([k, v]) => (
                    <option key={k} value={k}>{v.full}</option>
                  ))}
                </select>
              </div>
              <div>
                <label>Joined date</label>
                <input type="date"
                  value={editing.joined_date || ''}
                  onChange={e => setEditing({ ...editing, joined_date: e.target.value })} />
              </div>
            </div>

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>City / town</label>
                <input
                  value={editing.city || ''}
                  onChange={e => setEditing({ ...editing, city: e.target.value })}
                  placeholder="e.g. Kumbakonam" />
              </div>
              <div>
                <label>Phone (optional)</label>
                <input
                  value={editing.phone || ''}
                  onChange={e => setEditing({ ...editing, phone: e.target.value })}
                  placeholder="+91 ..." />
              </div>
            </div>

            <div className="field-row">
              <div>
                <label>Active</label>
                <label className="checkbox-row" style={{ cursor: 'pointer' }}>
                  <input type="checkbox"
                    checked={!!editing.is_active}
                    onChange={e => setEditing({ ...editing, is_active: e.target.checked })} />
                  <div>
                    <div className="label-text">{editing.is_active ? 'Active' : 'Inactive'}</div>
                    <div className="sub">Inactive employees are hidden from attendance rosters.</div>
                  </div>
                </label>
              </div>
            </div>

            {editing.user_type !== 'owner' && (
              <>
                <div style={{
                  marginTop: 18, marginBottom: 6, fontSize: 13, fontWeight: 600,
                  color: 'var(--ink)', borderTop: '1px solid var(--stroke)', paddingTop: 14,
                }}>
                  Payroll
                </div>

                <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                  <div>
                    <label>Salary type</label>
                    <select
                      value={editing.salary_type || 'new_joined'}
                      onChange={e => setEditing({ ...editing, salary_type: e.target.value })}>
                      <option value="new_joined">New joined</option>
                      <option value="esi_pf">ESI / PF</option>
                    </select>
                  </div>
                  <div>
                    <label>Monthly salary (₹)</label>
                    <input type="number" min="0" step="1"
                      value={editing.monthly_salary ?? ''}
                      onChange={e => setEditing({ ...editing, monthly_salary: e.target.value })}
                      placeholder="e.g. 15000" />
                  </div>
                </div>

                {editing.salary_type === 'esi_pf' && (
                  <>
                    <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                      <div>
                        <label>HRA (₹)</label>
                        <input type="number" min="0" step="1"
                          value={editing.hra ?? ''}
                          onChange={e => setEditing({ ...editing, hra: e.target.value })}
                          placeholder="e.g. 4600" />
                      </div>
                      <div>
                        <label>W.A. — workman allowance (₹)</label>
                        <input type="number" min="0" step="1"
                          value={editing.wa ?? ''}
                          onChange={e => setEditing({ ...editing, wa: e.target.value })}
                          placeholder="e.g. 3000" />
                      </div>
                    </div>

                    <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                      <div>
                        <label>TMB account no.</label>
                        <input
                          value={editing.tmb_account_no || ''}
                          onChange={e => setEditing({ ...editing, tmb_account_no: e.target.value })}
                          placeholder="e.g. 094100050305880"
                          style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
                      </div>
                      <div>
                        <label>ESI no.</label>
                        <input
                          value={editing.esi_no || ''}
                          onChange={e => setEditing({ ...editing, esi_no: e.target.value })}
                          placeholder="10-digit ESI number"
                          style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
                      </div>
                    </div>

                    <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                      <div>
                        <label>EPF no.</label>
                        <input
                          value={editing.epf_no || ''}
                          onChange={e => setEditing({ ...editing, epf_no: e.target.value })}
                          placeholder="optional"
                          style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
                      </div>
                      <div>
                        <label>UAN no.</label>
                        <input
                          value={editing.uan_no || ''}
                          onChange={e => setEditing({ ...editing, uan_no: e.target.value })}
                          placeholder="12-digit UAN"
                          style={{ fontFamily: 'JetBrains Mono, Menlo, monospace' }} />
                      </div>
                    </div>
                  </>
                )}
              </>
            )}
          </>
        )}
      </Modal>

      {detail && (
        <EmployeeDetailModal
          employee={detail}
          faceCount={faceCounts[detail.id] || 0}
          onClose={() => setDetail(null)}
          onEdit={() => { startEdit(detail); setDetail(null); }}
          onCleared={() => setDetail(d => d ? { ...d } : null)}
        />
      )}

      <Modal
        open={!!uploadPreview}
        title={uploadPreview ? `Review changes · ${uploadPreview.filename}` : ''}
        onClose={() => setUploadPreview(null)}
        footer={
          <>
            <button className="btn" onClick={() => setUploadPreview(null)} disabled={uploadBusy}>Cancel</button>
            <button className="btn primary" onClick={applyUpload}
              disabled={uploadBusy || !(uploadPreview?.updates.length || uploadPreview?.creates?.length)}>
              {uploadBusy ? 'Applying…' : (() => {
                const c = uploadPreview?.creates?.length || 0;
                const u = uploadPreview?.updates?.length || 0;
                if (c && u) return `Create ${c} · Update ${u}`;
                if (c)      return `Create ${c} employee${c === 1 ? '' : 's'}`;
                if (u)      return `Update ${u} employee${u === 1 ? '' : 's'}`;
                return 'Nothing to apply';
              })()}
            </button>
          </>
        }
      >
        {uploadPreview && (
          <>
            <div style={{
              display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10,
              padding: 12, background: 'var(--bg)', borderRadius: 10,
              border: '1px solid var(--border)', marginBottom: 14,
            }}>
              <DetailField label="Will create" value={String(uploadPreview.creates?.length || 0)} />
              <DetailField label="Will update" value={String(uploadPreview.updates.length)} />
              <DetailField label="Skipped" value={String(uploadPreview.unmatched.length)} />
              <DetailField label="Sheets" value={
                [...new Set([
                  ...uploadPreview.updates.map(u => u.source),
                  ...(uploadPreview.creates || []).map(u => u.source),
                  ...uploadPreview.unmatched.map(u => u.source),
                ])].join(', ') || '—'
              } />
            </div>

            {uploadPreview.creates?.length > 0 && (
              <>
                <div style={{
                  fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: 'var(--brand)', marginBottom: 6,
                }}>New employees</div>
                <div style={{ maxHeight: 260, overflow: 'auto', border: '1px solid var(--border)', borderRadius: 10, marginBottom: 14 }}>
                  <table className="data" style={{ fontSize: 12 }}>
                    <thead>
                      <tr>
                        <th style={{ width: 80 }}>ID</th>
                        <th style={{ width: 90 }}>Code</th>
                        <th>Name</th>
                        <th style={{ width: 90 }}>Type</th>
                        <th>Fields</th>
                      </tr>
                    </thead>
                    <tbody>
                      {uploadPreview.creates.map((u, i) => (
                        <tr key={i}>
                          <td className="id">{u.newId}</td>
                          <td className="id">{u.record.employee_code || '—'}</td>
                          <td className="name">{u.record.name}</td>
                          <td>
                            <span className={`status-pill ${u.record.salary_type === 'esi_pf' ? 'leave' : 'unmarked'}`}>
                              {u.record.salary_type === 'esi_pf' ? 'ESI / PF' : 'New joined'}
                            </span>
                          </td>
                          <td style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', fontSize: 11 }}>
                            {Object.entries(u.record)
                              .filter(([k]) => !['id', 'name', 'salary_type', 'user_type', 'is_active', 'joined_date', 'section_id'].includes(k))
                              .map(([k, v]) => `${k}=${v}`).join(' · ') || '—'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}

            {uploadPreview.updates.length > 0 && (
              <>
                <div style={{
                  fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: 'var(--inkMuted)', marginBottom: 6,
                }}>Updates</div>
                <div style={{ maxHeight: 260, overflow: 'auto', border: '1px solid var(--border)', borderRadius: 10, marginBottom: 14 }}>
                  <table className="data" style={{ fontSize: 12 }}>
                    <thead>
                      <tr>
                        <th style={{ width: 80 }}>ID</th>
                        <th>Name</th>
                        <th style={{ width: 90 }}>Type</th>
                        <th>Changes</th>
                      </tr>
                    </thead>
                    <tbody>
                      {uploadPreview.updates.map((u, i) => (
                        <tr key={i}>
                          <td className="id">{u.employee.id}</td>
                          <td className="name">{u.employee.name}</td>
                          <td>
                            <span className={`status-pill ${u.patch.salary_type === 'esi_pf' ? 'leave' : 'unmarked'}`}>
                              {u.patch.salary_type === 'esi_pf' ? 'ESI / PF' : 'New joined'}
                            </span>
                          </td>
                          <td style={{ fontFamily: 'JetBrains Mono, Menlo, monospace', fontSize: 11 }}>
                            {Object.entries(u.patch)
                              .filter(([k]) => k !== 'salary_type')
                              .map(([k, v]) => `${k}=${v}`).join(' · ') || '—'}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </>
            )}

            {uploadPreview.unmatched.length > 0 && (
              <>
                <div style={{
                  fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: 'var(--warning)', marginBottom: 6,
                }}>Skipped — blank name or unrecognised row</div>
                <div style={{
                  maxHeight: 150, overflow: 'auto', border: '1px solid var(--border)',
                  borderRadius: 10, padding: 10, background: 'var(--warningSoft)',
                  fontSize: 12, lineHeight: 1.6,
                }}>
                  {uploadPreview.unmatched.map((u, i) => (
                    <div key={i}>
                      <strong>{u.name || '(blank)'}</strong>{u.source ? ` · from "${u.source}"` : ''}
                    </div>
                  ))}
                </div>
                <div style={{ fontSize: 11, color: 'var(--inkFaint)', marginTop: 6 }}>
                  Rows without an employee name (e.g. total / header rows) are skipped.
                  To create an employee, the <strong>EMPLOYEE NAME</strong> column must be filled.
                </div>
              </>
            )}

            {uploadPreview.sheetDiag?.length > 0 && (
              <details style={{ marginTop: 14 }}>
                <summary style={{
                  fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
                  color: 'var(--inkMuted)', cursor: 'pointer', padding: '4px 0',
                }}>Sheet diagnostics — what the parser sees</summary>
                {uploadPreview.sheetDiag.map((d, i) => {
                  const text =
                    `Sheet: "${d.sheetName}"\n` +
                    `Headers (${d.headers.length}): ${d.headers.map(h => `"${h}"`).join(', ')}\n` +
                    `First row: ${Object.entries(d.sampleRow).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' · ')}`;
                  return (
                    <div key={i} style={{
                      border: '1px solid var(--border)', borderRadius: 10,
                      padding: 10, marginTop: 8, background: 'var(--surfaceAlt)',
                      fontSize: 11, fontFamily: 'JetBrains Mono, Menlo, monospace',
                      position: 'relative',
                    }}>
                      <button className="btn"
                        onClick={() => {
                          navigator.clipboard.writeText(text)
                            .then(() => toast('Copied'))
                            .catch(() => toast('Could not copy'));
                        }}
                        style={{
                          position: 'absolute', top: 8, right: 8,
                          fontSize: 10, padding: '3px 8px',
                        }}>
                        Copy
                      </button>
                      <div style={{ fontWeight: 700, marginBottom: 4, paddingRight: 60 }}>Sheet: "{d.sheetName}"</div>
                      <div style={{ marginBottom: 6, color: 'var(--inkSoft)', userSelect: 'text' }}>
                        Headers ({d.headers.length}): {d.headers.map(h => `"${h}"`).join(', ')}
                      </div>
                      <div style={{ color: 'var(--inkSoft)', userSelect: 'text' }}>
                        First row: {Object.entries(d.sampleRow).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(' · ')}
                      </div>
                    </div>
                  );
                })}
              </details>
            )}
          </>
        )}
      </Modal>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Employee detail + face enroll modal (Owner / HR only can edit)
// ──────────────────────────────────────────────────────────
const EmployeeDetailModal = ({ employee, faceCount, onClose, onEdit, onCleared }) => {
  const toast = useToast();
  const { can } = useContext(AppCtx);
  const [enrolling, setEnrolling] = useState(false);

  const canEdit = can('employees', 'edit');

  const fmtDate = (iso) => iso
    ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
    : '—';

  const sectionLabel = SECTION_META[employee.section_id]?.full || SECTION_META[employee.section_id]?.label || '—';

  const clearFace = async () => {
    if (!window.confirm(`Delete face data for ${employee.name}? They'll need to re-enroll before the kiosk recognises them.`)) return;
    await window.sb.from('face_embeddings').delete().eq('employee_id', employee.id);
    toast('Face data cleared');
    if (onCleared) onCleared();
  };

  return (
    <>
      <Modal
        open={!enrolling}
        title={employee.name}
        onClose={onClose}
        footer={
          <>
            <button className="btn" onClick={onClose}>Close</button>
            {canEdit && (
              <button className="btn primary" onClick={onEdit}>Edit basic details</button>
            )}
          </>
        }
      >
        {/* Profile header */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 14,
            background: 'var(--brandSoft)', color: 'var(--brand)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: 'Fraunces, Georgia, serif',
            fontSize: 22, fontWeight: 600, letterSpacing: -0.5,
          }}>
            {employee.name.split(' ').map(s => s[0]).slice(0, 2).join('').toUpperCase()}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, color: 'var(--inkMuted)', fontFamily: 'JetBrains Mono, Menlo, monospace' }}>
              {employee.id}
            </div>
            <div style={{ fontSize: 17, fontWeight: 600, color: 'var(--ink)' }}>
              {employee.name}
            </div>
            <div style={{ fontSize: 12.5, color: 'var(--inkMuted)', marginTop: 2 }}>
              {employee.role || '—'} · {sectionLabel}
            </div>
          </div>
          <span className={`status-pill ${employee.is_active ? 'present' : 'absent'}`}>
            {employee.is_active ? 'Active' : 'Inactive'}
          </span>
        </div>

        {/* Quick facts grid */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12,
          padding: 14, background: 'var(--bg)',
          border: '1px solid var(--border)', borderRadius: 12, marginBottom: 14,
        }}>
          <DetailField label="Emp. code" value={employee.employee_code || '—'} mono />
          <DetailField label="Company" value={employee.company || '—'} />
          <DetailField label="User type" value={TYPE_LABEL[employee.user_type] || employee.user_type} />
          <DetailField label="Section" value={sectionLabel} />
          <DetailField label="Joined" value={fmtDate(employee.joined_date)} />
          <DetailField label="Phone" value={employee.phone || '—'} mono />
          <DetailField label="City / town" value={employee.city || '—'} />
        </div>

        {employee.user_type !== 'owner' && (
          <div style={{
            display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 12,
            padding: 14, background: 'var(--bg)',
            border: '1px solid var(--border)', borderRadius: 12, marginBottom: 14,
          }}>
            <DetailField
              label="Salary type"
              value={employee.salary_type === 'esi_pf' ? 'ESI / PF'
                   : employee.salary_type === 'new_joined' ? 'New joined'
                   : '—'} />
            <DetailField
              label="Monthly salary"
              value={employee.monthly_salary != null
                ? '₹' + Number(employee.monthly_salary).toLocaleString('en-IN')
                : '—'} />
            {employee.salary_type === 'esi_pf' && (
              <>
                <DetailField label="HRA" value={employee.hra != null ? '₹' + Number(employee.hra).toLocaleString('en-IN') : '—'} />
                <DetailField label="W.A."   value={employee.wa != null ? '₹' + Number(employee.wa).toLocaleString('en-IN') : '—'} />
                <DetailField label="TMB a/c" value={employee.tmb_account_no || '—'} mono />
                <DetailField label="ESI no." value={employee.esi_no || '—'} mono />
                <DetailField label="EPF no." value={employee.epf_no || '—'} mono />
                <DetailField label="UAN no." value={employee.uan_no || '—'} mono />
              </>
            )}
          </div>
        )}

        {/* Face enrollment card */}
        <div style={{
          padding: 14, borderRadius: 12,
          background: faceCount >= 3 ? 'var(--brandSoft)' : (faceCount > 0 ? 'var(--warningSoft)' : 'var(--surfaceAlt)'),
          border: '1px solid ' + (faceCount >= 3 ? 'var(--brandSoft)' : (faceCount > 0 ? 'var(--warningSoft)' : 'var(--border)')),
          marginBottom: 14,
        }}>
          <div style={{
            fontSize: 11, fontWeight: 700, letterSpacing: 0.5, textTransform: 'uppercase',
            color: faceCount >= 3 ? 'var(--brand)' : (faceCount > 0 ? 'var(--warning)' : 'var(--inkMuted)'),
          }}>
            Face enrollment
          </div>
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 6,
          }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 600, color: 'var(--ink)' }}>
                {faceCount >= 3 ? 'Enrolled' : (faceCount > 0 ? 'Partial' : 'Not enrolled')}
              </div>
              <div style={{ fontSize: 12, color: 'var(--inkMuted)', marginTop: 2 }}>
                {faceCount} / 3 poses captured
              </div>
            </div>
            {canEdit && (
              <div style={{ display: 'flex', gap: 6 }}>
                <button className="btn primary" onClick={() => setEnrolling(true)}>
                  {faceCount >= 3 ? 'Update face' : 'Enroll face'}
                </button>
                {faceCount > 0 && (
                  <button className="btn danger" onClick={clearFace}>Clear</button>
                )}
              </div>
            )}
          </div>
        </div>

        {!canEdit && (
          <div style={{
            fontSize: 12, color: 'var(--inkMuted)',
            padding: 12, borderRadius: 10, background: 'var(--surfaceAlt)',
          }}>

};

// ──────────────────────────────────────────────────────────
// Webcam face enrollment — capture 3 poses and save embeddings.
// ──────────────────────────────────────────────────────────
const FaceEnrollModal = ({ employee, onClose, onDone }) => {
  const toast = useToast();
  const videoRef = React.useRef(null);
  const [modelsReady, setModelsReady] = useState(false);
  const [cameraErr, setCameraErr]     = useState(null);
  const [shots, setShots] = useState([null, null, null]);
  const [step, setStep]   = useState(0);
  const [busy, setBusy]   = useState(false);
  const [hint, setHint]   = useState('Loading face models…');
  const [saving, setSaving] = useState(false);

  const poses = [
    { key: 'front', label: 'Look straight at the camera' },
    { key: 'left',  label: 'Turn your head slightly left' },
    { key: 'right', label: 'Turn your head slightly right' },
  ];

  useEffect(() => {
    let stream = null, cancelled = false;
    (async () => {
      try {
        await window.loadFaceModels();
        if (cancelled) return;
        setModelsReady(true);
        setHint('Opening camera…');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
        }
        setHint('');
      } catch (err) {
        setCameraErr(err.name === 'NotAllowedError'
          ? 'Camera permission denied — enable it in browser settings.'
          : 'Could not open camera.');
      }
    })();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
    };
  }, []);

  const capture = async () => {
    if (!modelsReady || busy) return;
    setBusy(true);
    setHint('Detecting face…');
    try {
      const desc = await window.computeFaceDescriptor(videoRef.current);
      if (!desc) { setHint('No face detected — move closer'); return; }
      setShots(s => s.map((x, i) => i === step ? desc : x));
      setHint('');
      if (step < 2) setStep(step + 1);
    } finally { setBusy(false); }
  };

  const retake = (i) => {
    setShots(s => s.map((x, idx) => idx === i ? null : x));
    setStep(i);
  };

  const allCaptured = shots.every(s => s);

  const save = async () => {
    if (!allCaptured || saving) return;
    setSaving(true);
    try {
      // Replace existing embeddings for this employee — simplest upsert
      // path avoids stale old-pose data.
      await window.sb.from('face_embeddings').delete().eq('employee_id', employee.id);
      const { error } = await window.sb.from('face_embeddings').insert(
        shots.map((desc, i) => ({
          employee_id: employee.id,
          pose: poses[i].key,
          embedding: desc,
        }))
      );
      if (error) toast('Could not save face data');
      else onDone();
    } finally { setSaving(false); }
  };

  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ width: 'min(560px, 92vw)' }}>
        <div className="modal-head">
          <h2>Enroll face · {employee.name}</h2>
          <button className="close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div style={{
            fontSize: 12.5, color: 'var(--inkMuted)', marginBottom: 14,
          }}>
            Step {Math.min(step + 1, 3)} of 3 — {poses[Math.min(step, 2)].label}.
          </div>

          {/* Preview */}
          <div style={{
            position: 'relative', width: '100%', aspectRatio: '4 / 3',
            background: '#0B0D0E', borderRadius: 12, overflow: 'hidden',
            border: '1px solid var(--border)', marginBottom: 12,
          }}>
            <video ref={videoRef} autoPlay playsInline muted
              style={{
                position: 'absolute', inset: 0,
                width: '100%', height: '100%', objectFit: 'cover',
                transform: 'scaleX(-1)',
                opacity: cameraErr ? 0 : 1,
              }} />
            {(hint || cameraErr) && (
              <div style={{
                position: 'absolute', left: 12, bottom: 12, right: 12,
                background: 'rgba(11,13,14,0.75)', color: '#fff',
                padding: '8px 12px', borderRadius: 8, fontSize: 12, textAlign: 'center',
              }}>
                {cameraErr || hint}
              </div>
            )}
          </div>

          {/* Shot thumbnails */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
            {poses.map((p, i) => (
              <div key={p.key} onClick={() => shots[i] && retake(i)}
                style={{
                  aspectRatio: '1', borderRadius: 8,
                  background: shots[i] ? 'var(--brandSoft)' : 'var(--surfaceAlt)',
                  border: `1px solid ${shots[i] ? 'var(--brand)' : step === i ? 'var(--gold)' : 'var(--border)'}`,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  flexDirection: 'column', gap: 4,
                  cursor: shots[i] ? 'pointer' : 'default',
                }}>
                <div style={{
                  fontSize: 10.5, fontWeight: 700, letterSpacing: 0.6,
                  textTransform: 'uppercase',
                  color: shots[i] ? 'var(--brand)' : 'var(--inkMuted)',
                }}>
                  {p.key}
                </div>
                <div style={{
                  fontSize: 11, color: shots[i] ? 'var(--brand)' : 'var(--inkFaint)',
                }}>
                  {shots[i] ? '✓ Captured' : step === i ? 'Ready' : 'Pending'}
                </div>
              </div>
            ))}
          </div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose} disabled={saving}>Cancel</button>
          {!allCaptured ? (
            <button className="btn primary" onClick={capture}
              disabled={!modelsReady || busy || !!cameraErr}>
              {busy ? 'Detecting…' : (!modelsReady ? 'Loading…' : `Capture ${poses[Math.min(step, 2)].key}`)}
            </button>
          ) : (
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : 'Save face data'}
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Leaves page — approve / reject / delete with bulk actions.
// ──────────────────────────────────────────────────────────
const LEAVE_STATUS_TONE = {
  pending:  'warning',
  approved: 'brand',
  rejected: 'danger',
};

const fmtDate = (iso) => iso
  ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
  : '—';
const fmtDateTime = (iso) => iso
  ? new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
  : '—';

const LeavesPage = () => {
  const toast = useToast();
  const { can, role } = useContext(AppCtx);

  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [statusFilter, setStatusFilter] = useState('pending');
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(new Set());

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('leave_requests')
      .select('id, employee_id, type, days, from_date, reason, status, decided_by, decided_at, created_at, employees(name, role, section_id)')
      .order('created_at', { ascending: false });
    setItems(data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-leaves')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'leave_requests' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return items.filter(r => {
      if (statusFilter !== 'all' && r.status !== statusFilter) return false;
      if (q) {
        const name = (r.employees?.name || '').toLowerCase();
        const reason = (r.reason || '').toLowerCase();
        if (!name.includes(q) && !r.employee_id.toLowerCase().includes(q) && !reason.includes(q)) return false;
      }
      return true;
    });
  }, [items, statusFilter, search]);

  const counts = useMemo(() => ({
    total:    items.length,
    pending:  items.filter(i => i.status === 'pending').length,
    approved: items.filter(i => i.status === 'approved').length,
    rejected: items.filter(i => i.status === 'rejected').length,
    totalDays:items.filter(i => i.status === 'approved').reduce((sum, i) => sum + (i.days || 0), 0),
  }), [items]);

  useEffect(() => { setSelected(new Set()); }, [statusFilter, search]);

  const deciderId = role === 'owner' ? 'E000' : 'E001';

  const decide = async (id, action) => {
    if (!can('leaves', 'edit')) return;
    await window.sb.from('leave_requests')
      .update({ status: action, decided_by: deciderId, decided_at: new Date().toISOString() })
      .eq('id', id);
  };
  const del = async (id) => {
    if (!can('leaves', 'delete')) return;
    await window.sb.from('leave_requests').delete().eq('id', id);
  };

  const bulkDecide = async (action) => {
    if (!can('leaves', 'edit')) return;
    const ids = Array.from(selected);
    if (!ids.length) return;
    await window.sb.from('leave_requests')
      .update({ status: action, decided_by: deciderId, decided_at: new Date().toISOString() })
      .in('id', ids);
    toast(`${ids.length} leave request${ids.length === 1 ? '' : 's'} ${action}`);
    setSelected(new Set());
  };
  const bulkDelete = async () => {
    if (!can('leaves', 'delete')) return;
    const ids = Array.from(selected);
    if (!ids.length) return;
    if (!window.confirm(`Delete ${ids.length} leave request${ids.length === 1 ? '' : 's'}? This cannot be undone.`)) return;
    await window.sb.from('leave_requests').delete().in('id', ids);
    toast(`${ids.length} deleted`);
    setSelected(new Set());
  };

  const toggleRow = (id) => setSelected(s => {
    const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n;
  });
  const toggleAll = () => setSelected(s =>
    s.size === rows.length ? new Set() : new Set(rows.map(r => r.id)));

  const decidedByName = (id) => {
    if (id === 'E000') return 'Owner';
    if (id === 'E001') return 'HR';
    return id || '—';
  };

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
        <div className="stat late"><div className="k">Pending</div><div className="v">{counts.pending}</div></div>
        <div className="stat present"><div className="k">Approved</div><div className="v">{counts.approved}</div></div>
        <div className="stat absent"><div className="k">Rejected</div><div className="v">{counts.rejected}</div></div>
        <div className="stat leave"><div className="k">Days granted</div><div className="v">{counts.totalDays}</div></div>
      </div>

      <div className="toolbar">
        <div className="seg">
          {[
            { id: 'pending',  label: `Pending · ${counts.pending}` },
            { id: 'approved', label: `Approved · ${counts.approved}` },
            { id: 'rejected', label: `Rejected · ${counts.rejected}` },
            { id: 'all',      label: `All · ${counts.total}` },
          ].map(s => (
            <button key={s.id}
              className={statusFilter === s.id ? 'active' : ''}
              onClick={() => setStatusFilter(s.id)}>
              {s.label}
            </button>
          ))}
        </div>
        <input type="search" placeholder="Search name, ID, or reason…"
          value={search} onChange={e => setSearch(e.target.value)} />
        <div style={{ marginLeft: 'auto', fontSize: 12, color: 'var(--inkMuted)' }}>
          {loading ? 'Loading…' : `Showing ${rows.length}`}
        </div>
      </div>

      {selected.size > 0 && can('leaves', 'edit') && (
        <div className="bulk">
          <span>{selected.size} selected</span>
          <button className="btn" onClick={() => bulkDecide('approved')}>Approve all</button>
          <button className="btn" onClick={() => bulkDecide('rejected')}>Reject all</button>
          {can('leaves', 'delete') && (
            <button className="btn" onClick={bulkDelete}>Delete</button>
          )}
          <button className="btn" onClick={() => setSelected(new Set())} style={{ marginLeft: 'auto' }}>
            Deselect
          </button>
        </div>
      )}

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 36 }}>
                <input type="checkbox"
                  checked={rows.length > 0 && selected.size === rows.length}
                  onChange={toggleAll} />
              </th>
              <th style={{ width: 80 }}>ID</th>
              <th>Employee</th>
              <th>Section</th>
              <th>Type</th>
              <th style={{ width: 70 }}>Days</th>
              <th>From</th>
              <th>Reason</th>
              <th style={{ width: 100 }}>Status</th>
              <th style={{ width: 130 }}>Decided</th>
              <th style={{ width: 200 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={11} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No leave requests match.'}
                </td>
              </tr>
            )}
            {rows.map(r => (
              <tr key={r.id} className={selected.has(r.id) ? 'selected' : ''}>
                <td>
                  <input type="checkbox"
                    checked={selected.has(r.id)}
                    onChange={() => toggleRow(r.id)} />
                </td>
                <td className="id">{r.employee_id}</td>
                <td className="name">
                  {r.employees?.name || r.employee_id}
                  <div style={{ fontSize: 11, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 2 }}>
                    {r.employees?.role || ''}
                  </div>
                </td>
                <td>{SECTION_META[r.employees?.section_id]?.label || <span className="muted">—</span>}</td>
                <td>{r.type}</td>
                <td>{r.days}</td>
                <td className="muted">{fmtDate(r.from_date)}</td>
                <td style={{ maxWidth: 280 }}>
                  <div style={{
                    overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                  }} title={r.reason}>{r.reason || '—'}</div>
                </td>
                <td>
                  <span className={`status-pill ${r.status === 'pending' ? 'late' : r.status === 'approved' ? 'present' : 'absent'}`}>
                    {r.status}
                  </span>
                </td>
                <td className="muted" style={{ fontSize: 11 }}>
                  {r.decided_at
                    ? <>{decidedByName(r.decided_by)}<br/>{fmtDateTime(r.decided_at)}</>
                    : '—'}
                </td>
                <td>
                  {r.status === 'pending' && can('leaves', 'edit') && (
                    <>
                      <button className="btn primary" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                        onClick={() => decide(r.id, 'approved')}>Approve</button>
                      <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                        onClick={() => decide(r.id, 'rejected')}>Reject</button>
                    </>
                  )}
                  {r.status !== 'pending' && can('leaves', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => decide(r.id, 'pending')}>Re-open</button>
                  )}
                  {can('leaves', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => {
                        if (!window.confirm('Delete this leave request?')) return;
                        del(r.id);
                      }}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Simple modal primitive (used by Announcements and later CRUD modules)
// ──────────────────────────────────────────────────────────
const Modal = ({ open, title, onClose, children, footer }) => {
  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="modal-back" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="close" onClick={onClose} aria-label="Close">×</button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>
  );
};

const AnnouncementsPage = () => {

  const { can, role } = useContext(AppCtx);

  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [pinFilter, setPinFilter] = useState('all');
  const [search, setSearch] = useState('');

  const [editing, setEditing] = useState(null); // null | 'new' | row

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('announcements')
      .select('*')
      .order('pinned', { ascending: false })
      .order('created_at', { ascending: false });
    setItems(data || []);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('dash-announcements')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'announcements' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return items.filter(a => {
      if (pinFilter === 'pinned' && !a.pinned) return false;
      if (pinFilter === 'unpinned' && a.pinned) return false;
      if (q && !a.title.toLowerCase().includes(q) && !(a.body || '').toLowerCase().includes(q)
           && !(a.posted_by || '').toLowerCase().includes(q)) return false;
      return true;
    });

  const counts = useMemo(() => {
    const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    return {
      total:  items.length,
      pinned: items.filter(i => i.pinned).length,
      week:   items.filter(i => new Date(i.created_at).getTime() > weekAgo).length,
    };
  }, [items]);

  const togglePin = async (row) => {
    if (!can('announcements', 'edit')) return;
    await window.sb.from('announcements')
      .update({ pinned: !row.pinned }).eq('id', row.id);
  };

    if (!can('announcements', 'delete')) return;

  });

  const close = () => setEditing(null);

    if (!editing) return;
    const payload = {
      title: (editing.title || '').trim(),
      body:  (editing.body || '').trim() || null,
      posted_by: editing.posted_by || 'HR',
      pinned: !!editing.pinned,
    };

    if (editing.id) {
      await window.sb.from('announcements').update(payload).eq('id', editing.id);
      toast('Updated');
    } else {
      await window.sb.from('announcements').insert(payload);
      toast('Posted');
    }
    close();

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>

        <div className="stat present"><div className="k">This week</div><div className="v">{counts.week}</div></div>

      </div>

        <div className="seg">

            { id: 'all',      label: `All · ${counts.total}` },

            style={{ marginLeft: 'auto' }}>

        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 70 }}>Pin</th>
              <th>Title</th>
              <th style={{ width: 120 }}>Posted by</th>
              <th style={{ width: 180 }}>Posted</th>
              <th style={{ width: 200 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={5} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No announcements.'}
                </td>
              </tr>
            )}
            {rows.map(row => (
              <tr key={row.id}>
                <td>
                  <button
                    className="btn"
                    disabled={!can('announcements', 'edit')}
                    onClick={() => togglePin(row)}
                    style={{
                      height: 28, padding: '0 10px',
                      background: row.pinned ? 'var(--goldSoft)' : 'var(--surfaceAlt)',
                      borderColor: row.pinned ? 'var(--goldSoft)' : 'var(--border)',
                      color: row.pinned ? 'var(--gold)' : 'var(--inkMuted)',
                    }}
                    title={row.pinned ? 'Unpin' : 'Pin to top'}>
                    {row.pinned ? '★ Pinned' : '☆ Pin'}
                  </button>
                </td>
                <td className="name">
                  {row.title}
                  {row.body && (
                    <div style={{ fontSize: 12, color: 'var(--inkMuted)', fontWeight: 400, marginTop: 3, maxWidth: 540, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                      {row.body}
                    </div>
                  )}
                </td>
                <td>
                  <span className="status-pill" style={{
                    background: row.posted_by === 'Owner' ? 'var(--brandSoft)' : 'var(--infoSoft)',
                    color:      row.posted_by === 'Owner' ? 'var(--brand)' : 'var(--info)',
                  }}>{row.posted_by}</span>
                </td>
                <td className="muted" style={{ fontSize: 12 }}>
                  {fmtDateTime(row.created_at)}
                </td>
                <td>
                  {can('announcements', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(row)}>Edit</button>
                  )}
                  {can('announcements', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => del(row.id)}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <Modal
        open={!!editing}
        title={editing?.id ? 'Edit announcement' : 'New announcement'}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close}>Cancel</button>
            <button className="btn primary" onClick={save}>
              {editing?.id ? 'Save changes' : 'Post announcement'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row">
              <label>Title</label>
              <input
                autoFocus
                value={editing.title}
                onChange={e => setEditing({ ...editing, title: e.target.value })}
                placeholder="e.g. Tamil New Year holiday — 14 April, showroom closed"
              />
            </div>
            <div className="field-row">
              <label>Body (optional)</label>
              <textarea
                value={editing.body || ''}
                onChange={e => setEditing({ ...editing, body: e.target.value })}
                placeholder="Longer details, instructions, what staff should do…"
              />
            </div>
            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
              <div>
                <label>Posted by</label>
                <select
                  value={editing.posted_by}
                  onChange={e => setEditing({ ...editing, posted_by: e.target.value })}>
                  <option value="Owner">Owner</option>
                  <option value="HR">HR</option>
                </select>
              </div>
              <div>
                <label>Pin to top</label>
                <label className="checkbox-row" style={{ cursor: 'pointer' }}>
                  <input type="checkbox"
                    checked={!!editing.pinned}
                    onChange={e => setEditing({ ...editing, pinned: e.target.checked })} />
                  <div>
                    <div className="label-text">{editing.pinned ? 'Pinned' : 'Normal'}</div>
                    <div className="sub">Pinned notices appear first everywhere.</div>
                  </div>
                </label>
              </div>
            </div>
          </>
        )}
      </Modal>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Tasks management — Owner checklist + per-staff tasks per day.
// ──────────────────────────────────────────────────────────
const TasksPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);

  const [date, setDate]     = useState(() => fmtDateISO(new Date()));
  const [scope, setScope]   = useState('owner'); // 'owner' | 'staff'
  const [assignee, setAssignee] = useState('all');
  const [search, setSearch] = useState('');

  const [tasks, setTasks]   = useState([]);
  const [loading, setLoading] = useState(true);
  const { rows: employees } = useEmployees();

  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);
  const [copying, setCopying] = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('tasks')
      .select('id, scope, assignee_id, label, owner_label, done, priority, sort_order, due_date')
      .eq('due_date', date)
      .order('sort_order');
    setTasks(data || []);
    setLoading(false);
  }, [date]);

  useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel(`dash-tasks-${date}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'tasks', filter: `due_date=eq.${date}` },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, date]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return tasks.filter(t => {
      if (t.scope !== scope) return false;
      if (scope === 'staff' && assignee !== 'all' && t.assignee_id !== assignee) return false;
      if (q && !t.label.toLowerCase().includes(q) &&
              !(t.owner_label || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }, [tasks, scope, assignee, search]);

  const counts = useMemo(() => {
    const inScope = tasks.filter(t => t.scope === scope);
    const done = inScope.filter(t => t.done).length;
    return {
      total:  inScope.length,
      done,
      pending: inScope.length - done,
      pct: inScope.length ? Math.round((done / inScope.length) * 100) : 0,
      priority: inScope.filter(t => t.priority && !t.done).length,
    };
  }, [tasks, scope]);

  const empById = useMemo(() => {
    const m = {};
    employees.forEach(e => { m[e.id] = e; });
    return m;
  }, [employees]);

  const staffEmployees = useMemo(() =>
    employees.filter(e => e.user_type === 'staff' && e.is_active)
      .sort((a, b) => a.name.localeCompare(b.name))
  , [employees]);

  const toggleDone = async (row) => {
    if (!can('tasks', 'edit')) return;
    await window.sb.from('tasks').update({ done: !row.done }).eq('id', row.id);
  };

  const startNew = () => {
    const maxOrder = Math.max(0, ...tasks.filter(t => t.scope === scope).map(t => t.sort_order || 0));
    setEditing({
      id: null, scope, assignee_id: scope === 'staff' ? (assignee !== 'all' ? assignee : 'E003') : null,
      label: '', owner_label: '', priority: false, sort_order: maxOrder + 1,
      due_date: date, done: false, _new: true,
    });
  };
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.label.trim()) { toast('Label is required'); return; }
    if (editing.scope === 'staff' && !editing.assignee_id) { toast('Assignee is required for staff tasks'); return; }
    setSaving(true);
    try {
      const payload = {
        scope: editing.scope,
        assignee_id: editing.scope === 'staff' ? editing.assignee_id : null,
        label: editing.label.trim(),
        owner_label: editing.scope === 'owner' ? (editing.owner_label || '').trim() || null : null,
        priority: !!editing.priority,
        sort_order: parseInt(editing.sort_order, 10) || 0,
        due_date: editing.due_date,
      };
      if (editing._new) {
        await window.sb.from('tasks').insert(payload);
        toast('Task added');
      } else {
        await window.sb.from('tasks').update(payload).eq('id', editing.id);
        toast('Task updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const del = async (row) => {
    if (!can('tasks', 'delete')) return;
    if (!window.confirm(`Delete task “${row.label}”?`)) return;
    await window.sb.from('tasks').delete().eq('id', row.id);
    toast('Deleted');
  };

  const copyToDate = async () => {
    if (copying) return;
    const target = window.prompt(
      'Copy all of today\u2019s tasks (for the current scope) to which date?\n\nYYYY-MM-DD',
      fmtDateISO(new Date(new Date(date + 'T00:00:00').getTime() + 24 * 3600 * 1000))
    );
    if (!target) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(target)) { toast('Invalid date format'); return; }
    const sourceTasks = tasks.filter(t => t.scope === scope);
    if (!sourceTasks.length) { toast('Nothing to copy'); return; }
    setCopying(true);
    try {
      const payload = sourceTasks.map(t => ({
        scope: t.scope,
        assignee_id: t.assignee_id,
        label: t.label,
        owner_label: t.owner_label,
        priority: t.priority,
        sort_order: t.sort_order,
        due_date: target,
        done: false,
      }));
      await window.sb.from('tasks').insert(payload);
      toast(`Copied ${payload.length} tasks to ${target}`);
    } finally { setCopying(false); }
  };

  const dateObj = new Date(date + 'T00:00:00');
  const isToday = date === fmtDateISO(new Date());

  return (
    <div>
      <div className="stat-strip">
        <div className="stat"><div className="k">Total</div><div className="v">{counts.total}</div></div>
        <div className="stat present"><div className="k">Done</div><div className="v">{counts.done}</div></div>
        <div className="stat late"><div className="k">Pending</div><div className="v">{counts.pending}</div></div>
        <div className="stat absent"><div className="k">Priority</div><div className="v">{counts.priority}</div></div>
        <div className="stat leave"><div className="k">Complete</div><div className="v">{counts.pct}%</div></div>
      </div>

      <div className="toolbar">
        <input type="date" value={date} onChange={e => setDate(e.target.value)}
          style={{ fontWeight: 600 }} />
        <button className="btn" onClick={() => setDate(fmtDateISO(new Date()))}
          disabled={isToday}>Today</button>

        <div className="seg">
          {[{ id: 'owner', label: 'Owner checklist' }, { id: 'staff', label: 'Staff tasks' }].map(s => (
            <button key={s.id}
              className={scope === s.id ? 'active' : ''}
              onClick={() => setScope(s.id)}>
              {s.label}
            </button>
          ))}
        </div>

        {scope === 'staff' && (
          <select value={assignee} onChange={e => setAssignee(e.target.value)}>
            <option value="all">All staff</option>
            {staffEmployees.map(e => (
              <option key={e.id} value={e.id}>{e.name} · {e.id}</option>
            ))}
          </select>
        )}

        <input type="search" placeholder="Search task…"
          value={search} onChange={e => setSearch(e.target.value)} />

        <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
          <button className="btn" onClick={copyToDate} disabled={!tasks.length || copying}
            title="Copy all tasks in this scope to another date">
            {copying ? 'Copying…' : 'Copy to date…'}
          </button>
          {can('tasks', 'create') && (
            <button className="btn primary" onClick={startNew}>+ New task</button>
          )}
        </div>
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th style={{ width: 60 }}>Done</th>
              <th style={{ width: 60 }}>Order</th>
              <th>Task</th>
              {scope === 'owner'
                ? <th style={{ width: 220 }}>Owner (label)</th>
                : <th style={{ width: 220 }}>Assigned to</th>}
              <th style={{ width: 80 }}>Priority</th>
              <th style={{ width: 190 }}>Actions</th>
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr>
                <td colSpan={6} style={{ textAlign: 'center', padding: 40, color: 'var(--inkMuted)' }}>
                  {loading ? 'Loading…' : 'No tasks for this date / scope.'}
                </td>
              </tr>
            )}
            {rows.map(r => (
              <tr key={r.id} style={r.done ? { opacity: 0.55 } : null}>
                <td>
                  <input type="checkbox"
                    checked={r.done}
                    onChange={() => toggleDone(r)}
                    disabled={!can('tasks', 'edit')} />
                </td>
                <td className="muted">{r.sort_order}</td>
                <td className="name" style={{
                  textDecoration: r.done ? 'line-through' : 'none',
                }}>{r.label}</td>
                <td className="muted">
                  {scope === 'owner'
                    ? (r.owner_label || '—')
                    : (empById[r.assignee_id]
                        ? `${empById[r.assignee_id].name} · ${r.assignee_id}`
                        : r.assignee_id)}
                </td>
                <td>
                  {r.priority
                    ? <span className="status-pill late">Priority</span>
                    : <span className="muted">—</span>}
                </td>
                <td>
                  {can('tasks', 'edit') && (
                    <button className="btn" style={{ height: 28, padding: '0 10px', marginRight: 6 }}
                      onClick={() => startEdit(r)}>Edit</button>
                  )}
                  {can('tasks', 'delete') && (
                    <button className="btn danger" style={{ height: 28, padding: '0 10px' }}
                      onClick={() => del(r)}>Delete</button>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <div style={{ marginTop: 10, fontSize: 11.5, color: 'var(--inkFaint)' }}>
        {dateObj.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
        {` · ${counts.total} tasks · ${counts.pct}% complete`}
      </div>

      <Modal
        open={!!editing}
        title={editing?._new
          ? `Add ${editing?.scope === 'owner' ? 'owner-checklist' : 'staff'} task`
          : 'Edit task'}
        onClose={close}
        footer={
          <>
            <button className="btn" onClick={close} disabled={saving}>Cancel</button>
            <button className="btn primary" onClick={save} disabled={saving}>
              {saving ? 'Saving…' : editing?._new ? 'Add task' : 'Save'}
            </button>
          </>
        }
      >
        {editing && (
          <>
            <div className="field-row">
              <label>Scope</label>
              <div className="seg" style={{ width: 'fit-content' }}>
                {[{ id: 'owner', label: 'Owner checklist' }, { id: 'staff', label: 'Staff task' }].map(s => (
                  <button key={s.id}
                    type="button"
                    className={editing.scope === s.id ? 'active' : ''}
                    onClick={() => setEditing({ ...editing, scope: s.id })}>
                    {s.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="field-row">
              <label>Task label</label>
              <input autoFocus
                value={editing.label}
                onChange={e => setEditing({ ...editing, label: e.target.value })}
                placeholder={editing.scope === 'owner'
                  ? 'e.g. Cash float verified at 6 counters'
                  : 'e.g. Greet bridal appointment — 11:30 AM'} />
            </div>

            {editing.scope === 'owner' ? (
              <div className="field-row">
                <label>Who's responsible? (optional)</label>
                <input
                  value={editing.owner_label || ''}
                  onChange={e => setEditing({ ...editing, owner_label: e.target.value })}
                  placeholder="e.g. Saranya (Cashier Lead)" />
              </div>
            ) : (
              <div className="field-row">
                <label>Assigned to</label>
                <select
                  value={editing.assignee_id || ''}
                  onChange={e => setEditing({ ...editing, assignee_id: e.target.value })}>
                  <option value="">— select employee —</option>
                  {staffEmployees.map(emp => (
                    <option key={emp.id} value={emp.id}>{emp.name} · {emp.id}</option>
                  ))}
                </select>
              </div>
            )}

            <div className="field-row" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
              <div>
                <label>Due date</label>
                <input type="date"
                  value={editing.due_date || ''}
                  onChange={e => setEditing({ ...editing, due_date: e.target.value })} />
              </div>
              <div>
                <label>Sort order</label>
                <input type="number"
                  value={editing.sort_order}
                  onChange={e => setEditing({ ...editing, sort_order: e.target.value })} />
              </div>
              <div>
                <label>Priority</label>
                <label className="checkbox-row" style={{ cursor: 'pointer' }}>
                  <input type="checkbox"
                    checked={!!editing.priority}
                    onChange={e => setEditing({ ...editing, priority: e.target.checked })} />
                  <div>
                    <div className="label-text">{editing.priority ? 'Priority' : 'Normal'}</div>
                    <div className="sub">Shown with a pill on the mobile app.</div>
                  </div>
                </label>
              </div>
            </div>
          </>
        )}
      </Modal>
    </div>
  );
};

// ──────────────────────────────────────────────────────────
// Visitors management — log, check-in/out, edit, delete.
// ──────────────────────────────────────────────────────────
const VisitorsPage = () => {
  const toast = useToast();
  const { can } = useContext(AppCtx);

  const [from, setFrom]   = useState(() => fmtDateISO(new Date()));
  const [to, setTo]       = useState(() => fmtDateISO(new Date()));
  const [status, setStatus] = useState('all');
  const [search, setSearch] = useState('');

  const [list, setList]   = useState([]);
  const [loading, setLoading] = useState(true);

  const [editing, setEditing] = useState(null);
  const [saving, setSaving]   = useState(false);

  const fetchAll = useCallback(async () => {
    if (!window.sb) return;
    const fromDT = new Date(from + 'T00:00:00').toISOString();
    const toDT   = new Date(to   + 'T23:59:59').toISOString();
    const { data } = await window.sb
      .from('visitors')
      .select('*')
      .gte('in_at', fromDT)
      .lte('in_at', toDT)
      .order('in_at', { ascending: false });
    setList(data || []);
    setLoading(false);
  }, [from, to]);

  useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel(`dash-visitors-${from}-${to}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'visitors' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, from, to]);

  const rows = useMemo(() => {
    const q = search.trim().toLowerCase();
    return list.filter(v => {
      if (status === 'in' && v.status !== 'in') return false;
      if (status === 'out' && v.status !== 'out') return false;
      if (q && !v.name.toLowerCase().includes(q) &&
              !(v.purpose || '').toLowerCase().includes(q) &&
              !(v.location || '').toLowerCase().includes(q)) return false;
      return true;
    });
  }, [list, status, search]);

  const counts = useMemo(() => {
    const today = fmtDateISO(new Date());
    const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    const nowIn = list.filter(v => v.status === 'in').length;
    const todayCount = list.filter(v => fmtDateISO(new Date(v.in_at)) === today).length;
    const weekCount  = list.filter(v => new Date(v.in_at).getTime() > weekAgo).length;
    return { nowIn, todayCount, weekCount, total: list.length };
  }, [list]);

  const startNew = () => setEditing({
    id: null, name: '', purpose: '', location: 'Reception',
    status: 'in', in_at: new Date().toISOString(), out_at: null,
    _new: true,
  });
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.name.trim()) { toast('Name is required'); return; }
    setSaving(true);
    try {
      const payload = {
        name: editing.name.trim(),
        purpose: (editing.purpose || '').trim() || null,
        location: (editing.location || '').trim() || null,
        status: editing.status,
        in_at: editing.in_at,
        out_at: editing.status === 'out' ? (editing.out_at || new Date().toISOString()) : null,
      };
      if (editing._new) {
        await window.sb.from('visitors').insert(payload);
        toast(`${payload.name} logged in`);
      } else {
        await window.sb.from('visitors').update(payload).eq('id', editing.id);
        toast('Updated');
      }
      close();
    } finally { setSaving(false); }
  };

  const checkOut = async (row) => {
    if (!can('visitors', 'edit')) return;
    await window.sb.from('visitors')
      .update({ status: 'out', out_at: new Date().toISOString() })
      .eq('id', row.id);
    toast(`${row.name} checked out`);
  };

  const checkIn = async (row) => {
    if (!can('visitors', 'edit')) return;
    await window.sb.from('visitors')
      .update({ status: 'in', out_at: null })
      .eq('id', row.id);
  };

  const del = async (row) => {
    if (!can('visitors', 'delete')) return;
    if (!window.confirm(`Delete visit log for ${row.name}?`)) return;
    await window.sb.from('visitors').delete().eq('id', row.id);
    toast('Deleted');
  };

  // Convert ISO to `datetime-local` input format (YYYY-MM-DDTHH:MM)
  const toLocalInput = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const fromLocalInput = (val) => val ? new Date(val).toISOString() : null;

  return (
    <div>
      <div className="stat-strip">
        <div className="stat present"><div className="k">Currently in</div><div className="v">{counts.nowIn}</div></div>
        <div className="stat"><div className="k">Today</div><div className="v">{counts.todayCount}</div></div>
        <div className="stat leave"><div className="k">Last 7 days</div><div className="v">{counts.weekCount}</div></div>
        <div className="stat"><div className="k">In range</div><div className="v">{counts.total}</div></div>
        <div className="stat"><div className="k">Showing</div><div className="v">{rows.length}</div></div>
      </div>

      <div className="toolbar">
        <span style={{ fontSize: 12, color: 'var(--inkMuted)' }}>From</span>
        <input type="date" value={from} onChange={e => setFrom(e.target.value)} />
        <span style={{ fontSize: 12, color: 'var(--inkMuted)' }}>to</span>
        <input type="date" value={to} onChange={e => setTo(e.target.value)} />
        <button className="btn" onClick={() => {
          const today = fmtDateISO(new Date());
          setFrom(today); setTo(today);
        }}>Today</button>
        <button className="btn" onClick={() => {
          const today = new Date();
          const weekAgo = new Date(today.getTime() - 6 * 24 * 3600 * 1000);
          setFrom(fmtDateISO(weekAgo)); setTo(fmtDateISO(today));
        }}>Last 7 days</button>

        <div className="seg">
          {[
            { id: 'all', label: 'All' },
            { id: 'in',  label: `In · ${list.filter(v => v.status === 'in').length}` },
            { id: 'out', label: `Out · ${list.filter(v => v.status === 'out').length}` },
          ].map(s => (
            <button key={s.id} className={status === s.id ? 'active' : ''} onClick={() => setStatus(s.id)}>
              {s.label}
            </button>
          ))}
        </div>

        <input type="search" placeholder="Search name, purpose, location…"
          value={search} onChange={e => setSearch(e.target.value)} />

        {can('visitors', 'create') && (
          <button className="btn primary" onClick={startNew} style={{ marginLeft: 'auto' }}>
            + Log visitor
          </button>
        )}
      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>
              <th>Name</th>
              <th>Purpose</th>
              <th style={{ width: 140 }}>Location</th>
              <th style={{ width: 130 }}>In at</th>
              <th style={{ width: 130 }}>Out at</th>
              <th style={{ width: 90 }}>Status</th>
              <th style={{ width: 240 }}>Actions</th>

  const startEdit = (row) => setEditing({ ...row, _new: false });

      name: editing.name.trim(),
      name_ta: (editing.name_ta || '').trim() || null,
      monogram: (editing.monogram || '').trim().toUpperCase().slice(0, 3),

    if (!payload.name) { toast('Name is required'); return; }
    if (!payload.monogram) { toast('Monogram is required'); return; }
    setSaving(true);
    try {
      if (editing._new) {
        const id = editing.id.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-');

          toast('Section added');
          close();

      } else {
        const { error } = await window.sb.from('sections').update(payload).eq('id', editing.id);

        else { toast('Saved'); close(); }
      }

  const move = async (row, delta) => {
    const idx = rows.findIndex(r => r.id === row.id);
    const other = rows[idx + delta];

    await Promise.all([

      window.sb.from('sections').update({ sort_order: row.sort_order }).eq('id', other.id),

        {!readOnly && can('sections', 'create') && (

      </div>

      <div className="table-wrap">
        <table className="data">
          <thead>
            <tr>

          <tbody>
            {rows.length === 0 && (

            {rows.map((r, idx) => (

                    width: 30, height: 30, borderRadius: 8,
