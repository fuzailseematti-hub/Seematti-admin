// ========== mount ==========

const W = (n) => window[n];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "en",
  "density": "cozy",
  "layout": "ring"
}/*EDITMODE-END*/;

// Tweaks panel wiring
window.addEventListener('message', (e) => {
  if (e.data?.type === '__activate_edit_mode') {
    document.getElementById('tweakPanel').classList.add('on');
  } else if (e.data?.type === '__deactivate_edit_mode') {
    document.getElementById('tweakPanel').classList.remove('on');
  }
});
window.parent.postMessage({type: '__edit_mode_available'}, '*');

document.querySelectorAll('.tweakPanel .seg').forEach(seg => {
  seg.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      seg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const key = seg.id.replace('tw-', '');
      const val = btn.dataset.v;
      window.__tweaks = window.__tweaks || {};
      window.__tweaks[key] = val;
      window.parent.postMessage({type: '__edit_mode_set_keys', edits: {[key]: val}}, '*');
      window.dispatchEvent(new CustomEvent('tweak-change', {detail: {key, val}}));
    });
  });
});

function RootApp() {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const h = () => setTick(t => t + 1);
    window.addEventListener('tweak-change', h);
    return () => window.removeEventListener('tweak-change', h);
  }, []);
  const tw = window.__tweaks || {};
  return <AppInner
    tick={tick}
    tweakDensity={tw.density || TWEAK_DEFAULTS.density}
    tweakLayout={tw.layout || TWEAK_DEFAULTS.layout}
    tweakLang={tw.lang}
  />;
}

function AppInner({ tick, tweakDensity, tweakLayout, tweakLang }) {
  const [lang, setLangState] = useState(tweakLang || TWEAK_DEFAULTS.lang);
  const [user, setUser] = useState(null);          // 'owner' | 'hr' | 'manager' | 'supervisor' | null
  const [userId, setUserId] = useState(null);      // employees.id of the signed-in person
  const [userAccess, setUserAccess] = useState(null); // user_access row for the signed-in person
  const [stack, setStack] = useState(['login']);
  const [tab, setTab] = useState('home');
  const [toastMsg, setToastMsg] = useState(null);

  useEffect(() => {
    if (tweakLang && tweakLang !== lang) setLangState(tweakLang);
  }, [tweakLang]);

  useEffect(() => {
    try {
      const saved = JSON.parse(localStorage.getItem('sundari-state') || '{}');
      if (saved.user)    setUser(saved.user);
      if (saved.userId)  setUserId(saved.userId);
      if (saved.stack)   setStack(saved.stack);
      if (saved.tab)     setTab(saved.tab);
      if (saved.lang && !tweakLang) setLangState(saved.lang);
    } catch {}
  }, []);
  useEffect(() => {
    localStorage.setItem('sundari-state', JSON.stringify({ user, userId, stack, tab, lang }));
  }, [user, userId, stack, tab, lang]);

  // Fetch the logged-in user's access row so downstream screens can scope
  // by section and check granular powers.
  useEffect(() => {
    if (!window.sb || !userId) { setUserAccess(null); return; }
    let cancelled = false;
    (async () => {
      const { data } = await window.sb
        .from('user_access')
        .select('*')
        .eq('employee_id', userId)
        .maybeSingle();
      if (!cancelled) setUserAccess(data || null);
    })();
    // Subscribe to changes so dashboard edits propagate live.
    const ch = window.sb.channel(`user-access-${userId}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'user_access', filter: `employee_id=eq.${userId}` },
        async () => {
          const { data } = await window.sb.from('user_access').select('*')
            .eq('employee_id', userId).maybeSingle();
          if (!cancelled) setUserAccess(data || null);
        })
      .subscribe();
    return () => { cancelled = true; window.sb.removeChannel(ch); };
  }, [userId]);

  const setLang = (l) => {
    setLangState(l);
    window.__tweaks = window.__tweaks || {};
    window.__tweaks.lang = l;
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: {lang: l}}, '*');
    document.querySelectorAll('#tw-lang button').forEach(b => {
      b.classList.toggle('active', b.dataset.v === l);
    });
  };

  const nav = {
    go: (name) => setStack(s => [...s, name]),
    back: () => setStack(s => s.length > 1 ? s.slice(0, -1) : s),
    reset: (name) => setStack([name]),
  };

  const toast = (msg) => {
    setToastMsg(msg);
    setTimeout(() => setToastMsg(null), 2400);
  };

  const current = stack[stack.length - 1];

  // Kiosk mode is sticky — if the 'kiosk' user ever lands on anything
  // other than the kiosk screen, force them back. Only the exit PIN
  // clears user=null which returns to login.
  useEffect(() => {
    if (user === 'kiosk' && current !== 'kiosk') {
      setStack(['kiosk']);
    }
  }, [user, current]);

  // Resolve all components from window at render-time
  const AppCtx = W('AppCtx');
  const IOSDevice = W('IOSDevice');
  const TabBar = W('TabBar');
  const Toast = W('Toast');

  if (!AppCtx || !IOSDevice || !TabBar || !Toast) {
    return <div style={{padding: 40, fontFamily: 'monospace', fontSize: 12}}>Loading components…</div>;
  }

  const makeScreen = (name) => {
    const Comp = W(name);
    return Comp ? React.createElement(Comp) : null;
  };

  const screens = {
    login:           makeScreen('LoginScreen'),
    ownerHome:       makeScreen('OwnerHomeScreen'),
    hrHome:          makeScreen('HRHomeScreen'),
    hrTools:         makeScreen('HRToolsScreen'),
    markAttendance:  makeScreen('MarkAttendanceScreen'),
    kiosk:           makeScreen('KioskScannerScreen'),
    enroll:          makeScreen('EnrollJoinerScreen'),
    staffHome:       makeScreen('StaffHomeScreen'),
    attendance:      makeScreen('AttendanceScreen'),
    leaves:          makeScreen('LeavesScreen'),
    applyLeave:      makeScreen('ApplyLeaveScreen'),
    tasks:           makeScreen('TasksScreen'),
    payslip:         makeScreen('PayslipScreen'),
    announcements:   makeScreen('AnnouncementsScreen'),
    visitors:        makeScreen('VisitorsScreen'),
    settings:        makeScreen('SettingsScreen'),
    checklist:       makeScreen('ChecklistScreen'),
    managerHome:     makeScreen('ManagerHomeScreen'),
    advances:        makeScreen('AdvancesScreen'),
  };

  const screenTitles = {
    login:          '01 Login',
    ownerHome:      '02 Owner Dashboard',
    staffHome:      '03 Employee Home',
    attendance:     '04 Attendance Roster',
    leaves:         '05 Leave Approvals',
    applyLeave:     '06 Apply Leave',
    tasks:          '07 Daily Checklist',
    payslip:        '08 Payslip',
    announcements:  '09 Announcements',
    visitors:       '10 Visitor Log',
    hrHome:         '11 HR Home',
    hrTools:        '11b HR Tools',
    markAttendance: '12 Mark Attendance',
    kiosk:          '13 Kiosk Scanner',
    enroll:         '14 Enroll Joiner',
    settings:       '15 Settings',
    checklist:      '16 Checklist',
    managerHome:    '17 Manager Home',
    advances:       '18 Advances',
  };

  const isHrLike = user === 'hr' || user === 'owner';
  const tabs = [
    { id: 'home',      icon: 'home',     label: lang === 'ta' ? 'முகப்பு' : 'Home' },
    ...(isHrLike ? [{ id: 'tools', icon: 'grid', label: lang === 'ta' ? 'கருவிகள்' : 'Tools' }] : []),
    { id: 'checklist', icon: 'check',    label: lang === 'ta' ? 'பட்டியல்' : 'Checklist' },
    { id: 'tasks',     icon: 'tasks',    label: lang === 'ta' ? 'பணிகள்' : 'Tasks' },
    { id: 'settings',  icon: 'settings', label: lang === 'ta' ? 'அமைப்பு' : 'Settings' },
  ];

  const handleTab = (id) => {
    setTab(id);
    if (id === 'home') {
      const homeMap = {
        owner: 'ownerHome',
        hr: 'hrHome',
        manager: 'managerHome',
        supervisor: 'managerHome',
        staff: 'staffHome',
      };
      nav.reset(homeMap[user] || 'ownerHome');
    }
    else if (id === 'tools')     nav.go('hrTools');
    else if (id === 'checklist') nav.go('checklist');
    else if (id === 'tasks')     nav.go('tasks');
    else if (id === 'settings')  nav.go('settings');
  };

  // Keep the bottom nav's active indicator in sync with the current
  // screen so jumping to a tools page from a link also highlights the
  // right tab.
  useEffect(() => {
    const map = {
      hrTools: 'tools',
      checklist: 'checklist',
      tasks: 'tasks',
      settings: 'settings',
    };
    const next = map[current];
    if (next && next !== tab) setTab(next);
    if (!next && tab !== 'home'
      && (current === 'ownerHome' || current === 'hrHome'
          || current === 'staffHome' || current === 'managerHome')) {
      setTab('home');
    }
  }, [current]);

  const showTabBar = current !== 'login' && current !== 'applyLeave'
    && current !== 'kiosk' && current !== 'enroll' && user && user !== 'kiosk';

  return (
    <AppCtx.Provider value={{
      lang, setLang, density: tweakDensity,
      user, setUser, userId, setUserId, userAccess,
      nav, toast, layout: tweakLayout,
    }}>
      <div className="stage" data-screen-label={screenTitles[current] || current}>
        <div className="sidePanel">
          <div>
            <div className="side-sub">Concept · Mobile app</div>
            <div className="side-title">Seemaatti<br/>Admin</div>
          </div>
          <div className="side-body">
            A concept for digitising daily operations at Seemaatti — a 3-floor saree, jewellery & readymades showroom in Mayiladuthurai. Two experiences in one app — owners get a command deck; every employee gets their own home.
          </div>

          <div className="screen-picker">
            <div className="role">Owner flow</div>
            {['login', 'ownerHome', 'attendance', 'leaves', 'tasks', 'announcements', 'visitors'].map(s => (
              <button key={s}
                className={current === s ? 'active' : ''}
                onClick={() => {
                  if (s === 'login') { setStack(['login']); setUser(null); }
                  else { setUser('owner'); setStack([s]); setTab('home'); }
                }}>
                {screenTitles[s]}
              </button>
            ))}
            <div className="role" style={{marginTop: 4}}>HR flow</div>
            {['hrHome', 'hrTools', 'markAttendance', 'kiosk', 'enroll'].map(s => (
              <button key={s}
                className={current === s ? 'active' : ''}
                onClick={() => { setUser('hr'); setStack([s]); setTab('home'); }}>
                {screenTitles[s]}
              </button>
            ))}
            <div className="role" style={{marginTop: 4}}>Employee flow</div>
            {['staffHome', 'applyLeave', 'payslip'].map(s => (
              <button key={s}
                className={current === s ? 'active' : ''}
                onClick={() => { setUser('staff'); setStack([s]); setTab('home'); }}>
                {screenTitles[s]}
              </button>
            ))}
          </div>

          <div style={{fontSize: 11, color: '#8A8278', lineHeight: 1.55, marginTop: 4}}>
            Tap any screen to jump to it. Toggle Tweaks (bottom-right) for English / தமிழ், density and dashboard layout variations.
          </div>
        </div>

        <IOSDevice width={390} height={844}>
          <div style={{
            position: 'relative', height: '100%', overflow: 'hidden',
            background: '#FAF8F5',
          }}>
            <div key={current} style={{
              height: '100%', overflow: 'auto',
              animation: 'fadeIn 220ms ease-out',
            }}>
              {screens[current]}
            </div>
            {showTabBar && (
              <TabBar tabs={tabs} active={tab} onChange={handleTab} />
            )}
            <Toast toast={toastMsg} />
          </div>
        </IOSDevice>
      </div>
    </AppCtx.Provider>
  );
}

// Wait for all external babel scripts to finish registering their window globals
const REQUIRED = [
  'LoginScreen','OwnerHomeScreen','StaffHomeScreen','AttendanceScreen',
  'LeavesScreen','ApplyLeaveScreen','TasksScreen','PayslipScreen',
  'AnnouncementsScreen','VisitorsScreen','HRHomeScreen','HRToolsScreen','MarkAttendanceScreen',
  'KioskScannerScreen','EnrollJoinerScreen','SettingsScreen','ChecklistScreen','ManagerHomeScreen','AdvancesScreen',
  'AppCtx','IOSDevice','TabBar','Toast','TOKENS','MOCK',
];
const mountWhenReady = (attempts = 0) => {
  const missing = REQUIRED.filter(k => typeof window[k] === 'undefined');
  if (missing.length === 0) {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RootApp />);
  } else if (attempts < 200) {
    setTimeout(() => mountWhenReady(attempts + 1), 30);
  } else {
    document.getElementById('root').innerHTML =
      '<div style="padding:40px;font-family:monospace;color:#8B2323">Failed to load: ' + missing.join(', ') + '</div>';
  }
};
mountWhenReady();

</script>

</body>
</html>
