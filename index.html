// Tasks / Checklist screen

const TasksScreen = () => {
  const { user, userId, userAccess, toast } = useApp();
  const T_ = window.TOKENS;

  // Only Owner + HR can assign tasks to other people. Managers / Supervisors
  // — even ones with can_manage_tasks (which gates the Checklist tab) —
  // can only create tasks for themselves on this screen.
  const canManage = user === 'owner' || user === 'hr';

  const today = new Date().toISOString().slice(0, 10);
  const [tasks, setTasks]     = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [mode, setMode]       = React.useState('mine'); // 'mine' | 'assigned' (admins only)

  // For admins: list of loginable users to assign tasks to.
  const [loginUsers, setLoginUsers] = React.useState([]);

  // Add/Edit sheet state
  const [editing, setEditing] = React.useState(null);
  const [saving, setSaving]   = React.useState(false);

  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    // Personal tasks use scope='personal' (new) and 'staff' (legacy).
    let q = window.sb.from('tasks')
      .select('id, scope, assignee_id, label, owner_label, done, priority, sort_order, due_date')
      .in('scope', ['personal', 'staff'])
      .eq('due_date', today)
      .order('sort_order');
    if (mode === 'mine') {
      q = userId ? q.eq('assignee_id', userId) : q.eq('assignee_id', '__none__');
    }
    const { data } = await q;
    setTasks(data || []);
    setLoading(false);
  }, [today, mode, userId]);

  React.useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel('mobile-tasks')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'tasks', filter: `due_date=eq.${today}` },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, today]);

  // Admins need the pool of loginable users for assignment.
  React.useEffect(() => {
    if (!canManage || !window.sb) return;
    let cancelled = false;
    (async () => {
      const { data } = await window.sb
        .from('user_access')
        .select('employee_id, employees(id, name, role, user_type, section_id)')
        .order('employee_id');
      if (!cancelled) {
        setLoginUsers((data || [])
          .filter(r => r.employees && r.employees.is_active !== false)
          .map(r => r.employees));
      }
    })();
    return () => { cancelled = true; };
  }, [canManage]);

  const loginUsersById = React.useMemo(() => {
    const m = {};
    loginUsers.forEach(u => { m[u.id] = u; });
    return m;
  }, [loginUsers]);

  const toggle = async (row) => {
    if (!window.sb) return;
    await window.sb.from('tasks').update({ done: !row.done }).eq('id', row.id);
  };

  const startNew = () => {
    const maxOrder = Math.max(0, ...tasks.map(t => t.sort_order || 0));
    setEditing({
      id: null, _new: true,
      label: '', assignee_id: userId || '',
      priority: false, sort_order: maxOrder + 1,
    });
  };
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.label.trim()) { toast('Label required'); return; }
    if (!editing.assignee_id) { toast('Pick an assignee'); return; }
    setSaving(true);
    try {
      const payload = {
        scope: 'personal',
        section_id: null,
        assignee_id: editing.assignee_id,
        label: editing.label.trim(),
        owner_label: null,
        priority: !!editing.priority,
        sort_order: parseInt(editing.sort_order, 10) || 0,
        due_date: today,
      };
      if (editing._new) {
        await window.sb.from('tasks').insert(payload);
        toast('Task added');
      } else {
        await window.sb.from('tasks').update(payload).eq('id', editing.id);
        toast('Saved');
      }
      close();
    } finally { setSaving(false); }
  };

  const del = async (row) => {
    if (!window.confirm(`Delete "${row.label}"?`)) return;
    await window.sb.from('tasks').delete().eq('id', row.id);
    toast('Deleted');
  };

  const doneCount  = tasks.filter(t => t.done).length;
  const totalCount = tasks.length;
  const pct = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

  return (
    <div style={{ background: T_.bg, minHeight: '100%', paddingBottom: 90 }}>
      {/* Header */}
      <div style={{ padding: 'var(--screen-top) 20px 0' }}>
        <div style={{
          fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase',
          color: T_.inkMuted, fontWeight: 600,
        }}>
          Today's tasks
        </div>
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif',
          fontSize: 28, fontWeight: 500, color: T_.ink,
          letterSpacing: -0.7, marginTop: 4, lineHeight: 1.15,
        }}>
          {doneCount} / {totalCount} done
          <span style={{
            fontFamily: 'Inter, sans-serif', fontSize: 14, fontWeight: 500,
            color: T_.inkMuted, marginLeft: 8,
          }}>· {pct}%</span>
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ padding: '14px 16px 0' }}>
        <div style={{
          height: 8, borderRadius: 4, background: T_.surfaceAlt, overflow: 'hidden',
        }}>
          <div style={{
            width: `${pct}%`, height: '100%',
            background: pct === 100 ? T_.success : T_.maroon,
            transition: 'width 300ms',
          }} />
        </div>
      </div>

      {/* Mine / All tasks segmented control for admins */}
      {canManage && (
        <div style={{ padding: '14px 16px 0' }}>
          <div style={{
            display: 'flex', gap: 6, padding: 4, borderRadius: 12,
            background: T_.surfaceAlt,
          }}>
            {[
              { id: 'mine',     label: 'Mine' },
              { id: 'assigned', label: 'All I\u2019ve assigned' },
            ].map(m => (
              <button key={m.id} onClick={() => setMode(m.id)}
                style={{
                  flex: 1, padding: '8px 4px', borderRadius: 8, border: 'none',
                  background: mode === m.id ? T_.surface : 'transparent',
                  color: mode === m.id ? T_.ink : T_.inkMuted,
                  fontSize: 12.5, fontWeight: 600,
                  fontFamily: 'inherit', cursor: 'pointer',
                  boxShadow: mode === m.id ? '0 1px 2px rgba(0,0,0,0.05)' : 'none',
                }}>{m.label}</button>
            ))}
          </div>
        </div>
      )}

      {/* Task list */}
      <div style={{ padding: '16px 16px 0' }}>
        {loading && (
          <div style={{ textAlign: 'center', color: T_.inkMuted, fontSize: 13, padding: 30 }}>
            Loading…
          </div>
        )}
        {!loading && tasks.length === 0 && (
          <div style={{
            background: T_.surface, border: `1px dashed ${T_.border}`,
            borderRadius: 14, padding: '30px 20px', textAlign: 'center',
          }}>
            <div style={{
              fontFamily: 'Fraunces, Georgia, serif', fontSize: 18,
              fontWeight: 500, color: T_.ink, marginBottom: 6,
            }}>No tasks yet</div>
            <div style={{ fontSize: 12.5, color: T_.inkMuted }}>
              {canManage
                ? 'Tap "New task" to assign one to yourself or your team.'
                : 'Nothing assigned to you today.'}
            </div>
          </div>
        )}
        {!loading && tasks.length > 0 && (
          <div style={{
            background: T_.surface, border: `1px solid ${T_.border}`, borderRadius: 16,
            overflow: 'hidden',
          }}>
            {tasks.map((row, i) => {
              const assignee = loginUsersById[row.assignee_id];
              const isMine   = row.assignee_id === userId;
              return (
                <div key={row.id} style={{
                  padding: '14px', display: 'flex', alignItems: 'flex-start', gap: 12,
                  borderBottom: i === tasks.length - 1 ? 'none' : `1px solid ${T_.borderSoft}`,
                  opacity: row.done ? 0.6 : 1,
                }}>
                  <button onClick={() => toggle(row)} style={{
                    width: 22, height: 22, borderRadius: 7, marginTop: 1,
                    background: row.done ? T_.success : 'transparent',
                    border: row.done ? 'none' : `1.5px solid ${T_.border}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', flexShrink: 0,
                  }}>
                    {row.done && <Icon name="check" size={14} color="#fff" strokeWidth={2.5} />}
                  </button>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{
                      fontSize: 13.5, color: row.done ? T_.inkMuted : T_.ink, fontWeight: 500,
                      textDecoration: row.done ? 'line-through' : 'none', lineHeight: 1.4,
                    }}>{row.label}</div>
                    {/* Show assignee only on the 'all assigned' view (admin) */}
                    {mode === 'assigned' && !isMine && assignee && (
                      <div style={{ fontSize: 11.5, color: T_.inkMuted, marginTop: 3 }}>
                        → {assignee.name}
                      </div>
                    )}
                  </div>
                  {row.priority && !row.done && (
                    <span style={{
                      fontSize: 10, fontWeight: 700, letterSpacing: 0.3, textTransform: 'uppercase',
                      background: T_.warningSoft, color: T_.warning,
                      padding: '3px 7px', borderRadius: 999, whiteSpace: 'nowrap',
                    }}>Priority</span>
                  )}
                  {(canManage || isMine) && (
                    <button onClick={() => startEdit(row)} style={{
                      background: 'none', border: 'none', cursor: 'pointer', padding: 4,
                      color: T_.inkFaint, flexShrink: 0,
                    }} title="Edit">
                      <Icon name="more" size={16} />
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Add button (anyone can add a task for themselves; admins can assign) */}
      <div style={{ padding: '14px 16px 20px' }}>
        <button onClick={startNew} style={{
          width: '100%', padding: 14, borderRadius: 14,
          background: T_.maroon, color: '#fff', border: 'none',
          fontSize: 14, fontWeight: 600, cursor: 'pointer',
          fontFamily: 'inherit',
          display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
          boxShadow: '0 6px 16px -6px rgba(14, 124, 58, 0.45)',
        }}>
          <Icon name="plus" size={16} />
          {canManage ? 'New task' : 'Add task for me'}
        </button>

      {/* Edit/Add sheet */}

        <div onClick={close} style={{
          position: 'absolute', inset: 0, background: 'rgba(11, 13, 14, 0.55)', zIndex: 100,
          display: 'flex', alignItems: 'flex-end',
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: '100%', background: T_.surface, borderRadius: '20px 20px 0 0',
            padding: 20, maxHeight: '80%', overflowY: 'auto',
          }}>
            <div style={{
              fontFamily: 'Fraunces, Georgia, serif', fontSize: 20,
              fontWeight: 500, color: T_.ink, letterSpacing: -0.3, marginBottom: 14,
            }}>{editing._new ? 'New task' : 'Edit task'}</div>

            <FieldLabel>What needs to be done?</FieldLabel>
            <textarea value={editing.label} autoFocus
              onChange={e => setEditing({ ...editing, label: e.target.value })}
              placeholder="e.g. Greet bridal appointment at 11:30 AM"
              style={{
                width: '100%', minHeight: 70, padding: 12, borderRadius: 12,
                background: T_.bg, border: `1px solid ${T_.border}`,
                fontSize: 14, fontFamily: 'inherit', color: T_.ink,
                boxSizing: 'border-box', resize: 'vertical', outline: 'none',
                marginBottom: 14,
              }} />

            <FieldLabel>Assign to</FieldLabel>
            {canManage ? (
              <select value={editing.assignee_id || ''}
                onChange={e => setEditing({ ...editing, assignee_id: e.target.value })}
                style={{ ...enrollInputStyle(T_), cursor: 'pointer' }}>
                <option value="">— pick someone —</option>
                {loginUsers.map(u => (
                  <option key={u.id} value={u.id}>
                    {u.name}{u.id === userId ? ' (me)' : ''}
                  </option>
                ))}
              </select>
            ) : (
              <input readOnly
                value="Myself"
                style={{ ...enrollInputStyle(T_), background: T_.surfaceAlt }} />
            )}

            <div style={{ height: 14 }} />

            <label style={{
              display: 'flex', alignItems: 'center', gap: 10,
              background: T_.bg, border: `1px solid ${T_.border}`,
              padding: 12, borderRadius: 12, cursor: 'pointer',

              <input type="checkbox"

                onChange={e => setEditing({ ...editing, priority: e.target.checked })} />

            </label>

            <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
              {!editing._new && (canManage || editing.assignee_id === userId) && (
                <button onClick={() => { del(editing); close(); }} style={{
                  padding: '12px 16px', borderRadius: 12,
                  background: T_.surface, border: `1px solid ${T_.border}`,
                  color: T_.danger, fontSize: 13, fontWeight: 600,
                  fontFamily: 'inherit', cursor: 'pointer',
                }}>Delete</button>
              )}
              <button onClick={close} style={{
                flex: 1, padding: '12px 16px', borderRadius: 12,
                background: T_.surface, border: `1px solid ${T_.border}`,
                color: T_.ink, fontSize: 13, fontWeight: 600,
                fontFamily: 'inherit', cursor: 'pointer',
              }}>Cancel</button>
              <button onClick={save} disabled={saving} style={{
                flex: 1.2, padding: '12px 16px', borderRadius: 12,

                fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
                cursor: saving ? 'not-allowed' : 'pointer',
                boxShadow: '0 6px 16px -6px rgba(14, 124, 58, 0.45)',
              }}>{saving ? 'Saving…' : editing._new ? 'Add' : 'Save'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const TaskRow = ({ task, last, onToggle }) => {
  const T_ = window.TOKENS;
  return (
    <div style={{
      padding: '14px', display: 'flex', alignItems: 'flex-start', gap: 12,
      borderBottom: last ? 'none' : `1px solid ${T_.borderSoft}`,

// Manager / Supervisor Home — focused on what they actually do:

const ManagerHomeScreen = () => {
  const { nav, user, userId, userAccess, setLang, lang } = useApp();
  const T_ = window.TOKENS;
  const M = window.MOCK;

  const hasAll  = !!(userAccess && userAccess.all_sections);
  const allowed = hasAll ? null : (userAccess?.section_ids || []);

  // Attendance + sections
  const live = window.useLiveAttendance ? window.useLiveAttendance() : { attendance: null, sections: null };
  const scopedSections = (live.sections || []).filter(s => hasAll || allowed.includes(s.id));
  const totals = scopedSections.reduce((acc, s) => ({
    total:   acc.total   + (s.staff   || 0),
    present: acc.present + (s.present || 0),
    late:    acc.late    + (s.late    || 0),
    absent:  acc.absent  + (s.absent  || 0),
    onLeave: acc.onLeave + (s.onLeave || 0),
  }), { total: 0, present: 0, late: 0, absent: 0, onLeave: 0 });
  const marked = totals.present + totals.late + totals.absent + totals.onLeave;
  const unmarked = Math.max(0, totals.total - marked);
  const pct = totals.total ? Math.round((totals.present / totals.total) * 100) : 0;

  // Today's checklist progress (scoped to the user's sections + company-wide)
  const today = new Date().toISOString().slice(0, 10);
  const [chk, setChk]   = React.useState({ total: 0, done: 0 });
  const [tsk, setTsk]   = React.useState({ total: 0, done: 0 });

  React.useEffect(() => {
    if (!window.sb) return;
    let cancelled = false;
    const refresh = async () => {
      const { data: cData } = await window.sb.from('tasks')
        .select('id, done, section_id')
        .in('scope', ['checklist', 'owner'])
        .eq('due_date', today);
      const checklistRows = (cData || []).filter(t =>
        hasAll || t.section_id === null || (allowed || []).includes(t.section_id)
      );
      if (!cancelled) setChk({
        total: checklistRows.length,
        done:  checklistRows.filter(r => r.done).length,
      });

      if (userId) {
        const { data: tData } = await window.sb.from('tasks')
          .select('id, done')
          .in('scope', ['personal', 'staff'])
          .eq('due_date', today)
          .eq('assignee_id', userId);
        if (!cancelled) setTsk({
          total: (tData || []).length,
          done:  (tData || []).filter(r => r.done).length,
        });
      }
    };
    refresh();
    const ch = window.sb.channel('mgr-home-tasks')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'tasks', filter: `due_date=eq.${today}` },
        () => refresh())
      .subscribe();
    return () => { cancelled = true; window.sb.removeChannel(ch); };
  }, [today, userId, hasAll, allowed ? allowed.join(',') : '']);

  // Latest announcements (always global)

    ? window.useLiveAnnouncements()
    : { items: [] };

    ? window.useLiveStaffEmployee(userId || 'E001')

  const firstName = (me?.name || 'there').split(' ')[0];
  const roleLabel = user === 'manager' ? 'Manager' : 'Supervisor';

    ? 'All sections'
    : (allowed && allowed.length
        ? allowed.map(id => SECTION_LABEL[id] || id).join(' · ')
        : 'No sections assigned');
  const hour = new Date().getHours();
  const greet = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

  return (
    <div style={{ background: T_.bg, paddingBottom: 90 }}>
      {/* Header */}
      <div style={{ padding: 'var(--screen-top) 20px 0' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>

            <img src={LOGO_SRC} alt="Seemaatti" style={{ height: 30, width: 'auto', display: 'block' }} />
            <div>
              <div style={{ fontSize: 10, color: T_.inkFaint, lineHeight: 1, letterSpacing: 0.6, textTransform: 'uppercase', fontWeight: 700 }}>
                {roleLabel}
              </div>
              <div style={{ fontSize: 11, color: T_.inkMuted, marginTop: 2 }}>
                {new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })}
              </div>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <IconBtn name="bell" onClick={() => nav.go('announcements')} badge={null} />
          </div>
        </div>

        {/* Greeting */}
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif',
          fontSize: 26, fontWeight: 500, color: T_.ink,
          letterSpacing: -0.5, lineHeight: 1.2,
        }}>
          {greet}, <span style={{ color: T_.maroon }}>{firstName}</span>.
        </div>
        <div style={{ fontSize: 12.5, color: T_.inkMuted, marginTop: 6 }}>
          {scopeChip}
        </div>
      </div>

      {/* Today's attendance snapshot */}
      <div style={{ padding: '18px 16px 0' }}>
        <div style={{
          background: T_.surface, border: `1px solid ${T_.border}`, borderRadius: 18,
          padding: 18,
        }}>
          <div style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14,
          }}>
            <div>
              <div style={{
                fontSize: 10.5, fontWeight: 700, letterSpacing: 0.6,
                textTransform: 'uppercase', color: T_.inkMuted,
              }}>My team today</div>
              <div style={{
                fontFamily: 'Fraunces, Georgia, serif',
                fontSize: 28, fontWeight: 600, color: T_.ink, letterSpacing: -0.6,
                marginTop: 2, lineHeight: 1,
              }}>
                {totals.present}<span style={{ color: T_.inkMuted, fontSize: 16 }}> / {totals.total}</span>
              </div>
              <div style={{ fontSize: 12, color: T_.inkMuted, marginTop: 4 }}>
                {pct}% present
              </div>
            </div>
            <AttendanceRing pct={pct} size={68} />

          }}>
            <ManagerStat label="Late"     value={totals.late}    color={T_.warning} />
            <ManagerStat label="Absent"   value={totals.absent}  color={T_.danger} />
            <ManagerStat label="Leave"    value={totals.onLeave} color={T_.info} />
            <ManagerStat label="Unmarked" value={unmarked}       color={T_.inkMuted} />

                    </span>
                  </div>

              ))}
            </div>
          )}

          <button onClick={() => nav.go('attendance')} style={{
            marginTop: 14, width: '100%', padding: '10px 14px',

      <div style={{ padding: '14px 16px 0', display: 'flex', gap: 10 }}>

          <Icon name="suitcase" size={16} color={T_.maroon} />
          Apply for leave
        </button>
        <button onClick={() => nav.go('leaves')} style={{
          flex: 1, padding: '14px',

        overflow: 'hidden', marginTop: 10,

      <div style={{ fontSize: 11.5, color: T_.inkMuted, marginTop: 8 }}>
        {subtitle}
      </div>

  );
};

};

// ========== components/screen-kiosk-scanner.jsx ==========
// Face-recognition attendance kiosk — runs on a wall-mounted tablet at
// the staff entrance. Portrait, bilingual, silent confirmation, auto
// clock-in / clock-out based on whether the person is already clocked in today.
//
// Prototype note: camera feed is SIMULATED. A real build would use
// face-api.js (on-device) for detection + embedding match against
// enrolled staff. Here we rotate through a fake queue so HR can feel
// the flow.

const KioskScannerScreen = () => {
  const { nav, setUser, setUserId } = useApp();

  const [clockedIn, setClockedIn] = React.useState(new Set());
  const [recent, setRecent]       = React.useState([]);
  const [phase, setPhase]         = React.useState('idle'); // idle | detecting | matching | matched | unknown
  const [current, setCurrent]     = React.useState(null);
  const [showExitPrompt, setShowExitPrompt] = React.useState(false);

  // Live runtime state
  const videoRef   = React.useRef(null);
  const [cameraReady, setCameraReady]   = React.useState(false);
  const [modelsReady, setModelsReady]   = React.useState(false);
  const [cameraErr, setCameraErr]       = React.useState(null);
  const [facingMode, setFacingMode]     = React.useState('user'); // 'user' | 'environment'
  const [totalStaff, setTotalStaff]     = React.useState(0);
  const [faces, setFaces] = React.useState([]);   // [{employee_id, pose, embedding, employees: {name, role, section_id}}]
  const [threshold, setThreshold]       = React.useState(0.55);
  const [lateCutoff, setLateCutoff]     = React.useState('10:00');

  // Cooldown so the same face doesn't re-trigger instantly.
  // Per-employee cooldown so the same face staying in frame doesn't
  // re-trigger clock in/out. Other faces can still match in parallel.
  const MATCH_COOLDOWN_MS = 30000;
  const lastMatchMap = React.useRef({}); // { employeeId: timestamp }

  // Queue of fake matches for the Simulate button (keeps the demo usable
  // even without enrolled faces).
  const queue = React.useRef([
    { id: 'E004', name: 'Deepa S.',     section: 'Silk',   role: 'Sales Associate', confidence: 0.94 },
    { id: 'E015', name: 'Divya P.',     section: 'Cotton', role: 'Trainee',         confidence: 0.91 },
    { id: 'E008', name: 'Anitha R.',    section: 'Silk',   role: 'Sales Associate', confidence: 0.96 },
    { id: 'E010', name: 'Murali T.',    section: 'Dhoti',  role: 'Packer',          confidence: 0.89 },
    { id: 'E006', name: 'Meena S.',     section: 'Silk',   role: 'Sales Associate', confidence: 0.97 },
    { id: 'E014', name: 'Shanmugam R.', section: 'Dhoti',  role: 'Packer',          confidence: 0.92 },
  ]);
  const queueIdx = React.useRef(0);

  const [now, setNow] = React.useState(new Date());
  React.useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);

  const [pulse, setPulse] = React.useState(0);
  React.useEffect(() => {
    const t = setInterval(() => setPulse(p => (p + 1) % 100), 40);
    return () => clearInterval(t);
  }, []);

  // Load face-api models + open the webcam. Re-runs when the user
  // flips between front/back camera.
  React.useEffect(() => {
    let stream = null;
    let cancelled = false;
    setCameraReady(false);
    setCameraErr(null);
    (async () => {
      try {
        await window.loadFaceModels();
        if (cancelled) return;
        setModelsReady(true);
        // Try the requested facing mode; fall back to any camera so the
        // kiosk still works on devices with a single camera.
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false,
          });
        } catch (e) {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false,
          });
        }
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
        }
        setCameraReady(true);
      } catch (err) {
        console.error(err);
        setCameraErr(err.name === 'NotAllowedError'
          ? 'Camera permission denied — enable it in Settings.'
          : 'Could not open camera.');
      }
    })();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
    };
  }, [facingMode]);

  // Pull today's clocked-in set and recent scans from the DB on mount
  // and keep them fresh via the realtime subscription.
  React.useEffect(() => {
    if (!window.sb) return;
    const today = new Date().toISOString().slice(0, 10);
    const fetchLive = async () => {
      const { data } = await window.sb
        .from('attendance')
        .select('employee_id, status, punch_in_time, punch_out_time, updated_at, employees(name, section_id)')
        .eq('date', today)
        .in('status', ['present','late'])
        .order('updated_at', { ascending: false });
      const rows = data || [];
      const inSet = new Set(rows.filter(r => !r.punch_out_time).map(r => r.employee_id));
      setClockedIn(inSet);
      setRecent(rows.slice(0, 6).map(r => ({
        id:      r.employee_id,
        name:    r.employees?.name || r.employee_id,
        section: SECTION_LABEL[r.employees?.section_id] || r.employees?.section_id || '—',
        dir:     r.punch_out_time ? 'out' : 'in',
        time:    fmtTime(r.punch_out_time || r.punch_in_time) || '',
      })));
    };
    fetchLive();
    const channel = window.sb
      .channel('kiosk-live')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'attendance' },
        () => { fetchLive(); })
      .subscribe();
    return () => { window.sb.removeChannel(channel); };
  }, []);

  // Load enrolled face embeddings and settings (+ staff count for the tally).
  React.useEffect(() => {
    if (!window.sb) return;
    const fetchFaces = async () => {
      const { data } = await window.sb
        .from('face_embeddings')
        .select('employee_id, pose, embedding, employees(name, role, section_id, is_active)');
      // Only keep active staff.
      const active = (data || []).filter(r => r.employees?.is_active !== false);
      setFaces(active);
    };
    const fetchMeta = async () => {
      const [{ count }, { data: set }] = await Promise.all([
        window.sb.from('employees').select('*', { count: 'exact', head: true })
          .eq('user_type', 'staff').eq('is_active', true),
        window.sb.from('settings').select('key, value')
          .in('key', ['late_cutoff', 'match_threshold']),
      ]);
      setTotalStaff(count || 0);
      (set || []).forEach(s => {
        if (s.key === 'late_cutoff')     setLateCutoff(s.value);
        if (s.key === 'match_threshold') setThreshold(parseFloat(s.value) || 0.55);
      });
    };
    fetchFaces();
    fetchMeta();
    const ch = window.sb.channel('kiosk-faces')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'face_embeddings' }, () => fetchFaces())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' },       () => { fetchFaces(); fetchMeta(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' },        () => fetchMeta())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, []);

  const isLate = React.useCallback(() => {
    const n = new Date();
    const [h, m] = (lateCutoff || '10:00').split(':').map(x => parseInt(x, 10));
    const cutoff = h * 60 + (m || 0);
    const nowMins = n.getHours() * 60 + n.getMinutes();
    return nowMins >= cutoff;
  }, [lateCutoff]);

  const persistScan = async (emp, dir) => {
    if (!window.sb) return;
    const n = new Date();
    const today = n.toISOString().slice(0, 10);
    const hh = String(n.getHours()).padStart(2, '0');
    const mm = String(n.getMinutes()).padStart(2, '0');
    const stamp = `${hh}:${mm}:00`;
    if (dir === 'in') {
      await window.sb.from('attendance').upsert({
        employee_id:   emp.id,
        date:          today,
        status:        isLate() ? 'late' : 'present',
        punch_in_time: stamp,
        source:        'kiosk',
      }, { onConflict: 'employee_id,date' });
    } else {
      await window.sb.from('attendance')
        .update({ punch_out_time: stamp })
        .eq('employee_id', emp.id)
        .eq('date', today);
    }
  };

  // Run the match outcome UI (shared by real + simulated matches).
  const showMatchUI = React.useCallback((emp) => {
    setCurrent(emp);
    setPhase('matching');
    const dir = clockedIn.has(emp.id) ? 'out' : 'in';
    persistScan(emp, dir);
    setTimeout(() => setPhase('matched'), 300);
    const hh = new Date().getHours() % 12 || 12;
    const mm = String(new Date().getMinutes()).padStart(2, '0');
    setRecent(r => [{ ...emp, dir, time: `${hh}:${mm}` }, ...r].slice(0, 6));
    setClockedIn(s => {
      const ns = new Set(s);
      if (dir === 'in') ns.add(emp.id); else ns.delete(emp.id);
      return ns;
    });
    setTimeout(() => { setPhase('idle'); setCurrent(null); }, 4200);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [clockedIn, lateCutoff]);

  // Real-face matching loop — active only while phase is idle.
  React.useEffect(() => {
    if (!modelsReady || !cameraReady || phase !== 'idle') return;
    if (faces.length === 0) return; // nobody enrolled — nothing to match
    let cancelled = false;
    const tick = async () => {
      if (cancelled) return;
      try {
        const v = videoRef.current;
        if (v && v.readyState >= 2) {
          // Throttle: re-match the same person at most once every 6 seconds.
          const desc = await window.computeFaceDescriptor(v);
          if (desc) {
            let best = { id: null, name: null, sim: -1, emp: null };
            for (const f of faces) {
              const sim = window.cosineSim(desc, f.embedding);
              if (sim > best.sim) {
                best = {
                  id: f.employee_id,
                  sim,
                  emp: {
                    id: f.employee_id,
                    name: f.employees?.name || f.employee_id,
                    role: f.employees?.role || '',
                    section: SECTION_LABEL[f.employees?.section_id] || '',
                    confidence: sim,
                  },
                };
              }
            }
            if (best.sim >= threshold) {
              const nowT = Date.now();
              const lastAt = lastMatchMap.current[best.id] || 0;
              if (nowT - lastAt > MATCH_COOLDOWN_MS) {
                lastMatchMap.current[best.id] = nowT;
                setPhase('detecting');
                showMatchUI(best.emp);
                return;
              }
              // Same person still in frame within the cooldown — ignore.
            }
          }
        }
      } catch (_) { /* swallow per-tick errors */ }
      setTimeout(tick, 500);
    };
    const handle = setTimeout(tick, 300);
    return () => { cancelled = true; clearTimeout(handle); };
  }, [modelsReady, cameraReady, phase, faces, threshold, showMatchUI]);

  // Legacy Simulate button — cycles through the mock queue regardless of
  // enrolled faces. Useful for demos and when the camera is unavailable.
  const triggerSimulate = () => {
    if (phase !== 'idle') return;
    const next = queue.current[queueIdx.current % queue.current.length];
    queueIdx.current++;
    setPhase('detecting');
    setTimeout(() => showMatchUI(next), 600);
  };

  const direction = current && clockedIn.has(current.id) ? 'out' : 'in';
  const hh = now.getHours() % 12 || 12;
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ampm = now.getHours() >= 12 ? 'PM' : 'AM';

  return (
    <div style={{
      position: 'absolute', inset: 0, overflow: 'hidden',
      background: '#0B0D0E', color: '#fff',
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Top bar */}
      <div style={{
        padding: 'var(--screen-top-sm) 20px 16px', display: 'flex',
        alignItems: 'flex-start', justifyContent: 'space-between',
      }}>

// Enrollment wizard — HR registers a new employee's face in 3 shots.
// Simulated capture in the prototype.

const EnrollJoinerScreen = () => {
  const { nav, toast } = useApp();
  const T_ = window.TOKENS;

  const [step, setStep] = React.useState(0);
  const [details, setDetails] = React.useState({
    name: '', empId: '', section: 'cotton', role: '',
  });
  // Each shot is null | number[128] (the face descriptor).
  const [shots, setShots] = React.useState([null, null, null]);
  const [capturing, setCapturing] = React.useState(false);
  const [saving, setSaving] = React.useState(false);

  const shotConfig = [
    { key: 'front', label: 'Look straight at the camera', ta: 'நேராக பாருங்கள்' },
    { key: 'left',  label: 'Turn head slightly left',     ta: 'இடதுபுறம் திரும்புங்கள்' },
    { key: 'right', label: 'Turn head slightly right',    ta: 'வலதுபுறம் திரும்புங்கள்' },
  ];

  // Called by the capture step once it's produced a real 128-d descriptor.
  const handleCaptured = (descriptor) => {
    const shotIdx = step - 1;
    setShots(s => s.map((x, i) => i === shotIdx ? descriptor : x));
    if (step < 3) setStep(step + 1);
    else setStep(4);
  };

  const finish = async () => {
    if (saving) return;
    if (!window.sb) { toast('Offline — cannot save'); return; }
    if (shots.some(s => !s)) { toast('Capture all 3 photos first'); return; }

    setSaving(true);
    try {
      const empId = (details.empId || '').trim().toUpperCase()
        || `E${String(Math.floor(Math.random() * 900) + 400).padStart(3, '0')}`;

      const { error: empErr } = await window.sb.from('employees').insert({
        id:          empId,
        name:        details.name.trim(),
        role:        details.role.trim(),
        section_id:  details.section,
        user_type:   'staff',
        joined_date: new Date().toISOString().slice(0, 10),
      });
      if (empErr) {
        toast(empErr.message.includes('duplicate')
          ? 'Employee ID already exists'
          : 'Could not save — try again');
        setSaving(false);
        return;
      }

      // Save 3 face embeddings (front/left/right)
      const poses = ['front', 'left', 'right'];
      const { error: faceErr } = await window.sb.from('face_embeddings').insert(
        shots.map((desc, i) => ({
          employee_id: empId,
          pose:        poses[i],
          embedding:   desc,
        }))
      );
      if (faceErr) {
        toast('Employee saved, but face enrollment failed');
        setSaving(false);
        return;
      }

      toast(`${details.name} enrolled · Face saved`);
      setTimeout(() => nav.back(), 700);
    } finally { setSaving(false); }
  };

  return (
    <div style={{ background: T_.bg, minHeight: '100%', paddingBottom: 40 }}>
      <ScreenHeader
        back
        title="Enroll new joiner"
        subtitle={step < 4 ? `Step ${Math.min(step + 1, 4)} of 4` : 'Review & save'}
      />

      <div style={{ padding: '0 16px' }}>
        <div style={{ display: 'flex', gap: 6, marginBottom: 18 }}>
          {[0, 1, 2, 3].map(i => (
            <div key={i} style={{
              flex: 1, height: 4, borderRadius: 2,
              background: step > i ? T_.maroon : step === i ? T_.gold : T_.border,
              transition: 'background 200ms',
            }} />
          ))}
        </div>

        {step === 0 && (
          <EnrollDetailsStep details={details} setDetails={setDetails} onNext={() => setStep(1)} />
        )}

        {step >= 1 && step <= 3 && (
          <EnrollCaptureStep
            shotIdx={step - 1}
            shotConfig={shotConfig[step - 1]}
            captured={!!shots[step - 1]}
            onCaptured={handleCaptured}
            onRetake={() => setShots(s => s.map((x, i) => i === step - 1 ? null : x))}
            allShots={shots}
          />
        )}

        {step === 4 && (
          <EnrollReviewStep
            details={details} shots={shots}
            onEdit={() => setStep(0)}
            onFinish={finish}
            saving={saving}
          />
        )}
      </div>
    </div>
  );
};

const EnrollCaptureStep = ({ shotIdx, shotConfig, captured, onCaptured, onRetake, allShots }) => {
  const T_ = window.TOKENS;
  const videoRef  = React.useRef(null);
  const [modelsReady, setModelsReady] = React.useState(false);
  const [cameraErr, setCameraErr]     = React.useState(null);
  const [busy, setBusy]               = React.useState(false);
  const [flash, setFlash]             = React.useState(false);
  const [hint, setHint]               = React.useState('');

  // Load models + open webcam once (front camera preferred on phones).
  React.useEffect(() => {
    let streamRef = null;
    let cancelled = false;
    (async () => {
      try {
        setHint('Loading face models…');
        await window.loadFaceModels();
        if (cancelled) return;
        setModelsReady(true);
        setHint('Opening camera…');
        streamRef = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        if (cancelled) { streamRef.getTracks().forEach(t => t.stop()); return; }
        if (videoRef.current) {
          videoRef.current.srcObject = streamRef;
          await videoRef.current.play().catch(() => {});
        }
        setHint('');
      } catch (err) {
        console.error(err);
        setCameraErr(
          err.name === 'NotAllowedError'
            ? 'Camera permission denied. Enable it in Safari settings and retry.'
            : 'Could not open the camera on this device.'
        );
      }
    })();
    return () => {
      cancelled = true;
      if (streamRef) streamRef.getTracks().forEach(t => t.stop());
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const doCapture = async () => {
    if (!modelsReady || busy) return;
    setBusy(true);
    setHint('Detecting face…');
    try {
      const desc = await window.computeFaceDescriptor(videoRef.current);
      if (!desc) {
        setHint('No face detected — move closer to the camera');
        setBusy(false);
        return;
      }
      setFlash(true);
      setTimeout(() => setFlash(false), 350);
      setHint('');
      onCaptured(desc);
    } catch (err) {
      console.error(err);
      setHint('Capture failed — try again');
    } finally { setBusy(false); }
  };

  return (
    <div>
      <div style={{
        fontFamily: 'Fraunces, Georgia, serif', fontSize: 20,
        fontWeight: 500, color: T_.ink, letterSpacing: -0.3, marginBottom: 4,
      }}>Photo {shotIdx + 1} of 3</div>
      <div style={{ fontSize: 13, color: T_.inkMuted, marginBottom: 16 }}>
        {shotConfig.label} · <span style={{ color: T_.inkSoft }}>{shotConfig.ta}</span>
      </div>

      <div style={{
        position: 'relative', width: '100%', aspectRatio: '3 / 4',
        background: '#0B0D0E', borderRadius: 18, overflow: 'hidden',
        border: `1px solid ${T_.border}`,
      }}>
        {/* Live webcam feed (mirrored so the preview feels natural on a phone) */}
        <video ref={videoRef} autoPlay playsInline muted
          style={{
            position: 'absolute', inset: 0,
            width: '100%', height: '100%', objectFit: 'cover',
            transform: 'scaleX(-1)',
            opacity: captured ? 0.4 : 1,
            transition: 'opacity 200ms',
          }}
        />

        {/* Oval framing guide */}
        <div style={{
          position: 'absolute', top: '50%', left: '50%',
          transform: 'translate(-50%, -50%)',
          width: '60%', height: '70%', borderRadius: '50%',
          border: `2px dashed ${captured ? '#5BC47E' : 'rgba(255,255,255,0.45)'}`,
          transition: 'border-color 200ms',
          pointerEvents: 'none',
        }} />

        {flash && (
          <div style={{
            position: 'absolute', inset: 0, background: 'rgba(255,255,255,0.55)',
            animation: 'flash 400ms',
          }} />
        )}

        {captured && (
          <div style={{
            position: 'absolute', top: 12, right: 12,
            width: 32, height: 32, borderRadius: '50%',
            background: 'rgba(14, 124, 58, 0.35)', border: '1.5px solid #5BC47E',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Icon name="check" size={16} color="#5BC47E" />
          </div>
        )}

        {(hint || cameraErr) && (
          <div style={{
            position: 'absolute', left: 12, bottom: 12, right: 12,
            background: 'rgba(11, 13, 14, 0.7)', color: '#fff',
            padding: '8px 12px', borderRadius: 10, fontSize: 12,
            backdropFilter: 'blur(6px)', textAlign: 'center',
          }}>
            {cameraErr || hint}
          </div>
        )}

        <style>{`
          @keyframes flash { 0% { opacity: 0 } 20% { opacity: 1 } 100% { opacity: 0 } }
        `}</style>
      </div>

      <div style={{ display: 'flex', gap: 8, marginTop: 12, marginBottom: 16 }}>
        {['front', 'left', 'right'].map((k, i) => (
          <div key={k} style={{
            flex: 1, aspectRatio: '1', borderRadius: 10,
            background: allShots[i] ? '#0B0D0E' : T_.surfaceAlt,
            border: `1px solid ${allShots[i] ? T_.success : T_.border}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            position: 'relative',
          }}>
            {allShots[i] ? (
              <>
                <svg width="28" height="36" viewBox="0 0 28 36" fill="none">
                  <ellipse cx="14" cy="14" rx="8" ry="10" stroke="rgba(255,255,255,0.6)" strokeWidth="1.2" />
                </svg>

// Manager / Supervisor without re-entering passwords. Disappears when
// no login users exist.
const SettingsPreviewSwitcher = () => {
  const { user, userId, setUser, setUserId, nav, lang } = useApp();
  const T_ = window.TOKENS;
  const { users } = useLoginUsers();

  const pick = (targetUser) => {
    const list = users.filter(u => u.user_type === targetUser);
    if (!list.length) return;
    // Prefer keeping the current user if they match the role; otherwise
    // pick the first user of that role.
    const current = list.find(u => u.id === userId);
    const target = current || list[0];
    setUser(targetUser);
    setUserId(target.id);
    const home = {
      owner: 'ownerHome', hr: 'hrHome',
      manager: 'managerHome', supervisor: 'managerHome',
    }[targetUser] || 'ownerHome';
    nav.reset(home);
  };

  const counts = {
    owner: users.filter(u => u.user_type === 'owner').length,
    hr: users.filter(u => u.user_type === 'hr').length,
    manager: users.filter(u => u.user_type === 'manager').length,
    supervisor: users.filter(u => u.user_type === 'supervisor').length,
  };

  const roles = [
    { id: 'owner',      label: 'Owner',      sub: 'Full access',          icon: 'sparkle' },
    { id: 'hr',         label: 'HR',         sub: 'People operations',    icon: 'people' },
    { id: 'manager',    label: 'Manager',    sub: 'Section view',         icon: 'store' },
    { id: 'supervisor', label: 'Supervisor', sub: 'Section view',         icon: 'user' },
  ].filter(r => counts[r.id] > 0);

  if (roles.length === 0) return null;

  return (
    <div style={{ padding: '28px 16px 0' }}>
      <div style={{
        fontSize: 11, letterSpacing: 0.9, textTransform: 'uppercase',
        color: T_.inkMuted, fontWeight: 600, padding: '0 4px 6px',

        {lang === 'ta' ? 'விரைவு மாற்று' : 'Preview mode'}
      </div>
      <div style={{
        fontSize: 11.5, color: T_.inkFaint, padding: '0 4px 10px',
      }}>
        Jump between roles without signing out. For development only.
      </div>
      <div style={{
        background: T_.goldSoft, borderRadius: 14,
        padding: 4, display: 'grid',
        gridTemplateColumns: `repeat(${roles.length}, 1fr)`, gap: 2,
      }}>
        {roles.map(r => (
          <button key={r.id} onClick={() => pick(r.id)}
            style={{
              padding: '10px 6px', borderRadius: 10, border: 'none',
              background: user === r.id ? T_.surface : 'transparent',
              color: user === r.id ? T_.ink : T_.inkSoft,
              boxShadow: user === r.id ? '0 1px 2px rgba(0,0,0,0.08)' : 'none',
              fontFamily: 'inherit', cursor: 'pointer',

            <div style={{ fontSize: 11.5, fontWeight: 600 }}>{r.label}</div>
          </button>

  );
};

// ─────────────────────────────────────────────────────────────
// Checklist screen — daily opening/closing routine.
// Scoped by the logged-in user's user_access.section_ids / all_sections.
// Manage tasks power gates add/edit/delete.
// ─────────────────────────────────────────────────────────────
const ChecklistScreen = () => {
  const { nav, user, userId, userAccess, toast } = useApp();
  const T_ = window.TOKENS;

  const today = new Date().toISOString().slice(0, 10);
  const [rows, setRows]       = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [editing, setEditing] = React.useState(null);
  const [saving, setSaving]   = React.useState(false);
  const [mode, setMode]       = React.useState('mine'); // 'mine' | 'assigned' (admins)
  const [loginUsers, setLoginUsers] = React.useState([]);

  // Only Owner/HR can assign checklist items to other people. Managers/
  // Supervisors can still add items to their own checklist.
  const canAssignOthers = user === 'owner' || user === 'hr';

  // Fetch today's checklist rows. For the user's 'Mine' view we filter
  // by assignee_id; admins' 'All I've assigned' view returns everyone's.
  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    let q = window.sb.from('tasks')
      .select('id, scope, assignee_id, label, done, priority, sort_order')
      .in('scope', ['checklist', 'owner'])  // legacy 'owner' rows show too
      .eq('due_date', today)
      .order('sort_order');
    if (mode === 'mine') {
      q = userId ? q.eq('assignee_id', userId) : q.eq('assignee_id', '__none__');
    }
    const { data } = await q;
    setRows(data || []);
    setLoading(false);
  }, [today, mode, userId]);

  // Team view should only show checklists for people in Team Access.
  // Stale rows (no assignee or assignee not in user_access) are hidden.
  const visibleRows = React.useMemo(() => {
    if (mode === 'mine') return rows;
    if (!loginUsers || loginUsers.length === 0) return rows;
    const teamIds = new Set(loginUsers.map(u => u.id));
    return rows.filter(r => r.assignee_id && teamIds.has(r.assignee_id));
  }, [rows, loginUsers, mode]);

  React.useEffect(() => {
    if (!window.sb) return;
    setLoading(true);
    fetchAll();
    const ch = window.sb.channel('mobile-checklist')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'tasks', filter: `due_date=eq.${today}` },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, today]);

  // Admins need the team roster to assign to others.
  React.useEffect(() => {
    if (!canAssignOthers || !window.sb) return;
    let cancelled = false;
    (async () => {
      const { data } = await window.sb
        .from('user_access')
        .select('employee_id, employees(id, name, role, user_type, section_id, is_active)');
      if (!cancelled) {
        setLoginUsers((data || [])
          .filter(r => r.employees && r.employees.is_active !== false)
          .map(r => r.employees));
      }
    })();
    return () => { cancelled = true; };
  }, [canAssignOthers]);

  const loginUsersById = React.useMemo(() => {
    const m = {};
    loginUsers.forEach(u => { m[u.id] = u; });
    return m;
  }, [loginUsers]);

  const totalCount = visibleRows.length;
  const doneCount  = visibleRows.filter(r => r.done).length;
  const pct        = totalCount ? Math.round((doneCount / totalCount) * 100) : 0;

  const toggleDone = async (row) => {
    if (!window.sb) return;
    await window.sb.from('tasks').update({ done: !row.done }).eq('id', row.id);
  };

  const del = async (row) => {
    if (!window.confirm(`Delete "${row.label}"?`)) return;
    await window.sb.from('tasks').delete().eq('id', row.id);
    toast('Deleted');
  };

  const startNew = () => {
    const maxOrder = Math.max(0, ...rows.map(t => t.sort_order || 0));
    setEditing({
      id: null, _new: true,
      label: '', priority: false,
      assignee_id: userId || '',
      sort_order: maxOrder + 1,
    });
  };
  const startEdit = (row) => setEditing({ ...row, _new: false });
  const close = () => setEditing(null);

  const save = async () => {
    if (!editing || saving) return;
    if (!editing.label.trim()) { toast('Label required'); return; }
    if (!editing.assignee_id) { toast('Pick an assignee'); return; }
    setSaving(true);
    try {
      const payload = {
        scope: 'checklist',
        section_id: null,
        assignee_id: editing.assignee_id,
        label: editing.label.trim(),
        owner_label: null,
        priority: !!editing.priority,
        sort_order: parseInt(editing.sort_order, 10) || 0,
        due_date: today,
      };
      if (editing._new) {
        await window.sb.from('tasks').insert(payload);
        toast('Added');
      } else {
        await window.sb.from('tasks').update(payload).eq('id', editing.id);
        toast('Saved');
      }
      close();
    } finally { setSaving(false); }
  };

  return (
    <div style={{ background: T_.bg, minHeight: '100%', paddingBottom: 90 }}>
      {/* Header */}
      <div style={{ padding: 'var(--screen-top) 20px 0' }}>
        <div style={{
          fontSize: 11, letterSpacing: 1.2, textTransform: 'uppercase',
          color: T_.inkMuted, fontWeight: 600,
        }}>
          Daily checklist
        </div>
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif',
          fontSize: 28, fontWeight: 500, color: T_.ink,
          letterSpacing: -0.7, marginTop: 4, lineHeight: 1.15,
        }}>
          {doneCount} / {totalCount} done
          <span style={{
            fontFamily: 'Inter, sans-serif',
            fontSize: 14, fontWeight: 500, color: T_.inkMuted, marginLeft: 8,
          }}>· {pct}%</span>
        </div>
        <div style={{ fontSize: 13, color: T_.inkMuted, marginTop: 4 }}>
          {mode === 'mine' ? 'Your daily routine' : 'Team members\u2019 checklists'}
        </div>
      </div>

      {/* Progress bar */}
      <div style={{ padding: '14px 16px 0' }}>
        <div style={{
          height: 8, borderRadius: 4, background: T_.surfaceAlt, overflow: 'hidden',
        }}>
          <div style={{
            width: `${pct}%`, height: '100%',
            background: pct === 100 ? T_.success : T_.maroon,
            transition: 'width 300ms',
          }} />
        </div>
      </div>

      {/* Mine / Everyone toggle (admins only) */}
      {canAssignOthers && (
        <div style={{ padding: '14px 16px 0' }}>
          <div style={{
            display: 'flex', gap: 6, padding: 4, borderRadius: 12,
            background: T_.surfaceAlt,
          }}>
            {[
              { id: 'mine',     label: 'Mine' },
              { id: 'assigned', label: 'Team' },
            ].map(m => (
              <button key={m.id} onClick={() => setMode(m.id)}
                style={{
                  flex: 1, padding: '8px 4px', borderRadius: 8, border: 'none',
                  background: mode === m.id ? T_.surface : 'transparent',
                  color: mode === m.id ? T_.ink : T_.inkMuted,
                  fontSize: 12.5, fontWeight: 600, fontFamily: 'inherit', cursor: 'pointer',
                  boxShadow: mode === m.id ? '0 1px 2px rgba(0,0,0,0.05)' : 'none',
                }}>{m.label}</button>
            ))}
          </div>
        </div>
      )}

      {/* List */}
      <div style={{ padding: '16px 16px 0' }}>
        {loading && (
          <div style={{ textAlign: 'center', color: T_.inkMuted, fontSize: 13, padding: 30 }}>
            Loading…
          </div>
        )}
        {!loading && visibleRows.length === 0 && (
          <div style={{
            background: T_.surface, border: `1px dashed ${T_.border}`,
            borderRadius: 14, padding: '30px 20px', textAlign: 'center',
          }}>
            <div style={{
              fontFamily: 'Fraunces, Georgia, serif', fontSize: 18,
              fontWeight: 500, color: T_.ink, marginBottom: 6,
            }}>No checklist items</div>
            <div style={{ fontSize: 12.5, color: T_.inkMuted }}>
              {canAssignOthers
                ? 'Tap "New item" to add one.'
                : 'Your checklist will be set up by Owner or HR.'}
            </div>
          </div>
        )}
        {!loading && visibleRows.length > 0 && (
          <div style={{
            background: T_.surface, border: `1px solid ${T_.border}`,
            borderRadius: 16, overflow: 'hidden',
          }}>
            {visibleRows.map((row, i) => {
              const assignee = loginUsersById[row.assignee_id];
              const isMine   = row.assignee_id === userId;
              return (
                <div key={row.id} style={{
                  padding: '14px', display: 'flex', alignItems: 'flex-start', gap: 12,
                  borderBottom: i === visibleRows.length - 1 ? 'none' : `1px solid ${T_.borderSoft}`,
                  opacity: row.done ? 0.6 : 1,
                }}>
                  <button onClick={() => toggleDone(row)} style={{
                    width: 22, height: 22, borderRadius: 7, marginTop: 1,
                    background: row.done ? T_.success : 'transparent',
                    border: row.done ? 'none' : `1.5px solid ${T_.border}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', flexShrink: 0,
                  }}>
                    {row.done && <Icon name="check" size={14} color="#fff" strokeWidth={2.5} />}
                  </button>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{
                      fontSize: 13.5, color: row.done ? T_.inkMuted : T_.ink, fontWeight: 500,
                      textDecoration: row.done ? 'line-through' : 'none', lineHeight: 1.4,
                    }}>{row.label}</div>
                    {mode === 'assigned' && !isMine && assignee && (
                      <div style={{ fontSize: 11.5, color: T_.inkMuted, marginTop: 3 }}>
                        → {assignee.name}
                      </div>
                    )}
                  </div>
                  {row.priority && !row.done && (
                    <span style={{
                      fontSize: 10, fontWeight: 700, letterSpacing: 0.3, textTransform: 'uppercase',
                      background: T_.warningSoft, color: T_.warning,
                      padding: '3px 7px', borderRadius: 999, whiteSpace: 'nowrap',
                    }}>Priority</span>
                  )}
                  {canAssignOthers && (
                    <button onClick={() => startEdit(row)} style={{
                      background: 'none', border: 'none', cursor: 'pointer', padding: 4,
                      color: T_.inkFaint, flexShrink: 0,
                    }} title="Edit">
                      <Icon name="more" size={16} />
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Add button — only Owner/HR can create checklist items */}
      {canAssignOthers && (
        <div style={{ padding: '14px 16px 20px' }}>
          <button onClick={startNew} style={{
            width: '100%', padding: 14, borderRadius: 14,
            background: T_.maroon, color: '#fff', border: 'none',
            fontSize: 14, fontWeight: 600, cursor: 'pointer',
            fontFamily: 'inherit',
            display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
            boxShadow: '0 6px 16px -6px rgba(14, 124, 58, 0.45)',
          }}>
            <Icon name="plus" size={16} /> New checklist item
          </button>
        </div>
      )}

      {/* Edit sheet */}
      {editing && (
        <div onClick={close} style={{
          position: 'absolute', inset: 0, background: 'rgba(11, 13, 14, 0.55)', zIndex: 100,
          display: 'flex', alignItems: 'flex-end',
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: '100%', background: T_.surface, borderRadius: '20px 20px 0 0',
            padding: 20, maxHeight: '80%', overflowY: 'auto',
          }}>
            <div style={{
              fontFamily: 'Fraunces, Georgia, serif', fontSize: 20,
              fontWeight: 500, color: T_.ink, letterSpacing: -0.3, marginBottom: 14,
            }}>
              {editing._new ? 'New checklist item' : 'Edit item'}
            </div>

            <FieldLabel>Task</FieldLabel>
            <textarea value={editing.label} autoFocus
              onChange={e => setEditing({ ...editing, label: e.target.value })}
              placeholder="e.g. Cash float verified at 6 counters"
              style={{
                width: '100%', minHeight: 70, padding: 12, borderRadius: 12,
                background: T_.bg, border: `1px solid ${T_.border}`,
                fontSize: 14, fontFamily: 'inherit', color: T_.ink,
                boxSizing: 'border-box', resize: 'vertical', outline: 'none',
                marginBottom: 14,
              }} />

            <FieldLabel>Assign to</FieldLabel>
            {canAssignOthers ? (
              <select value={editing.assignee_id || ''}
                onChange={e => setEditing({ ...editing, assignee_id: e.target.value })}
                style={{ ...enrollInputStyle(T_), cursor: 'pointer' }}>
                <option value="">— pick someone —</option>
                {loginUsers.map(u => (
                  <option key={u.id} value={u.id}>
                    {u.name}{u.id === userId ? ' (me)' : ''}
                  </option>
                ))}
              </select>
            ) : (
              <input readOnly value="Myself"
                style={{ ...enrollInputStyle(T_), background: T_.surfaceAlt }} />
            )}

            <div style={{ height: 14 }} />

            <label style={{
              display: 'flex', alignItems: 'center', gap: 10,
              background: T_.bg, border: `1px solid ${T_.border}`,
              padding: 12, borderRadius: 12, cursor: 'pointer',
            }}>
              <input type="checkbox"
                checked={!!editing.priority}
                onChange={e => setEditing({ ...editing, priority: e.target.checked })} />
              <div style={{ fontSize: 13.5, color: T_.ink, fontWeight: 500 }}>Priority</div>
            </label>

            <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
              {!editing._new && (
                <button onClick={() => { del(editing); close(); }} style={{
                  padding: '12px 16px', borderRadius: 12,
                  background: T_.surface, border: `1px solid ${T_.border}`,
                  color: T_.danger, fontSize: 13, fontWeight: 600,
                  fontFamily: 'inherit', cursor: 'pointer',
                }}>Delete</button>
              )}
              <button onClick={close} style={{
                flex: 1, padding: '12px 16px', borderRadius: 12,
                background: T_.surface, border: `1px solid ${T_.border}`,
                color: T_.ink, fontSize: 13, fontWeight: 600,
                fontFamily: 'inherit', cursor: 'pointer',
              }}>Cancel</button>
              <button onClick={save} disabled={saving} style={{
                flex: 1.2, padding: '12px 16px', borderRadius: 12,
                background: T_.maroon, border: 'none', color: '#fff',
                fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
                cursor: saving ? 'not-allowed' : 'pointer',
                boxShadow: '0 6px 16px -6px rgba(14, 124, 58, 0.45)',
              }}>{saving ? 'Saving…' : editing._new ? 'Add' : 'Save'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

window.ChecklistScreen = ChecklistScreen;


// ─────────────────────────────────────────────────────────────
// Advances screen — list + file + review. HR files, Owner decides.
// ─────────────────────────────────────────────────────────────
const ADV_TONE_MOBILE = {
  pending:   'warning',
  approved:  'success',
  rejected:  'danger',
  completed: 'info',
  cancelled: 'neutral',
};

const fmtRupees = (n) => {
  if (n == null) return '—';
  return '₹' + Number(n).toLocaleString('en-IN');
};

const AdvancesScreen = () => {
  const { user, userId, toast, nav } = useApp();
  const T_ = window.TOKENS;
  const canFile    = user === 'hr' || user === 'owner';
  const canApprove = user === 'owner';

  const { items, loading, file, decide, cancel } = window.useLiveAdvances
    ? window.useLiveAdvances()
    : { items: [], loading: false, file: async () => {}, decide: async () => {}, cancel: async () => {} };

  const [statusFilter, setStatusFilter] = React.useState(
    () => (window.__advancesFilter || 'pending')
  );
  React.useEffect(() => {
    if (window.__advancesFilter) {
      setStatusFilter(window.__advancesFilter);
      delete window.__advancesFilter;
    }
  }, []);

  const [filing, setFiling]   = React.useState(null);
  const [detail, setDetail]   = React.useState(null);
  const [saving, setSaving]   = React.useState(false);
  const [selected, setSelected] = React.useState(new Set());
  const [bulkBusy, setBulkBusy] = React.useState(false);
  const [printing, setPrinting] = React.useState(false);

  // Clear selection when the tab changes.
  React.useEffect(() => { setSelected(new Set()); }, [statusFilter]);

  const [people, setPeople] = React.useState([]);
  React.useEffect(() => {
    if (!window.sb || !canFile) return;
    let cancelled = false;
    (async () => {
      const { data } = await window.sb.from('employees')
        .select('id, name, role, section_id, user_type')
        .eq('is_active', true)
        .neq('user_type', 'owner')
        .order('name');
      if (!cancelled) setPeople(data || []);
    })();
    return () => { cancelled = true; };
  }, [canFile]);

  const filtered = React.useMemo(() =>
    items.filter(r => statusFilter === 'all' || r.status === statusFilter),
    [items, statusFilter]);

  const counts = React.useMemo(() => ({
    pending:   items.filter(i => i.status === 'pending').length,
    approved:  items.filter(i => i.status === 'approved').length,
    completed: items.filter(i => i.status === 'completed').length,
    rejected:  items.filter(i => i.status === 'rejected').length,
    all:       items.length,
    outstanding: items
      .filter(i => i.status === 'approved')
      .reduce((s, r) => s + Math.max(0, r.months_total - r.months_deducted) * (r.monthly_deduction || 0), 0),
  }), [items]);

  const startFile = () => setFiling({
    employee_id: '',
    amount: 5000,
    months: 2,
    reason: '',
  });

  const submitFile = async () => {
    if (!filing || saving) return;
    if (!filing.employee_id) { toast('Pick an employee'); return; }
    const amt = parseInt(filing.amount, 10);
    const mo  = parseInt(filing.months, 10);
    if (!amt || amt <= 0)  { toast('Amount must be > 0'); return; }
    if (!mo  || mo  <= 0)  { toast('Months must be > 0'); return; }
    setSaving(true);
    try {
      const res = await file({
        employeeId: filing.employee_id,
        amount: amt,
        months: mo,
        reason: (filing.reason || '').trim(),
        filedBy: userId || null,
      });
      if (res && res.error) {
        console.error('advance insert failed', res.error);
        toast(`Could not save: ${res.error.message || 'try again'}`);
        return;
      }
      toast('Advance request filed');
      setFiling(null);
    } catch (err) {
      console.error(err);
      toast('Could not save — check connection');
    } finally { setSaving(false); }
  };

  const openDetail = (row) => setDetail({
    ...row,
    _amount: row.amount_approved ?? row.amount_requested,
    _months: row.months_total,
    _note:   row.owner_note || '',
  });

  const submitDecision = async (action) => {
    if (!detail || saving || !canApprove) return;
    const amt = parseInt(detail._amount, 10);
    const mo  = parseInt(detail._months, 10);
    if (action === 'approved') {
      if (!amt || amt <= 0) { toast('Amount must be > 0'); return; }
      if (!mo  || mo  <= 0) { toast('Months must be > 0'); return; }
    }
    setSaving(true);
    try {
      await decide({ id: detail.id, action, amount: amt, months: mo, note: detail._note, deciderId: userId });
      toast(action === 'approved' ? 'Advance approved' : 'Advance rejected');
      setDetail(null);
    } finally { setSaving(false); }
  };

  const fmtRemaining = (r) => {
    if (r.status !== 'approved') return '—';
    const mLeft = Math.max(0, r.months_total - r.months_deducted);
    return `${fmtRupees(mLeft * (r.monthly_deduction || 0))} · ${mLeft}/${r.months_total} mo`;
  };

  return (
    <div style={{ background: T_.bg, minHeight: '100%', paddingBottom: 90 }}>
      <ScreenHeader back title="Advances"
        subtitle={`${counts.pending} pending · ${fmtRupees(counts.outstanding)} outstanding`}
        trailing={
          <div style={{ display: 'inline-flex', gap: 6 }}>
            <button onClick={() => setPrinting(true)}
              disabled={!items.some(r => r.status === 'approved' || r.status === 'completed')}
              style={{
                height: 34, padding: '0 10px', borderRadius: 10,
                background: T_.surface, color: T_.ink,
                border: `1px solid ${T_.border}`,
                fontSize: 12, fontWeight: 600, fontFamily: 'inherit',
                cursor: 'pointer',
                display: 'inline-flex', alignItems: 'center', gap: 4,
                opacity: items.some(r => r.status === 'approved' || r.status === 'completed') ? 1 : 0.5,
              }}
              title="Print approved advance receipts">
              🖨 Print
            </button>
            {canFile && (
              <button onClick={startFile} style={{
                height: 34, padding: '0 12px', borderRadius: 10,
                background: T_.maroon, color: '#fff', border: 'none',
                fontSize: 12, fontWeight: 600, fontFamily: 'inherit', cursor: 'pointer',
                display: 'inline-flex', alignItems: 'center', gap: 4,
              }}>
                <Icon name="plus" size={12} /> File
              </button>
            )}
          </div>
        }
      />

      <div style={{ padding: '0 16px' }}>
        {/* Status tabs */}
        <div style={{
          display: 'flex', gap: 6, padding: 4, background: T_.surfaceAlt,
          borderRadius: 12, overflowX: 'auto', marginBottom: 14,
        }}>
          {[
            { id: 'pending',   label: `Pending · ${counts.pending}` },
            { id: 'approved',  label: `Approved · ${counts.approved}` },
            { id: 'completed', label: `Done · ${counts.completed}` },
            { id: 'rejected',  label: `Rejected · ${counts.rejected}` },
            { id: 'all',       label: `All · ${counts.all}` },
          ].map(s => (
            <button key={s.id} onClick={() => setStatusFilter(s.id)}
              style={{
                padding: '8px 12px', borderRadius: 8, border: 'none',
                background: statusFilter === s.id ? T_.surface : 'transparent',
                color: statusFilter === s.id ? T_.ink : T_.inkMuted,
                fontSize: 12, fontWeight: 600, whiteSpace: 'nowrap',
                fontFamily: 'inherit', cursor: 'pointer',
                boxShadow: statusFilter === s.id ? '0 1px 2px rgba(0,0,0,0.05)' : 'none',
              }}>{s.label}</button>
          ))}
        </div>

        {/* Bulk approval bar — owner on Pending tab only */}
        {statusFilter === 'pending' && canApprove && filtered.length > 0 && (() => {
          const pendingIds = filtered.filter(r => r.status === 'pending').map(r => r.id);
          const allPicked = pendingIds.length > 0 && pendingIds.every(id => selected.has(id));
          return (
            <div style={{
              display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12,
              padding: '10px 12px', borderRadius: 12,
              background: selected.size > 0 ? T_.ink : T_.surfaceAlt,
              border: `1px solid ${selected.size > 0 ? T_.ink : T_.border}`,
              color: selected.size > 0 ? '#fff' : T_.inkSoft,
            }}>
              <button onClick={() => setSelected(allPicked ? new Set() : new Set(pendingIds))}
                style={{
                  background: 'none', border: 'none', cursor: 'pointer',
                  fontSize: 12.5, fontWeight: 600,
                  color: selected.size > 0 ? '#fff' : T_.inkSoft, fontFamily: 'inherit',
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                }}>
                <span style={{
                  width: 18, height: 18, borderRadius: 5,
                  background: allPicked ? '#fff' : 'transparent',
                  border: `1.5px solid ${selected.size > 0 ? 'rgba(255,255,255,0.6)' : T_.inkMuted}`,
                  display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  {allPicked && <Icon name="check" size={12} color={T_.ink} strokeWidth={2.5} />}
                </span>
                {allPicked ? 'Deselect all' : 'Select all'}
              </button>
              <div style={{ flex: 1, fontSize: 12, textAlign: 'center', opacity: 0.8 }}>
                {selected.size > 0 ? `${selected.size} selected` : `${pendingIds.length} pending`}
              </div>
              <button disabled={selected.size === 0 || bulkBusy}
                onClick={async () => {
                  if (selected.size === 0) return;
                  if (!window.confirm(`Approve ${selected.size} advance request${selected.size === 1 ? '' : 's'} with the amounts and months as requested?`)) return;
                  setBulkBusy(true);
                  try {
                    const chosen = filtered.filter(r => selected.has(r.id));
                    await Promise.all(chosen.map(r => decide({
                      id: r.id,
                      action: 'approved',
                      amount: r.amount_requested,
                      months: r.months_total,
                      note: null,
                      deciderId: userId,
                    })));
                    toast(`Approved ${chosen.length} advance${chosen.length === 1 ? '' : 's'}`);
                    setSelected(new Set());
                  } finally { setBulkBusy(false); }
                }}
                style={{
                  padding: '8px 14px', borderRadius: 10, border: 'none',
                  background: selected.size > 0 ? T_.success : 'rgba(255,255,255,0.15)',
                  color: '#fff', fontSize: 12.5, fontWeight: 700,
                  fontFamily: 'inherit',
                  cursor: (selected.size === 0 || bulkBusy) ? 'not-allowed' : 'pointer',
                  opacity: (selected.size === 0 || bulkBusy) ? 0.5 : 1,
                }}>
                {bulkBusy ? 'Approving…' : selected.size > 0 ? `Approve ${selected.size}` : 'Approve'}
              </button>
            </div>
          );
        })()}

        {filtered.length === 0 && !loading && (
          <div style={{
            background: T_.surface, border: `1px dashed ${T_.border}`,
            borderRadius: 14, padding: '30px 20px', textAlign: 'center',
          }}>
            <div style={{
              fontFamily: 'Fraunces, Georgia, serif', fontSize: 18,
              fontWeight: 500, color: T_.ink, marginBottom: 4,
            }}>No advances</div>
            <div style={{ fontSize: 12.5, color: T_.inkMuted }}>
              {canFile ? 'Tap File to start a new request.' : 'Nothing in this view.'}
            </div>
          </div>
        )}

        {filtered.length > 0 && (
          <div style={{
            display: 'flex', flexDirection: 'column', gap: 10,
          }}>
            {filtered.map(r => {
              const isSelectable = r.status === 'pending' && canApprove;
              const isSelected   = selected.has(r.id);
              return (
              <div key={r.id} onClick={() => openDetail(r)} style={{
                background: isSelected ? T_.maroonSoft : T_.surface,
                border: `1px solid ${isSelected ? T_.maroon : T_.border}`,
                borderRadius: 14, padding: 14,
                fontFamily: 'inherit', cursor: 'pointer',
                display: 'flex', alignItems: 'flex-start', gap: 12,
              }}>
                {isSelectable && (
                  <button onClick={(e) => {
                    e.stopPropagation();
                    setSelected(s => {
                      const n = new Set(s);
                      n.has(r.id) ? n.delete(r.id) : n.add(r.id);
                      return n;
                    });
                  }} style={{
                    width: 22, height: 22, borderRadius: 7, marginTop: 8,
                    background: isSelected ? T_.maroon : 'transparent',
                    border: isSelected ? 'none' : `1.5px solid ${T_.border}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    cursor: 'pointer', flexShrink: 0,
                  }}>
                    {isSelected && <Icon name="check" size={14} color="#fff" strokeWidth={2.5} />}
                  </button>
                )}
                <Avatar name={r.employees.name} size={38} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8 }}>
                    <div style={{ fontSize: 13.5, fontWeight: 600, color: T_.ink }}>
                      {r.employees.name}
                    </div>
                    <Pill tone={ADV_TONE_MOBILE[r.status]} size="sm">{r.status}</Pill>
                  </div>
                  <div style={{ fontSize: 11.5, color: T_.inkMuted, marginTop: 2 }}>
                    {r.employees.role}
                    {r.employees.section_id && ` · ${SECTION_LABEL[r.employees.section_id]}`}
                  </div>
                  <div style={{
                    display: 'flex', gap: 14, marginTop: 8, alignItems: 'baseline', flexWrap: 'wrap',
                  }}>
                    <div style={{
                      fontFamily: 'Fraunces, Georgia, serif',
                      fontSize: 22, fontWeight: 600, color: T_.ink, letterSpacing: -0.5, lineHeight: 1,
                    }}>
                      {fmtRupees(r.amount_approved ?? r.amount_requested)}
                    </div>
                    <div style={{ fontSize: 11.5, color: T_.inkMuted }}>
                      {r.status === 'approved'
                        ? <>Remaining <strong style={{ color: T_.ink }}>{fmtRemaining(r)}</strong></>
                        : <>Requested · {r.months_total} mo</>}
                    </div>
                  </div>
                  {r.reason && (
                    <div style={{
                      fontSize: 12, color: T_.inkMuted, marginTop: 6,
                      overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
                    }}>{r.reason}</div>
                  )}
                </div>
              </div>
              );
            })}
          </div>
        )}
      </div>

      {/* File sheet */}
      {filing && (
        <div onClick={() => setFiling(null)} style={{
          position: 'absolute', inset: 0, background: 'rgba(11, 13, 14, 0.55)',
          display: 'flex', alignItems: 'flex-end', zIndex: 150,
        }}>
          <div onClick={e => e.stopPropagation()} style={{
            width: '100%', background: T_.surface, borderRadius: '20px 20px 0 0',
            padding: 20, maxHeight: '90%', overflowY: 'auto',
          }}>
            <div style={{
              fontFamily: 'Fraunces, Georgia, serif', fontSize: 20,
              fontWeight: 500, color: T_.ink, letterSpacing: -0.3, marginBottom: 14,
            }}>File advance</div>

            <FieldLabel>Employee</FieldLabel>
            <select value={filing.employee_id}
