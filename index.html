<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Noto Sans Tamil', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #EFEBE4;
    color: #1A1613;
    overflow: hidden;
  }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at top, #F5F1E9 0%, #E8E1D3 100%);
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideInR {
    from { transform: translateX(100%); }
    to   { transform: translateX(0); }
  }
  @keyframes slideOutL {
    from { transform: translateX(0); }
    to   { transform: translateX(-30%); opacity: 0.5; }
  }

  /* scrollbar hide on the scrollable content inside device */
  *::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 40px;
    max-width: 100vw;
    max-height: 100vh;
  }

  .sidePanel {
    width: 280px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .side-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    color: #1A1613;
    letter-spacing: -0.8px;
    line-height: 1.15;
  }
  .side-sub {
    font-size: 13px;
    color: #0E7C3A;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .side-body {
    font-size: 13.5px;
    color: #4A433C;
    line-height: 1.55;
  }

  .screen-picker {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(107, 31, 42, 0.12);
    border-radius: 14px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    backdrop-filter: blur(20px);
  }
  .screen-picker h4 {
    margin: 4px 8px 6px;
    font-size: 10.5px;
    color: #8A8278;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    font-weight: 600;
  }
  .screen-picker button {
    text-align: left;
    padding: 8px 10px;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
    color: #4A433C;
    font-weight: 500;
    transition: background 120ms;
  }
  .screen-picker button:hover { background: rgba(14, 124, 58, 0.08); }
  .screen-picker button.active {
    background: #0E7C3A;
    color: #fff;
    font-weight: 600;
  }
  .screen-picker button.active:hover { background: #4A1520; }
  .screen-picker .role {
    font-size: 9.5px; letter-spacing: 0.4px; text-transform: uppercase;
    color: #8A8278; padding: 8px 10px 2px; font-weight: 600;
  }

  .tweakPanel {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    background: #1A1613; color: #fff;
    border-radius: 16px; padding: 14px;
    font-size: 12px; width: 240px;
    display: none;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .tweakPanel.on { display: block; }
  .tweakPanel h3 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.6px; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .tweakPanel .row { margin-bottom: 10px; }
  .tweakPanel label {
    font-size: 10.5px; color: rgba(255,255,255,0.6);
    letter-spacing: 0.3px; text-transform: uppercase; font-weight: 600;
    display: block; margin-bottom: 4px;
  }
  .tweakPanel .seg {
    display: flex; background: rgba(255,255,255,0.08);
    border-radius: 8px; padding: 2px;
  }
  .tweakPanel .seg button {
    flex: 1; padding: 6px 8px; border-radius: 6px;
    background: transparent; border: none; color: rgba(255,255,255,0.7);
    font-family: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .tweakPanel .seg button.active {
    background: #fff; color: #1A1613;
  }

  /* Screen-header top padding.
     Desktop: fixed values sized for the fake dynamic island in the mock frame.
     Mobile: collapse to the real safe-area inset + a tiny breathing room. */
  :root {
    --screen-top: 58px;
    --screen-top-md: 60px;
    --screen-top-sm: 56px;
    --screen-top-lg: 80px;
  }

  @media (max-width: 900px) {
    .sidePanel { display: none; }
    /* Kill flex centering on mobile — otherwise the IOSDevice (100dvh) gets
       centered inside a 100vh body, leaving a visible gap above the header
       whenever the browser chrome height differs from the dynamic viewport. */
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: block;
      background: #F7F7F2;
    }
    .stage {
      display: block;
      gap: 0; padding: 0;
      width: 100%; height: 100%;
      max-width: none; max-height: none;
    }
    :root {
      --screen-top:    calc(env(safe-area-inset-top, 0px) + 6px);
      --screen-top-md: calc(env(safe-area-inset-top, 0px) + 6px);
      --screen-top-sm: calc(env(safe-area-inset-top, 0px) + 6px);
      --screen-top-lg: calc(env(safe-area-inset-top, 0px) + 20px);
    }
    /* iOS Safari auto-zooms any focused form control whose font-size is
       below 16px. Bump form controls to 16px on small screens so the
       PWA stops zooming when an input is tapped. */
    input, select, textarea {
      font-size: 16px;
    }
  }
</style>

<script>
  // ──────────────────────────────────────────────────────────
  // Supabase client — publishable anon key, safe to ship.
  // Schema + RLS lives in the Supabase project itself.
  // ──────────────────────────────────────────────────────────
  window.SB_URL = 'https://hixhbznbejqfnasvgyid.supabase.co';
  window.SB_KEY = 'sb_publishable__Pit2dNHnYZ5oGLsJsn6lg_ojxAPfT8';
  if (window.supabase && window.supabase.createClient) {
    window.sb = window.supabase.createClient(window.SB_URL, window.SB_KEY, {
      realtime: { params: { eventsPerSecond: 5 } },
    });
  }

  // SHA-256 helper — used by the login screen to verify passwords.
  window.sha256 = async (text) => {
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  };

  // ──────────────────────────────────────────────────────────
  // face-api.js lazy loader + helpers.
  // Models loaded from jsDelivr (cached by the browser after first hit).
  // ──────────────────────────────────────────────────────────
  window.FACE_MODELS_URL =
    'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

  window.loadFaceModels = (() => {
    let promise = null;
    return () => {
      if (promise) return promise;
      promise = (async () => {
        // Wait for the face-api script to define the global if it hasn't yet.
        for (let i = 0; i < 200 && !window.faceapi; i++) {
          await new Promise(r => setTimeout(r, 25));
        }
        if (!window.faceapi) throw new Error('face-api.js did not load');
        const { nets } = window.faceapi;
        await Promise.all([
          nets.tinyFaceDetector.loadFromUri(window.FACE_MODELS_URL),
          nets.faceLandmark68TinyNet.loadFromUri(window.FACE_MODELS_URL),
          nets.faceRecognitionNet.loadFromUri(window.FACE_MODELS_URL),
        ]);
      })();
      return promise;
    };
  })();

  // Detect the single largest face in a media element (video/image) and
  // return its 128-d descriptor (Float32Array), or null if no face.
  window.computeFaceDescriptor = async (mediaEl) => {
    const det = await window.faceapi
      .detectSingleFace(mediaEl, new window.faceapi.TinyFaceDetectorOptions({
        inputSize: 320, scoreThreshold: 0.5,
      }))
      .withFaceLandmarks(true)
      .withFaceDescriptor();
    return det ? Array.from(det.descriptor) : null;
  };

  // Cosine similarity between two 128-d arrays (both must be same length).
  window.cosineSim = (a, b) => {
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < a.length; i++) {
      dot += a[i] * b[i];
      na  += a[i] * a[i];
      nb  += b[i] * b[i];
    }
    return dot / (Math.sqrt(na) * Math.sqrt(nb));
  };
</script>

// ========== components/ios-frame.jsx ==========

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  const [isMobile, setIsMobile] = React.useState(
    () => typeof window !== 'undefined' &&
      window.matchMedia('(max-width: 900px)').matches
  );
  React.useEffect(() => {
    if (typeof window === 'undefined') return;
    const mq = window.matchMedia('(max-width: 900px)');
    const handler = (e) => setIsMobile(e.matches);
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else mq.addListener(handler);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener('change', handler);
      else mq.removeListener(handler);
    };
  }, []);

  if (isMobile) {
    // On real phones, skip the mock chrome. Screens already include ~58-80px
    // top padding — roughly the same as the real safe-area-inset-top — so we
    // let them sit against the viewport edge rather than double-padding.
    return (
      <div style={{
        width: '100vw', height: '100dvh',
        position: 'relative', overflow: 'hidden',
        background: dark ? '#000' : '#F2F2F7',
        fontFamily: '-apple-system, system-ui, sans-serif',
        WebkitFontSmoothing: 'antialiased',
      }}>
        <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
          {title !== undefined && <IOSNavBar title={title} dark={dark} />}
          <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
          {keyboard && <IOSKeyboard dark={dark} />}
        </div>
      </div>
    );
  }

  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}

  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',

        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>

      {/* key layout */}

        display: 'flex', flexDirection: 'column', gap: 13,

        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}

    </div>
  );
}

// Lenient search helper: strips punctuation / whitespace and lower-cases
// both sides, so typing "saha" matches "P. SAHABUDEEN" and "psaha" too.
const slugify = (s) => String(s == null ? '' : s).replace(/[^a-z0-9]/gi, '').toLowerCase();
const matchesQuery = (needle, ...haystacks) => {
  const n = slugify(needle);
  if (!n) return true;
  return haystacks.some(h => slugify(h).includes(n));
};

// ──────────────────────────────────────────────────────────
// Live attendance hook — reads from Supabase + subscribes to realtime
// changes on the attendance table so any mark/unmark broadcasts to all
// connected devices immediately.
//
// Returns shapes that match the existing MOCK.attendance and MOCK.floors
// so downstream components don't need to know about the data source.
// ──────────────────────────────────────────────────────────
const SECTION_TO_LABEL_KEY = {
  fancy:  'secFancy',
  cotton: 'secCotton',
  silk:   'secSilk',
  dhoti:  'secDhoti',
};

const useLiveAttendance = () => {
  const [state, setState] = React.useState({
    loading: true,
    attendance: null,
    sections: null,
  });

  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    const today = new Date().toISOString().slice(0, 10);

    const [secRes, staffCountRes, attRes] = await Promise.all([
      window.sb
        .from('attendance_today_by_section')
        .select('*')
        .order('sort_order'),
      window.sb
        .from('employees')
        .select('*', { count: 'exact', head: true })
        .eq('user_type', 'staff')
        .eq('is_active', true),
      window.sb
        .from('attendance')
        .select('status')
        .eq('date', today),
    ]);

    const rows = attRes.data || [];
    const count = (s) => rows.filter(r => r.status === s).length;
    const total = staffCountRes.count || rows.length;

    const sections = (secRes.data || []).map(r => ({
      id:         r.section_id,
      labelKey:   SECTION_TO_LABEL_KEY[r.section_id] || r.section_name,
      glyph:      r.section_monogram,
      staff:      r.headcount,
      present:    r.present_count,
      late:       r.late_count,
      absent:     r.absent_count,
      onLeave:    r.on_leave_count,
      trend:      r.headcount
        ? Math.round((r.present_count / r.headcount) * 100) + '%'
        : '0%',
    }));

    setState({
      loading: false,
      attendance: {
        total,
        present: count('present'),
        late:    count('late'),
        absent:  count('absent'),
        onLeave: count('on_leave'),
      },
      sections,
    });
  }, []);

  React.useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const channel = window.sb
      .channel('live-attendance')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'attendance' },
        () => { fetchAll(); })
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'employees' },
        () => { fetchAll(); })
      .subscribe();
    return () => { window.sb.removeChannel(channel); };
  }, [fetchAll]);

  return state;
};
window.useLiveAttendance = useLiveAttendance;

// Live roster hook — all active staff with today's attendance row joined.
// Shape: { id, name, role, section, status, inTime }
// status in the frontend uses 'leave' (matches mock); DB stores 'on_leave'.
// ──────────────────────────────────────────────────────────
const fmtTime = (t) => {
  if (!t) return null;
  // t is 'HH:MM:SS' from postgres time; convert to h:mm 12-hour format
  const [hRaw, m] = t.split(':');
  const h = parseInt(hRaw, 10);
  const hh = h % 12 || 12;
  return `${hh}:${m}`;
};

const DB_TO_UI = { present: 'present', late: 'late', absent: 'absent', on_leave: 'leave' };
const UI_TO_DB = { present: 'present', late: 'late', absent: 'absent', leave:  'on_leave' };

const useLiveRoster = () => {
  const [roster, setRoster]   = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    const today = new Date().toISOString().slice(0, 10);

    const { data: emp } = await window.sb
      .from('employees')
      .select('id, name, role, section_id, user_type, is_active')
      .eq('user_type', 'staff')
      .eq('is_active', true)
      .order('id');

    const { data: att } = await window.sb
      .from('attendance')
      .select('employee_id, status, punch_in_time')
      .eq('date', today);

    const byId = {};
    (att || []).forEach(a => { byId[a.employee_id] = a; });

    const rows = (emp || []).map(e => {
      const a = byId[e.id];
      return {
        id:      e.id,
        name:    e.name,
        role:    e.role,
        section: e.section_id,
        status:  a ? (DB_TO_UI[a.status] || null) : null,
        inTime:  a ? fmtTime(a.punch_in_time) : null,
      };
    });

    setRoster(rows);
    setLoading(false);
  }, []);

  React.useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const channel = window.sb
      .channel('live-roster')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'attendance' },
        () => { fetchAll(); })
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'employees' },
        () => { fetchAll(); })
      .subscribe();
    return () => { window.sb.removeChannel(channel); };
  }, [fetchAll]);

  // Persist a status change to Supabase (upsert one row).
  const setStatus = React.useCallback(async (employeeId, uiStatus, markedBy) => {
    if (!window.sb) return;
    const today = new Date().toISOString().slice(0, 10);
    const dbStatus = UI_TO_DB[uiStatus];
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const hasInTime = uiStatus === 'present' || uiStatus === 'late';

    // Read existing row (if any) so we keep the existing punch_in_time
    // rather than re-stamping every tap.
    const { data: existing } = await window.sb
      .from('attendance')
      .select('punch_in_time')
      .eq('employee_id', employeeId)
      .eq('date', today)
      .maybeSingle();

    const punchIn = hasInTime
      ? (existing?.punch_in_time || `${hh}:${mm}:00`)
      : null;

    await window.sb
      .from('attendance')
      .upsert({
        employee_id:   employeeId,
        date:          today,
        status:        dbStatus,
        punch_in_time: punchIn,
        source:        'manual',
        marked_by:     markedBy || null,
      }, { onConflict: 'employee_id,date' });
  }, []);

  // Bulk mark all pending employees (no attendance row today) as present.
  const markAllPresent = React.useCallback(async (predicate, markedBy) => {
    if (!window.sb) return 0;
    const today = new Date().toISOString().slice(0, 10);
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const stamp = `${hh}:${mm}:00`;

    const targets = roster.filter(r => r.status === null && (!predicate || predicate(r)));
    if (!targets.length) return 0;

    await window.sb
      .from('attendance')
      .upsert(
        targets.map(t => ({
          employee_id:   t.id,
          date:          today,
          status:        'present',
          punch_in_time: stamp,
          source:        'manual',
          marked_by:     markedBy || null,
        })),
        { onConflict: 'employee_id,date' }
      );
    return targets.length;
  }, [roster]);

  return { roster, loading, setStatus, markAllPresent };
};
window.useLiveRoster = useLiveRoster;

  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
};

      .update({
        status:     action,
        decided_by: deciderId || null,
        decided_at: new Date().toISOString(),

      .eq('id', id);

const useLiveAdvances = () => {

    if (!window.sb) return;
    const { data } = await window.sb
      .from('advances')
      .select('*, employees!advances_employee_id_fkey(name, role, section_id, city), decider:employees!advances_decided_by_fkey(id, name)')
      .order('created_at', { ascending: false });
    setItems((data || []).filter(r => r.employees));
    setLoading(false);
  }, []);

  React.useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const ch = window.sb.channel('live-advances')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'advances' },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);

  const file = React.useCallback(async ({ employeeId, amount, months, reason, filedBy }) => {
    if (!window.sb) return;
    return await window.sb.from('advances').insert({
      employee_id: employeeId,
      amount_requested: amount,
      months_total: months,
      reason: reason || null,
      status: 'pending',
      filed_by: filedBy || null,
    });
  }, []);

  const decide = React.useCallback(async ({ id, action, amount, months, note, deciderId }) => {

// ──────────────────────────────────────────────────────────
// Live announcements hook. Produces a human-readable "at" string
// from created_at so the UI matches the existing mock shape.
// ──────────────────────────────────────────────────────────
const relTime = (iso) => {
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60)        return 'Just now';
  if (diff < 3600)      return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400)     return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 172800)    return 'Yesterday';
  if (diff < 604800)    return `${Math.floor(diff / 86400)} days ago`;
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
};

const useLiveAnnouncements = () => {
  const [items, setItems]     = React.useState([]);
  const [loading, setLoading] = React.useState(true);

  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('announcements')
      .select('*')
      .order('pinned', { ascending: false })
      .order('created_at', { ascending: false });
    setItems((data || []).map(a => ({
      id: a.id, title: a.title,
      by: a.posted_by, pinned: a.pinned,
      at: relTime(a.created_at),
      body: a.body || null,
    })));
    setLoading(false);
  }, []);

  React.useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const channel = window.sb
      .channel('live-announcements')
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'announcements' },
        () => { fetchAll(); })
      .subscribe();
    // Refresh the relative times every 60s so "2h ago" stays accurate.
    const tick = setInterval(fetchAll, 60000);
    return () => { window.sb.removeChannel(channel); clearInterval(tick); };
  }, [fetchAll]);

  return { items, loading };
};
window.useLiveAnnouncements = useLiveAnnouncements;

const fmtVisitTime = (iso) => {
  if (!iso) return null;
  const d = new Date(iso);
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ap}`;
};

// ──────────────────────────────────────────────────────────
// Single-employee hook for the staff home screen — combines the
// employee row with today's attendance status + punch in/out writes.
// ──────────────────────────────────────────────────────────
const useLiveStaffEmployee = (employeeId) => {
  const [employee, setEmployee] = React.useState(null);
  const [today, setToday]       = React.useState(null);
  const [loading, setLoading]   = React.useState(true);

  const fetchAll = React.useCallback(async () => {
    if (!window.sb || !employeeId) return;
    const dateStr = new Date().toISOString().slice(0, 10);
    const [empRes, attRes] = await Promise.all([
      window.sb.from('employees').select('id, name, role, section_id, joined_date, user_type').eq('id', employeeId).maybeSingle(),
      window.sb.from('attendance').select('status, punch_in_time, punch_out_time').eq('employee_id', employeeId).eq('date', dateStr).maybeSingle(),
    ]);
    setEmployee(empRes.data || null);
    setToday(attRes.data || null);
    setLoading(false);
  }, [employeeId]);

  React.useEffect(() => {
    if (!window.sb || !employeeId) return;
    fetchAll();
    const channel = window.sb
      .channel(`staff-${employeeId}`)
      .on('postgres_changes',
        { event: '*', schema: 'public', table: 'attendance', filter: `employee_id=eq.${employeeId}` },
        () => { fetchAll(); })
      .subscribe();
    return () => { window.sb.removeChannel(channel); };
  }, [fetchAll, employeeId]);

  const punchIn = React.useCallback(async () => {
    if (!window.sb || !employeeId) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    await window.sb.from('attendance').upsert({
      employee_id: employeeId,
      date:        now.toISOString().slice(0, 10),
      status:      now.getHours() >= 10 ? 'late' : 'present',
      punch_in_time: `${hh}:${mm}:00`,
      source:      'self',
    }, { onConflict: 'employee_id,date' });
  }, [employeeId]);

  const punchOut = React.useCallback(async () => {
    if (!window.sb || !employeeId || !today) return;
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    await window.sb.from('attendance')
      .update({ punch_out_time: `${hh}:${mm}:00` })
      .eq('employee_id', employeeId)
      .eq('date', now.toISOString().slice(0, 10));
  }, [employeeId, today]);

  return { employee, today, loading, punchIn, punchOut };
};
window.useLiveStaffEmployee = useLiveStaffEmployee;

// ──────────────────────────────────────────────────────────
// HR home stats — new joiners (last 7 days), latest late-arrival
// names, latest absent names. Derived from existing tables, so no
// extra schema needed.
// ──────────────────────────────────────────────────────────
const useLiveHRStats = () => {
  const [stats, setStats] = React.useState({
    newJoinersWeek: 0,
    lateNames:  [],
    absentNames:[],
    newJoinerName: null,
  });

  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    const today = new Date();
    const weekAgo = new Date(today);
    weekAgo.setDate(today.getDate() - 7);
    const todayStr   = today.toISOString().slice(0, 10);
    const weekAgoStr = weekAgo.toISOString().slice(0, 10);

    const [joinersRes, lateRes, absentRes, lastJoinerRes] = await Promise.all([
      // New joiners (last 7 days)
      window.sb
        .from('employees')
        .select('id', { count: 'exact', head: true })
        .gte('joined_date', weekAgoStr)
        .lte('joined_date', todayStr),
      // Today's late names (up to 3)
      window.sb
        .from('attendance')
        .select('employee_id, employees(name, section_id)')
        .eq('date', todayStr)
        .eq('status', 'late')
        .limit(5),
      // Today's absent names (up to 3)
      window.sb
        .from('attendance')
        .select('employee_id, employees(name, section_id)')
        .eq('date', todayStr)
        .eq('status', 'absent')
        .limit(5),
      // Most recent joiner (single row) for the attention card subtitle
      window.sb
        .from('employees')
        .select('name, role, section_id, joined_date')
        .gte('joined_date', weekAgoStr)
        .order('joined_date', { ascending: false })
        .limit(1)
        .maybeSingle(),
    ]);

    const latestJoiner = lastJoinerRes.data;
    setStats({
      newJoinersWeek: joinersRes.count || 0,
      lateNames:   (lateRes.data   || []).map(r => r.employees?.name).filter(Boolean),
      absentNames: (absentRes.data || []).map(r => r.employees?.name).filter(Boolean),
      newJoinerName: latestJoiner
        ? `${latestJoiner.name} — ${SECTION_LABEL[latestJoiner.section_id] || ''} Section ${latestJoiner.role}`
        : null,
    });
  }, []);

  React.useEffect(() => {
    if (!window.sb) return;
    fetchAll();
    const channel = window.sb
      .channel('live-hr-stats')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' },  () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(channel); };
  }, [fetchAll]);

  return stats;
};
window.useLiveHRStats = useLiveHRStats;

// ──────────────────────────────────────────────────────────
// Login — picks a role, then the specific person within that role.
// Only employees with a user_access row can log in.
// ──────────────────────────────────────────────────────────

const ROLE_HOME = {
  owner:      'ownerHome',
  hr:         'hrHome',
  manager:    'managerHome',
  supervisor: 'managerHome',
};

const ROLE_UI = {
  owner:      { icon: 'sparkle', tone: 'brand', title: 'Owner',      titleTa: 'உரிமையாளர்' },
  hr:         { icon: 'people',  tone: 'info',  title: 'HR',         titleTa: 'மனிதவள துறை' },
  manager:    { icon: 'store',   tone: 'gold',  title: 'Manager',    titleTa: 'மேலாளர்' },
  supervisor: { icon: 'user',    tone: 'gold',  title: 'Supervisor', titleTa: 'கண்காணிப்பாளர்' },
};

const useLoginUsers = () => {
  const [users, setUsers]     = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const fetchAll = React.useCallback(async () => {
    if (!window.sb) return;
    const { data } = await window.sb
      .from('user_access')
      .select('employee_id, section_ids, all_sections, username, password_sha256, employees(id, name, role, section_id, user_type, is_active)')
      .order('employee_id');
    const rows = (data || [])
      .filter(u => u.employees && u.employees.is_active !== false)
      .map(u => ({
        id: u.employee_id,
        name: u.employees.name,
        role: u.employees.role,
        section_id: u.employees.section_id,
        user_type: u.employees.user_type,
        all_sections: u.all_sections,
        section_ids: u.section_ids || [],
        username: u.username || null,
        password_sha256: u.password_sha256 || null,
      }));
    setUsers(rows);
    setLoading(false);
  }, []);
  React.useEffect(() => {
    fetchAll();
    if (!window.sb) return;
    const ch = window.sb.channel('login-users')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'user_access' }, () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees' },   () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll]);
  return { users, loading };
};

// Kiosk PIN prompt used on the Login screen. PIN stored in settings.kiosk_pin.
const KioskPinPrompt = ({ onClose, onSuccess }) => {
  const T_ = window.TOKENS;
  const [pin, setPin] = React.useState('');
  const [err, setErr] = React.useState(false);
  const [busy, setBusy] = React.useState(false);

  const submit = async (e) => {
    if (e) e.preventDefault();
    if (busy || !window.sb) return;
    setBusy(true); setErr(false);
    try {
      const { data } = await window.sb.from('settings')
        .select('value').eq('key', 'kiosk_pin').maybeSingle();
      const expected = (data?.value || '0000').trim();
      if (pin === expected) onSuccess();
      else setErr(true);
    } finally { setBusy(false); }
  };

  return (
    <div onClick={onClose} style={{
      position: 'absolute', inset: 0, background: 'rgba(11, 13, 14, 0.6)',
      display: 'flex', alignItems: 'flex-end', zIndex: 200,
    }}>
      <form onSubmit={submit}
        onClick={e => e.stopPropagation()}
        style={{
          width: '100%', background: T_.surface, borderRadius: '20px 20px 0 0',
          padding: '22px 22px 28px', maxHeight: '80%', overflowY: 'auto',
        }}>
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif', fontSize: 22,
          fontWeight: 500, color: T_.ink, letterSpacing: -0.4, marginBottom: 4,
        }}>Open attendance kiosk</div>
        <div style={{ fontSize: 12.5, color: T_.inkMuted, marginBottom: 20 }}>
          Enter the kiosk PIN to launch face-scan attendance mode. The app will stay in kiosk mode until the PIN is entered again to exit.
        </div>

        <div style={{
          fontSize: 11, fontWeight: 600, color: T_.inkMuted,
          letterSpacing: 0.5, textTransform: 'uppercase', marginBottom: 6,
        }}>Kiosk PIN</div>
        <input type="password" inputMode="numeric" autoFocus
          value={pin}
          onChange={e => { setPin(e.target.value); setErr(false); }}
          placeholder="0000"
          style={{
            width: '100%', padding: '14px 16px', borderRadius: 12,
            background: T_.bg, border: `1px solid ${err ? T_.danger : T_.border}`,
            fontSize: 18, fontFamily: 'JetBrains Mono, Menlo, monospace',
            color: T_.ink, boxSizing: 'border-box', outline: 'none',
            letterSpacing: 6, textAlign: 'center',
          }} />
        {err && (
          <div style={{ fontSize: 12, color: T_.danger, marginTop: 8 }}>
            Wrong PIN — try again
          </div>
        )}

        <div style={{ display: 'flex', gap: 8, marginTop: 18 }}>
          <button type="button" onClick={onClose} style={{
            flex: 1, padding: 14, borderRadius: 12,
            background: T_.surface, border: `1px solid ${T_.border}`,
            color: T_.ink, fontSize: 13, fontWeight: 600,
            fontFamily: 'inherit', cursor: 'pointer',
          }}>Cancel</button>
          <button type="submit" disabled={busy || !pin} style={{
            flex: 1.2, padding: 14, borderRadius: 12,
            background: '#0B0D0E', color: '#fff', border: 'none',
            fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
            cursor: (busy || !pin) ? 'not-allowed' : 'pointer',
            opacity: (busy || !pin) ? 0.5 : 1,
          }}>{busy ? 'Checking…' : 'Launch kiosk'}</button>
        </div>
      </form>
    </div>
  );
};
window.KioskPinPrompt = KioskPinPrompt;

const LoginScreen = () => {
  const { nav, setUser, setUserId } = useApp();
  const t = useT();
  const T_ = window.TOKENS;
  const M = window.MOCK;
  const { users, loading } = useLoginUsers();

  // Group users by user_type. Only show a role card if ≥1 user exists.
  const grouped = React.useMemo(() => {
    const g = { owner: [], hr: [], manager: [], supervisor: [] };
    users.forEach(u => { if (g[u.user_type]) g[u.user_type].push(u); });
    return g;
  }, [users]);

  // Which role's picker is currently open.
  const [openRole, setOpenRole] = React.useState(null);
  // If a user has a password, show a prompt instead of logging in immediately.
  const [pwdFor, setPwdFor] = React.useState(null); // { role, emp }
  const [pwdInput, setPwdInput] = React.useState('');
  const [pwdErr, setPwdErr] = React.useState(false);
  const [pwdBusy, setPwdBusy] = React.useState(false);
  // Kiosk launch state
  const [kioskPromptOpen, setKioskPromptOpen] = React.useState(false);

  const doSignIn = (role, emp) => {
    setUser(role);
    setUserId(emp.id);
    nav.reset(ROLE_HOME[role] || 'ownerHome');
  };

  const signIn = (role, emp) => {
    // If this user has a password set, require it before logging in.
    if (emp.password_sha256) {
      setPwdFor({ role, emp });
      setPwdInput('');
      setPwdErr(false);
      return;
    }
    doSignIn(role, emp);
  };

  const submitPassword = async (e) => {
    if (e) e.preventDefault();
    if (!pwdFor || pwdBusy) return;
    setPwdBusy(true);
    setPwdErr(false);
    try {
      const hash = await window.sha256(pwdInput);
      if (hash === pwdFor.emp.password_sha256) {
        doSignIn(pwdFor.role, pwdFor.emp);
      } else {

const AttendanceScreen = () => {
  const t = useT();
  const T_ = window.TOKENS;
  const M = window.MOCK;
  const { user, userAccess } = useApp();
  const [section, setSection] = React.useState('all');
  const [statusFilter, setStatusFilter] = React.useState(
    () => window.__attendanceFilter || 'all'
  );
  React.useEffect(() => {
    if (window.__attendanceFilter) {
      setStatusFilter(window.__attendanceFilter);
      delete window.__attendanceFilter;
    }
  }, []);
  const [detail, setDetail] = React.useState(null);  // selected employee_id

  const { roster: liveRoster, loading } = window.useLiveRoster
    ? window.useLiveRoster()
    : { roster: [], loading: false };
  const live = window.useLiveAttendance ? window.useLiveAttendance() : { attendance: null };
  const a = live.attendance || M.attendance;

  // Section scoping — owner/hr/all_sections see everyone; manager/supervisor
  // see only their assigned sections.
  const isAdmin = user === 'owner' || user === 'hr';
  const hasAll = isAdmin || !!(userAccess && userAccess.all_sections);
  const allowed = hasAll ? null : (userAccess?.section_ids || []);

  // Map DB rows (status/inTime) onto the shape RosterRow expects.
  const roster = liveRoster
    .filter(r => hasAll || allowed.includes(r.section))
    .map(r => ({
      id:      r.id,
      name:    r.name,
      role:    r.role,
      section: r.section,
      status:  r.status || 'absent',
      in:      r.inTime || '—',
      out:     '—',
    }));

  const sectionMeta = {
    fancy:  { label: 'Fancy',   full: 'Fancy Section' },
    cotton: { label: 'Cotton',  full: 'Cotton Section' },
    silk:   { label: 'Silk',    full: 'Silk Section' },
    dhoti:  { label: 'Dhoti',   full: 'Dhoties & Shirting' },
  };

  // Section tabs: 'All' + the user's allowed sections.
  const availableSections = hasAll
    ? ['fancy', 'cotton', 'silk', 'dhoti']
    : (allowed || []);

  const filteredBySection = section === 'all' ? roster : roster.filter(r => r.section === section);
  const filtered = statusFilter === 'all'
    ? filteredBySection
    : filteredBySection.filter(r => r.status === statusFilter);

  // Stats reflect the currently-selected section (but ignore the status
  // filter so all four numbers are visible even when the roster list is
  // filtered to, say, just 'late').
  const scopedStats = {
    total:   filteredBySection.length,
    present: filteredBySection.filter(r => r.status === 'present').length,
    late:    filteredBySection.filter(r => r.status === 'late').length,
    absent:  filteredBySection.filter(r => r.status === 'absent').length,
    onLeave: filteredBySection.filter(r => r.status === 'leave').length,
  };

  return (
    <div style={{ background: T_.bg, minHeight: '100%', paddingBottom: 30 }}>
      <ScreenHeader back title="Attendance" subtitle="Live · Today 18 Apr 2026" />

      <div style={{ padding: '0 16px' }}>
        {/* Stats strip */}
        <div style={{
          display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8, marginBottom: 18,
        }}>
          <AttStat label="Present" value={scopedStats.present} color={T_.success} />
          <AttStat label="Late"    value={scopedStats.late}    color={T_.warning} />
          <AttStat label="Leave"   value={scopedStats.onLeave} color={T_.info} />
          <AttStat label="Absent"  value={scopedStats.absent}  color={T_.danger} />
        </div>

        {/* Section filter tabs */}
        <div style={{
          display: 'flex', gap: 6, marginBottom: 14,
          background: T_.surfaceAlt, padding: 4, borderRadius: 12,
        }}>
          {[
            { id: 'all', label: 'All' },
            ...availableSections.map(sid => ({ id: sid, label: sectionMeta[sid]?.label || sid })),
          ].map(f => (
            <button key={f.id} onClick={() => setSection(f.id)} style={{
              flex: 1, padding: '8px 4px', borderRadius: 8,
              background: section === f.id ? T_.surface : 'transparent',
              border: 'none', cursor: 'pointer', fontFamily: 'inherit',
              fontSize: 12, fontWeight: 600,
              color: section === f.id ? T_.ink : T_.inkMuted,
              boxShadow: section === f.id ? '0 1px 2px rgba(0,0,0,0.05)' : 'none',
            }}>{f.label}</button>
          ))}
        </div>

        {/* Status filter chips */}
        <div style={{
          display: 'flex', gap: 6, marginBottom: 14, overflowX: 'auto',
          WebkitOverflowScrolling: 'touch',
        }}>
          {[
            { id: 'all',     label: `All · ${filteredBySection.length}`, tone: null },
            { id: 'present', label: `Present · ${filteredBySection.filter(r => r.status === 'present').length}`, tone: T_.success },
            { id: 'late',    label: `Late · ${filteredBySection.filter(r => r.status === 'late').length}`,       tone: T_.warning },
            { id: 'absent',  label: `Absent · ${filteredBySection.filter(r => r.status === 'absent').length}`,   tone: T_.danger },
            { id: 'leave',   label: `Leave · ${filteredBySection.filter(r => r.status === 'leave').length}`,     tone: T_.info },
          ].map(f => {
            const active = statusFilter === f.id;
            return (
              <button key={f.id} onClick={() => setStatusFilter(f.id)} style={{
                padding: '6px 12px', borderRadius: 999,
                background: active ? (f.tone || T_.ink) : T_.surface,
                border: `1px solid ${active ? (f.tone || T_.ink) : T_.border}`,
                color: active ? '#fff' : T_.inkSoft,
                fontSize: 11.5, fontWeight: 600, cursor: 'pointer',
                fontFamily: 'inherit', whiteSpace: 'nowrap',
              }}>{f.label}</button>
            );
          })}
        </div>

        {/* Roster */}
        <div style={{
          background: T_.surface, border: `1px solid ${T_.border}`, borderRadius: 16,
          overflow: 'hidden',
        }}>
          {filtered.map((r, i) => (
            <RosterRow key={i} row={r} last={i === filtered.length - 1}
              sectionLabel={sectionMeta[r.section]?.label}
              onOpen={() => r.id && setDetail(r.id)} />

        <div style={{ fontSize: 11, color: T_.inkFaint, textAlign: 'center', marginTop: 14 }}>
          {loading ? 'Loading…' : `Showing ${filtered.length} of ${roster.length} staff${section !== 'all' ? ' in this section' : ''}`}
        </div>
      </div>

      {detail && (
        <EmployeeDetailSheet
          employeeId={detail}
          onClose={() => setDetail(null)}
        />
      )}
    </div>
  );
};

// ─────────────────────────────────────────────────────────────
// Employee detail sheet — opens when a manager/HR/owner taps a
// person in the Attendance roster. Shows basic details + face
// enrollment status, with Edit and Update-face actions for admins.
// ─────────────────────────────────────────────────────────────
const EmployeeDetailSheet = ({ employeeId, onClose }) => {
  const { user, toast } = useApp();
  const T_ = window.TOKENS;
  const canEdit = user === 'owner' || user === 'hr';

  const [emp, setEmp] = React.useState(null);
  const [faceCount, setFaceCount] = React.useState(0);
  const [loading, setLoading] = React.useState(true);
  const [editing, setEditing] = React.useState(false);
  const [reEnroll, setReEnroll] = React.useState(false);

  const fetchAll = React.useCallback(async () => {
    if (!window.sb || !employeeId) return;
    const [empRes, faceRes] = await Promise.all([
      window.sb.from('employees')
        .select('id, name, role, section_id, user_type, is_active, joined_date, phone, city')
        .eq('id', employeeId).maybeSingle(),
      window.sb.from('face_embeddings').select('pose').eq('employee_id', employeeId),
    ]);
    setEmp(empRes.data || null);
    setFaceCount((faceRes.data || []).length);
    setLoading(false);
  }, [employeeId]);

  React.useEffect(() => {
    fetchAll();
    if (!window.sb) return;
    const ch = window.sb.channel(`detail-${employeeId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'face_embeddings', filter: `employee_id=eq.${employeeId}` },
        () => fetchAll())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'employees', filter: `id=eq.${employeeId}` },
        () => fetchAll())
      .subscribe();
    return () => { window.sb.removeChannel(ch); };
  }, [fetchAll, employeeId]);

// 3-pose webcam re-enrollment for an existing employee.
const MobileFaceReEnrollSheet = ({ employee, onClose, onDone }) => {
  const T_ = window.TOKENS;
  const videoRef = React.useRef(null);
  const [modelsReady, setModelsReady] = React.useState(false);
  const [cameraErr, setCameraErr] = React.useState(null);
  const [shots, setShots] = React.useState([null, null, null]);
  const [step, setStep] = React.useState(0);
  const [busy, setBusy] = React.useState(false);
  const [hint, setHint] = React.useState('Loading face models…');
  const [saving, setSaving] = React.useState(false);

  const poses = [
    { key: 'front', label: 'Look straight' },
    { key: 'left',  label: 'Slight left' },
    { key: 'right', label: 'Slight right' },
  ];

  React.useEffect(() => {
    let stream = null, cancelled = false;
    (async () => {
      try {
        await window.loadFaceModels();
        if (cancelled) return;
        setModelsReady(true);
        setHint('Opening camera…');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false,
        });
        if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
        }
        setHint('');
      } catch (err) {
        setCameraErr(err.name === 'NotAllowedError'
          ? 'Camera permission denied'
          : 'Could not open camera');
      }
    })();
    return () => {
      cancelled = true;
      if (stream) stream.getTracks().forEach(t => t.stop());
    };
  }, []);

  const capture = async () => {
    if (!modelsReady || busy) return;
    setBusy(true); setHint('Detecting face…');
    try {
      const desc = await window.computeFaceDescriptor(videoRef.current);
      if (!desc) { setHint('No face detected — move closer'); return; }
      setShots(s => s.map((x, i) => i === step ? desc : x));
      setHint('');
      if (step < 2) setStep(step + 1);
    } finally { setBusy(false); }
  };

  const allCaptured = shots.every(s => s);
  const save = async () => {
    if (!allCaptured || saving) return;
    setSaving(true);
    try {
      await window.sb.from('face_embeddings').delete().eq('employee_id', employee.id);
      await window.sb.from('face_embeddings').insert(
        shots.map((d, i) => ({ employee_id: employee.id, pose: poses[i].key, embedding: d }))
      );
      onDone();
    } finally { setSaving(false); }
  };

  return (
    <div onClick={onClose} style={{
      position: 'absolute', inset: 0, background: 'rgba(11, 13, 14, 0.7)',
      display: 'flex', alignItems: 'flex-end', zIndex: 170,
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: '100%', background: T_.surface, borderRadius: '20px 20px 0 0',
        padding: 20, maxHeight: '90%', overflowY: 'auto',
      }}>
        <div style={{
          fontFamily: 'Fraunces, Georgia, serif', fontSize: 20,
          fontWeight: 500, color: T_.ink, letterSpacing: -0.3, marginBottom: 4,
        }}>Update face · {employee.name}</div>
        <div style={{ fontSize: 12.5, color: T_.inkMuted, marginBottom: 14 }}>
          Step {Math.min(step + 1, 3)} of 3 — {poses[Math.min(step, 2)].label}
        </div>

        <div style={{
          position: 'relative', width: '100%', aspectRatio: '3 / 4',
          background: '#0B0D0E', borderRadius: 18, overflow: 'hidden',
          border: `1px solid ${T_.border}`, marginBottom: 12,
        }}>
          <video ref={videoRef} autoPlay playsInline muted
            style={{
              position: 'absolute', inset: 0,
              width: '100%', height: '100%', objectFit: 'cover',
              transform: 'scaleX(-1)',
              opacity: cameraErr ? 0 : 1,
            }} />
          <div style={{
            position: 'absolute', top: '50%', left: '50%',
            transform: 'translate(-50%, -50%)',
            width: '60%', height: '70%', borderRadius: '50%',
            border: '2px dashed rgba(255,255,255,0.45)',
            pointerEvents: 'none',
          }} />
          {(hint || cameraErr) && (
            <div style={{
              position: 'absolute', left: 12, right: 12, bottom: 12,
              background: 'rgba(11,13,14,0.7)', color: '#fff',
              padding: '8px 12px', borderRadius: 10, fontSize: 12, textAlign: 'center',
            }}>{cameraErr || hint}</div>
          )}
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 14 }}>
          {poses.map((p, i) => (
            <div key={p.key} style={{
              aspectRatio: '1', borderRadius: 10,
              background: shots[i] ? T_.maroonSoft : T_.surfaceAlt,
              border: `1px solid ${shots[i] ? T_.maroon : step === i ? T_.gold : T_.border}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexDirection: 'column', gap: 4,
            }}>
              <div style={{
                fontSize: 10.5, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase',
                color: shots[i] ? T_.maroon : T_.inkMuted,
              }}>{p.key}</div>
              <div style={{ fontSize: 11, color: shots[i] ? T_.maroon : T_.inkFaint }}>
                {shots[i] ? '✓' : step === i ? 'Ready' : '—'}
              </div>
            </div>
          ))}
        </div>

        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={onClose} disabled={saving} style={{
            flex: 1, padding: 12, borderRadius: 12,
            background: T_.surface, border: `1px solid ${T_.border}`,
            color: T_.ink, fontSize: 13, fontWeight: 600,
            fontFamily: 'inherit', cursor: 'pointer',
          }}>Cancel</button>
          {!allCaptured ? (
            <button onClick={capture} disabled={!modelsReady || busy || !!cameraErr}
              style={{
                flex: 1.2, padding: 12, borderRadius: 12,
                background: T_.maroon, color: '#fff', border: 'none',
                fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
                cursor: (busy || !modelsReady || cameraErr) ? 'not-allowed' : 'pointer',
                opacity: (busy || !modelsReady || cameraErr) ? 0.5 : 1,
              }}>
              {busy ? 'Detecting…' : !modelsReady ? 'Loading…' : `Capture ${poses[Math.min(step, 2)].key}`}
            </button>
          ) : (
            <button onClick={save} disabled={saving} style={{
              flex: 1.2, padding: 12, borderRadius: 12,
              background: T_.success, color: '#fff', border: 'none',
              fontSize: 13, fontWeight: 600, fontFamily: 'inherit',
              cursor: saving ? 'not-allowed' : 'pointer',
              opacity: saving ? 0.6 : 1,
            }}>{saving ? 'Saving…' : 'Save face data'}</button>
          )}
        </div>
      </div>
    </div>
  );
};

// Leaves screen — owner approval flow + staff apply leave

const LeavesScreen = () => {
  const { nav, toast, user, userId, userAccess } = useApp();
  const t = useT();
  const T_ = window.TOKENS;
  const { items: allItems, loading, decide } = window.useLiveLeaves
    ? window.useLiveLeaves()
    : { items: [], loading: false, decide: async () => {} };
  const [active, setActive] = React.useState(null);

  const isAdmin = user === 'owner' || user === 'hr';
  const hasAll = isAdmin || !!(userAccess && userAccess.all_sections);
  const allowed = hasAll ? null : (userAccess?.section_ids || []);
  // Approval is owner/hr-only by policy. Managers + Supervisors can
  // submit leave requests (via Apply Leave) but cannot approve them.
  const canApprove = user === 'owner' || user === 'hr';

  // Manager/Supervisor see their sections' requests + always their own.
  const items = allItems.filter(r =>
    hasAll
    || (r.section_id && allowed.includes(r.section_id))
    || r.employee_id === userId
  );

  const handleAction = async (id, action) => {
    if (!canApprove) { toast('You don\u2019t have leave approval rights'); return; }
    const target = items.find(x => x.id === id);
    await decide(id, action, userId || 'E000');
    toast(action === 'approved'
      ? `Leave approved for ${target?.name || 'employee'}`
      : 'Leave rejected');
    setActive(null);
  };

  const pending = items.filter(x => x.status === 'pending');
  const decided = items.filter(x => x.status !== 'pending');

  return (
    <div style={{ background: T_.bg, minHeight: '100%', paddingBottom: 90 }}>
      <ScreenHeader back title={t('leaveRequests')}
        subtitle={canApprove
          ? `${pending.length} awaiting your decision`

        }}>
          <MiniStat label="Pending"  value={pending.length} tone="warning" />
          <MiniStat label="Approved" value={items.filter(x=>x.status==='approved').length} tone="success" />
          <MiniStat label="Rejected" value={items.filter(x=>x.status==='rejected').length} tone="danger" />
        </div>

        {pending.length > 0 && (

            <div style={{ fontSize: 12, fontWeight: 600, color: T_.inkMuted, letterSpacing: 0.5, textTransform: 'uppercase', padding: '0 4px', marginBottom: 10 }}>

// ─── Apply Leave — anyone signed in submits a request for themselves ──
const ApplyLeaveScreen = () => {
  const { nav, toast, user, userId, userAccess } = useApp();
  const T_ = window.TOKENS;
  const { submit: persistLeave } = window.useLiveLeaves
    ? window.useLiveLeaves()
    : { submit: async () => {} };
  const [type, setType] = React.useState('Casual');
  const [days, setDays] = React.useState(1);
  const [reason, setReason] = React.useState('');
  const [employeeId, setEmployeeId] = React.useState(userId || '');
  const [submitting, setSubmitting] = React.useState(false);

  // Keep the picker in sync with the signed-in user when it changes.
  React.useEffect(() => {
    if (userId && !employeeId) setEmployeeId(userId);
  }, [userId, employeeId]);

  // Pool of employees the user can file a leave for.
  const isAdmin = user === 'owner' || user === 'hr';
  const hasAll  = isAdmin || !!(userAccess && userAccess.all_sections);
  const allowed = hasAll ? null : (userAccess?.section_ids || []);

  const [people, setPeople] = React.useState([]);
  React.useEffect(() => {
    if (!window.sb) return;
    let cancelled = false;
    (async () => {
      let q = window.sb.from('employees')
        .select('id, name, role, section_id, user_type')
        .eq('is_active', true)
        .order('name');
      const { data } = await q;
      if (cancelled) return;
      const rows = (data || []).filter(e => {
        if (e.id === userId) return true;                    // always allow self
        if (hasAll) return true;                             // owner / hr / all_sections
        if (!e.section_id) return false;                     // other admins without a section
        return allowed.includes(e.section_id);               // staff in my sections
      });
      setPeople(rows);
    })();
    return () => { cancelled = true; };
  }, [hasAll, allowed ? allowed.join(',') : '', userId]);

  const pickedName = React.useMemo(() =>
    people.find(p => p.id === employeeId)?.name || '', [people, employeeId]);

  const submit = async () => {
    if (submitting || !reason.trim()) return;
    if (!employeeId) { toast('Pick a person'); return; }
    setSubmitting(true);
    const fromDate = new Date();
    fromDate.setDate(fromDate.getDate() + 2); // default: from day after tomorrow
    try {
      await persistLeave({
        employeeId,
        type,
        days,
        fromDate: fromDate.toISOString().slice(0, 10),
        reason: reason.trim(),
      });
      toast(employeeId === userId
        ? 'Leave request submitted for approval'
        : `Leave request filed for ${pickedName}`);
      setTimeout(() => nav.back(), 500);
    } catch (err) {
      toast('Could not submit — try again');
    } finally {
      setSubmitting(false);
    }
  };

  const subtitle = employeeId === userId
    ? 'Your request will be reviewed by HR / Owner'
    : 'Filing on behalf of a team member';

  return (
    <div style={{ background: T_.bg, minHeight: '100%' }}>
      <ScreenHeader back title="Apply leave" subtitle={subtitle} />
      <div style={{ padding: '0 20px' }}>
        <FieldLabel>For whom</FieldLabel>
        <select
          value={employeeId}
          onChange={e => setEmployeeId(e.target.value)}
          style={{
            width: '100%', padding: '12px 14px', borderRadius: 12,
            background: T_.surface, border: `1px solid ${T_.border}`,
            fontSize: 14, color: T_.ink, fontFamily: 'inherit',
            boxSizing: 'border-box', outline: 'none', cursor: 'pointer',
            marginBottom: 20,
          }}>
          {userId && !people.find(p => p.id === userId) && (
            <option value={userId}>Myself</option>
          )}
          {people.map(p => (
            <option key={p.id} value={p.id}>
              {p.name}{p.id === userId ? ' (me)' : ''}
              {p.role ? ` · ${p.role}` : ''}
              {p.section_id ? ` · ${SECTION_LABEL[p.section_id] || p.section_id}` : ''}
            </option>
          ))}
        </select>

        <FieldLabel>Leave type</FieldLabel>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 20 }}>
          {['Casual', 'Sick', 'Earned'].map(t => (
            <button key={t} onClick={() => setType(t)} style={{
              padding: '12px 8px', borderRadius: 12,
              background: type === t ? T_.maroon : T_.surface,
              border: `1px solid ${type === t ? T_.maroon : T_.border}`,
              color: type === t ? '#fff' : T_.ink,
              fontSize: 13, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit',
            }}>{t}</button>
          ))}
        </div>

        <FieldLabel>Duration</FieldLabel>
        <div style={{
          background: T_.surface, border: `1px solid ${T_.border}`, borderRadius: 14,
          padding: 14, marginBottom: 20,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
            <div style={{ fontSize: 13, color: T_.inkSoft }}>Number of days</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
              <button onClick={() => setDays(Math.max(1, days - 1))} style={stepBtn(T_)}>−</button>
              <div style={{
                fontFamily: 'Fraunces, Georgia, serif',
                fontSize: 22, fontWeight: 600, color: T_.ink, minWidth: 24, textAlign: 'center',
              }}>{days}</div>
              <button onClick={() => setDays(days + 1)} style={stepBtn(T_)}>+</button>
            </div>
          </div>
          <div style={{ fontSize: 11.5, color: T_.inkMuted, paddingTop: 10, borderTop: `1px solid ${T_.borderSoft}` }}>
            From Mon, 20 Apr · Back on Tue, {20 + days} Apr
          </div>
        </div>

        <FieldLabel>Reason</FieldLabel>
        <textarea value={reason} onChange={e => setReason(e.target.value)} placeholder="Brief reason for your manager..." style={{
          width: '100%', minHeight: 100, padding: 14, borderRadius: 14,
          background: T_.surface, border: `1px solid ${T_.border}`,
          fontSize: 13.5, fontFamily: 'inherit', color: T_.ink, boxSizing: 'border-box',
          resize: 'none', outline: 'none', marginBottom: 8,
        }} />

        <div style={{ fontSize: 11.5, color: T_.inkMuted, marginBottom: 20 }}>
          Remaining balance: 8 casual · 12 earned · 3 sick
        </div>

        <Button full size="lg" onClick={submit} disabled={!reason.trim()}>Submit request</Button>
      </div>
    </div>
  );
};
